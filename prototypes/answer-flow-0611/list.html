<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>답변 못함 목록 — Connectia</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-base);
  background: #e0e0e0;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.frame {
  width: 390px;
  height: 844px;
  max-height: 100dvh;
  position: relative;
  overflow: hidden;
  box-shadow: 0 32px 80px -20px rgba(0,0,0,0.28);
  background: var(--color-surface);
  display: flex;
  flex-direction: column;
}
@media (max-width: 439px) { .frame { width: 100vw; height: 100dvh; max-height: none; } }
@media (min-width: 440px) { .frame { border-radius: 44px; max-height: calc(100dvh - 40px); } }

i[data-lucide] { display: inline-flex; flex-shrink: 0; }

/* Topbar */
.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: var(--color-surface);
  flex-shrink: 0;
}
.topbar-id {
  flex: 1;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-heading);
  font-weight: var(--fw-bold);
  color: var(--color-text);
  letter-spacing: var(--ls-heading);
  cursor: pointer;
}
.topbar-search { color: var(--color-text); cursor: pointer; }

/* Tabs (밑줄 탭) */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--color-border);
  background: var(--color-surface);
  flex-shrink: 0;
  padding: 0 8px;
}
.tab {
  flex: 1;
  padding: 12px 0;
  text-align: center;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  color: var(--color-text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.tab.is-active {
  color: var(--color-text);
  font-weight: var(--fw-bold);
  border-bottom-color: var(--color-text);
}
.tab-count {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  font-weight: var(--fw-regular);
}

/* Body */
.body { flex: 1; overflow-y: auto; background: var(--color-bg); }
.inner { padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px; }

/* Filter chips */
.chips {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0 4px;
}
.chip {
  padding: 6px 14px;
  border-radius: var(--r-full);
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  color: var(--color-text-sub);
  cursor: pointer;
  font-family: var(--font-base);
}
.chip.is-active {
  background: var(--color-text);
  border-color: var(--color-text);
  color: var(--color-on-primary);
}

/* Question card */
.q-card {
  background: var(--color-card);
  border-radius: var(--r-md);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: background var(--motion-fast) var(--ease-standard);
}
.q-card[onclick] { cursor: pointer; }
.q-card[onclick]:hover { background: var(--color-primary-light); }

.q-text {
  font-size: var(--fs-body-lg);
  color: var(--color-text);
  font-weight: var(--fw-medium);
  line-height: var(--lh-body-lg);
}
.q-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.q-meta {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.q-actions {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 12px 0 4px;
}
.pagination-info {
  font-size: var(--fs-body);
  color: var(--color-text-sub);
  min-width: 40px;
  text-align: center;
}

/* Resolved link 하단 */
.resolved-link {
  margin-top: 12px;
  padding: 16px;
  background: var(--color-surface);
  border: 1px dashed var(--color-border);
  border-radius: var(--r-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  cursor: pointer;
}
.resolved-text {
  font-size: var(--fs-body);
  color: var(--color-text-sub);
}
.resolved-meta {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  margin-top: 2px;
}
.resolved-chev {
  color: var(--color-text-muted);
}
</style>
</head>
<body>
<div class="frame">

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-id">
      자버 김윤정 매니저
      <i data-lucide="chevron-down" style="width:18px;height:18px"></i>
    </div>
    <i data-lucide="search" class="topbar-search" style="width:22px;height:22px"></i>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab">보냄 <span class="tab-count">2</span></div>
    <div class="tab">받음 <span class="tab-count">40</span></div>
    <div class="tab is-active">답변 못함 <span class="tab-count">11</span></div>
  </div>

  <!-- Body -->
  <div class="body">
    <div class="inner">

      <!-- Question cards -->
      <div class="q-card" onclick="location.href='chat-inline.html?q=q1'">
        <div class="q-text">단체카톡을 발송하려면 필요한 게 무엇인지 알려주세요</div>
        <div class="q-row">
          <span class="q-meta">3시간 전</span>
          <div class="q-actions">
            <button class="btn btn-sm btn-line-dark" onclick="event.stopPropagation()">무시</button>
            <button class="btn btn-sm btn-fill-primary" onclick="event.stopPropagation()">답변하기</button>
          </div>
        </div>
      </div>

      <div class="q-card">
        <div class="q-text">전화번호만 있으면 단체 카톡 발송이 가능한가요?</div>
        <div class="q-row">
          <span class="q-meta">어제</span>
          <div class="q-actions">
            <button class="btn btn-sm btn-line-dark" onclick="event.stopPropagation()">무시</button>
            <button class="btn btn-sm btn-fill-primary" onclick="event.stopPropagation()">답변하기</button>
          </div>
        </div>
      </div>

      <div class="q-card" onclick="location.href='chat-inline.html?q=q2'">
        <div class="q-text">카카오 비즈니스 채널 연결이 필수인가요?</div>
        <div class="q-row">
          <span class="q-meta">2일 전</span>
          <div class="q-actions">
            <button class="btn btn-sm btn-line-dark" onclick="event.stopPropagation()">무시</button>
            <button class="btn btn-sm btn-fill-primary" onclick="event.stopPropagation()">답변하기</button>
          </div>
        </div>
      </div>

      <div class="q-card">
        <div class="q-text">자버로 발송할 수 있는 카톡 형태를 보여주세요</div>
        <div class="q-row">
          <span class="q-meta">3일 전</span>
          <div class="q-actions">
            <button class="btn btn-sm btn-line-dark" onclick="event.stopPropagation()">무시</button>
            <button class="btn btn-sm btn-fill-primary" onclick="event.stopPropagation()">답변하기</button>
          </div>
        </div>
      </div>

      <div class="q-card">
        <div class="q-text">월 사용량 제한이 있나요?</div>
        <div class="q-row">
          <span class="q-meta">5일 전</span>
          <div class="q-actions">
            <button class="btn btn-sm btn-line-dark" onclick="event.stopPropagation()">무시</button>
            <button class="btn btn-sm btn-fill-primary" onclick="event.stopPropagation()">답변하기</button>
          </div>
        </div>
      </div>

      <!-- Pagination -->
      <div class="pagination">
        <button class="icon-btn icon-btn-sm icon-btn-border" disabled><i data-lucide="chevron-left" style="width:16px;height:16px"></i></button>
        <span class="pagination-info">1 / 3</span>
        <button class="icon-btn icon-btn-sm icon-btn-border"><i data-lucide="chevron-right" style="width:16px;height:16px"></i></button>
      </div>

      <!-- 처리됨 링크 -->
      <div class="resolved-link">
        <div>
          <div class="resolved-text">처리됨 12개</div>
          <div class="resolved-meta">해결 8 · 무시 4</div>
        </div>
        <i data-lucide="chevron-right" class="resolved-chev" style="width:18px;height:18px"></i>
      </div>

    </div>
  </div>
</div>

<script>
lucide.createIcons();
</script>
</body>
</html>
