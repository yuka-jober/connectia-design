  /* ============================================================
     블록 이동 (화살표 / 드래그)
     ============================================================ */
  function moveBlock(id, d) {
    const i = blocks.findIndex(b => b.id === id);
    const j = i + d;
    if (j < 0 || j >= blocks.length) return;
    const tmp = blocks[i]; blocks[i] = blocks[j]; blocks[j] = tmp;
    touch(); render();
    if (activeId === id) scrollToActive();
  }

  let drag = null;
  function gripDown(e, id) {
    if (previewMode) return;
    e.preventDefault(); e.stopPropagation();
    const grip = e.currentTarget;
    grip.setPointerCapture(e.pointerId);
    const row = document.querySelector('.block[data-block-id="' + id + '"]');
    const line = document.createElement('div');
    line.className = 'drop-line';
    $('canvas').appendChild(line);
    drag = { id, idx: null, line, grip };
    row.classList.add('is-dragging');
    document.body.classList.add('dragging');
    grip.addEventListener('pointermove', gripMove);
    grip.addEventListener('pointerup', gripUp);
    grip.addEventListener('pointercancel', gripUp);
  }

  function gripMove(e) {
    if (!drag) return;
    const rows = Array.prototype.slice.call(document.querySelectorAll('.block'));
    const top = $('canvas').getBoundingClientRect().top;
    let idx = rows.length;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i].getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { idx = i; break; }
    }
    drag.idx = idx;
    const y = idx < rows.length
      ? rows[idx].getBoundingClientRect().top - top
      : rows[rows.length - 1].getBoundingClientRect().bottom - top;
    drag.line.style.top = y + 'px';
  }

  function gripUp() {
    if (!drag) return;
    const d = drag; drag = null;
    d.grip.removeEventListener('pointermove', gripMove);
    d.grip.removeEventListener('pointerup', gripUp);
    d.grip.removeEventListener('pointercancel', gripUp);
    if (d.line.parentNode) d.line.parentNode.removeChild(d.line);
    document.body.classList.remove('dragging');

    if (d.idx !== null) {
      const from = blocks.findIndex(b => b.id === d.id);
      let to = d.idx;
      if (to > from) to--;
      if (to !== from && to >= 0 && to < blocks.length) {
        const moved = blocks.splice(from, 1)[0];
        blocks.splice(to, 0, moved);
        touch();
      }
    }
    render();
  }

  /* ============================================================
     이름·주소 다이얼로그
     ============================================================ */
  function openNameDialog() {
    $('nd-name').value = P.name;
    $('nd-handle').value = '';
    $('nd-old').textContent = 'connectia.bio/' + P.handle;
    $('nd-status').textContent = '';
    $('nd-status').className = 'url-status';
    $('nd-save').disabled = true;
    $('layer-name').classList.add('on');
  }

  function ndCheck() {
    const h = $('nd-handle').value.trim().toLowerCase();
    const st = $('nd-status');
    let handleOk = false;
    if (!h) {
      st.textContent = ''; st.className = 'url-status';
    } else if (TAKEN.indexOf(h) >= 0) {
      st.textContent = '사용 중'; st.className = 'url-status no';
    } else {
      st.textContent = '사용 가능'; st.className = 'url-status ok'; handleOk = true;
    }
    const nameChanged = $('nd-name').value.trim() && $('nd-name').value.trim() !== P.name;
    $('nd-save').disabled = !(handleOk || nameChanged);
  }

  $('nd-name').addEventListener('input', ndCheck);
  $('nd-handle').addEventListener('input', ndCheck);
  $('nd-cancel').onclick = () => $('layer-name').classList.remove('on');
  $('nd-save').onclick = () => {
    const n = $('nd-name').value.trim();
    const h = $('nd-handle').value.trim().toLowerCase();
    if (n) P.name = n;
    if (h && TAKEN.indexOf(h) < 0) P.handle = h;
    $('layer-name').classList.remove('on');
    touch(); render();
    toast('변경했어요');
  };

  $('head').addEventListener('click', e => {
    if (previewMode || document.body.classList.contains('design-open')) return;
    if (e.target.closest('.head-name')) { openNameDialog(); return; }
    if (e.target.closest('.head-avatar')) {
      pickFile(v => { P.avatar = v[0].src; touch(); render(); });
    }
  });

  /* ============================================================
     확인 다이얼로그
     ============================================================ */
  let cfCb = null;
  function confirmDlg(title, yes, danger, cb) {
    cfCb = cb;
    $('cf-title').textContent = title;
    $('cf-yes').textContent = yes;
    $('cf-yes').className = 'btn btn-md ' + (danger ? 'btn-fill-danger' : 'btn-fill-primary');
    $('layer-confirm').classList.add('on');
  }
  $('cf-no').onclick = () => { $('layer-confirm').classList.remove('on'); cfCb = null; };
  $('cf-yes').onclick = () => {
    $('layer-confirm').classList.remove('on');
    const cb = cfCb; cfCb = null;
    if (cb) cb();
  };

  /* ============================================================
     저장 · 이탈
     ============================================================ */
  $('btn-apply').onclick = () => {
    dirty = false;
    $('btn-apply').disabled = true;
    closeAllSheets();
    toast('저장했어요');
  };

  $('btn-cancel').onclick = () => {
    if (!dirty) { toast('편집을 닫았어요'); return; }
    confirmDlg('변경사항을 저장하지 않고 나갈까요?', '나가기', false, () => {
      dirty = false;
      $('btn-apply').disabled = true;
      closeAllSheets();
      toast('편집을 닫았어요');
    });
  };

  /* ============================================================
     미리보기 모드
     ============================================================ */
  $('chip-preview').onclick = function () {
    previewMode = !previewMode;
    if (previewMode) { closeLayer('layer-full'); closeAllSheets(); }
    document.body.classList.toggle('preview', previewMode);
    this.classList.toggle('is-active', previewMode);
    $('chip-design').disabled = previewMode;
    $('chip-name').disabled = previewMode;
    $('chip-autofill').disabled = previewMode;
    render();
  };

  render();
  icons();
  </script>
</body>
</html>
