<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이스 테스트 유카</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font-base);
    background:var(--color-border);
    color:var(--color-text);
    line-height:var(--lh-body);
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
  }
  .page{
    width:100%;max-width:430px;min-height:100vh;
    background:var(--color-bg);
    padding:24px 20px 40px;
  }

  /* ---- top utility ---- */
  .top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px}
  .util{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--color-surface-sub);
    color:var(--color-text-sub);
    border:none;border-radius:var(--r-full);
    padding:8px 16px;
    font-family:var(--font-base);
    font-size:var(--fs-body);
    font-weight:var(--fw-medium);
    cursor:pointer;
    transition:background var(--motion-fast) var(--ease-standard);
  }
  .util:hover{background:var(--color-border)}
  .util i[data-lucide]{width:16px;height:16px}

  /* ---- profile header ---- */
  .avatar-empty{
    width:96px;height:96px;border-radius:var(--r-full);
    background:var(--color-surface-sub);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;
  }
  .avatar-empty i[data-lucide]{width:48px;height:48px;color:var(--color-text-muted)}
  .name{
    font-size:var(--fs-display);font-weight:var(--fw-bold);
    letter-spacing:var(--ls-display);color:var(--color-text);
  }
  .handle{
    color:var(--color-primary);
    font-size:var(--fs-body-lg);
    margin-top:4px;
  }
  .contact{
    display:flex;align-items:center;gap:8px;
    color:var(--color-text-sub);
    font-size:var(--fs-body-lg);
    margin-top:12px;
  }
  .contact i[data-lucide]{width:16px;height:16px}

  /* ---- main CTA ---- */
  .cta{ margin-top:20px; }

  hr{
    border:none;
    border-top:1px solid var(--color-border);
    margin:24px 0;
  }

  /* ---- section ---- */
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .sec-title{
    font-size:var(--fs-title);font-weight:var(--fw-semibold);
    letter-spacing:var(--ls-title);color:var(--color-text);
  }
  .about{
    color:var(--color-text-sub);
    font-size:var(--fs-body-lg);
    line-height:var(--lh-body-lg);
  }

  /* ---- 헤더 보조 액션 (전체보기) ---- */
  .btn-text{
    display:inline-flex;align-items:center;gap:4px;
    background:transparent;
    color:var(--color-primary);
    border:none;border-radius:var(--r-xs);
    padding:8px;
    font-family:var(--font-base);
    font-size:var(--fs-body-lg);
    font-weight:var(--fw-medium);
    cursor:pointer;
    transition:background var(--motion-fast) var(--ease-standard);
  }
  .btn-text:hover{background:var(--color-primary-light)}
  .btn-text i[data-lucide]{width:16px;height:16px}

  /* ---- empty state ---- */
  .empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 4px}
  .empty p{
    color:var(--color-text-sub);
    font-size:var(--fs-body-lg);
    font-weight:var(--fw-medium);
  }

  /* ---- board post ---- */
  .post-card{
    background:var(--color-surface);
    border:1px solid var(--color-border);
    border-radius:var(--r-md);
    padding:16px;
  }
  .post-card .title{
    font-size:var(--fs-body-lg);
    font-weight:var(--fw-semibold);
    color:var(--color-text);
  }
  .post-card .sub{
    font-size:var(--fs-body);
    color:var(--color-text-sub);
    margin-top:4px;
  }

  /* ---- review ---- */
  .rating{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .rating .score{font-size:var(--fs-heading);font-weight:var(--fw-semibold);color:var(--color-text)}
  .rating .count{color:var(--color-text-sub);font-size:var(--fs-body)}
  .rating .star{color:var(--color-primary);width:18px;height:18px}

  /* 가로 스크롤 컨테이너 — 좌우 padding을 뚫고 끝까지 스크롤 */
  .review-scroll{
    display:flex;
    gap:12px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    margin:0 -20px;
    padding:4px 20px 12px;
    scrollbar-width:none;
  }
  .review-scroll::-webkit-scrollbar{display:none}

  .review-card{
    background:var(--color-surface);
    border-radius:var(--r-md);
    padding:16px;
    box-shadow:var(--shadow-1);
    flex:0 0 calc(100% - 40px);
    scroll-snap-align:start;
  }
  .review-card .stars{color:var(--color-primary);font-size:var(--fs-label);letter-spacing:2px;margin-bottom:8px}
  .review-card .body{font-size:var(--fs-body-lg);color:var(--color-text)}
  .review-card .meta{font-size:var(--fs-label);color:var(--color-text-muted);margin-top:8px}

  :focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
</style>
</head>
<body>
<main class="page">

  <!-- 유틸리티: 라이트 그레이 (낮은 위계) -->
  <div class="top">
    <button class="util">
      <i data-lucide="download"></i>
      연락처 저장
    </button>
    <button class="util">
      <i data-lucide="share-2"></i>
      공유
    </button>
  </div>

  <!-- 프로필 -->
  <div class="avatar-empty">
    <i data-lucide="user"></i>
  </div>
  <h1 class="name">케이스 테스트 유카</h1>
  <div class="handle">@dpt_tst_k</div>
  <div class="contact">
    <i data-lucide="mail"></i>
    contact@jober.io
  </div>

  <!-- 최상위 CTA: 그라데이션 -->
  <button class="btn btn-lg btn-fill-gradient btn-block cta">
    <i data-lucide="message-circle" style="width:18px;height:18px"></i>
    대화하기
  </button>

  <hr>

  <!-- About -->
  <section>
    <div class="sec-head"><h2 class="sec-title">About</h2></div>
    <p class="about">고객님 상황에 맞는 솔루션을 제안드립니다. 어떤 게 필요하신지 편하게 말씀해 주시면 바로 도와드릴게요.</p>
  </section>

  <hr>

  <!-- Board: 헤더 우측=게시글 추가 · 하단 우측=전체보기 -->
  <section>
    <div class="sec-head">
      <h2 class="sec-title">Board</h2>
      <button class="btn btn-md btn-weak-primary btn-pill">
        <i data-lucide="plus" style="width:16px;height:16px"></i>
        게시글 추가
      </button>
    </div>
    <div class="post-card">
      <div class="title">게시글 테스트</div>
      <div class="sub">게시글 테스트</div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:12px">
      <button class="btn-text" aria-label="게시글 전체보기">
        전체보기
      </button>
    </div>
  </section>

  <hr>

  <!-- Review: 헤더 우측=리뷰 작성하기 · 하단 우측=전체보기 -->
  <section>
    <div class="sec-head">
      <h2 class="sec-title">Review</h2>
      <button class="btn btn-md btn-weak-primary btn-pill">
        <i data-lucide="pencil-line" style="width:16px;height:16px"></i>
        리뷰 작성하기
      </button>
    </div>

    <div class="rating">
      <i data-lucide="star" class="star" style="fill:currentColor"></i>
      <span class="score">5.0</span>
      <span class="count">(1)</span>
    </div>

    <div class="review-scroll">
      <div class="review-card">
        <div class="stars">★★★★★</div>
        <div class="body">리뷰 테스트입니다</div>
        <div class="meta">자버 어드민 · 2026년 6월 22일</div>
      </div>
      <div class="review-card">
        <div class="stars">★★★★★</div>
        <div class="body">친절하고 빠른 응대 감사합니다. 다음에도 또 이용할게요.</div>
        <div class="meta">홍길동 · 2026년 6월 20일</div>
      </div>
      <div class="review-card">
        <div class="stars">★★★★☆</div>
        <div class="body">전반적으로 만족스러웠고, 기대했던 것보다 더 좋았어요.</div>
        <div class="meta">김민지 · 2026년 6월 18일</div>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;margin-top:4px">
      <button class="btn-text" aria-label="리뷰 전체보기">
        전체보기
      </button>
    </div>
  </section>

</main>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
