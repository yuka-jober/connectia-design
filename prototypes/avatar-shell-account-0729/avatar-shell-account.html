<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아바타 관리 셸 — 계정 설정</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-base);
    background: #e0e0e0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Frame ── */
  .frame {
    width: 390px;
    height: 844px;
    max-height: 100dvh;
    position: relative;
    overflow: hidden;
    box-shadow: 0 32px 80px -20px rgba(0,0,0,0.28);
    background: var(--color-surface);
    transform: translateZ(0);
  }
  @media (max-width: 439px) { .frame { width: 100vw; height: 100dvh; max-height: none; } }
  @media (min-width: 440px) { .frame { border-radius: 44px; max-height: calc(100dvh - 40px); } }

  .screen {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--color-bg);
  }

  [data-lucide] { display: inline-flex; flex-shrink: 0; }

  /* ── 상단바 (← + 타이틀) ── */
  .a-topbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 8px 8px 4px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }
  .a-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: none;
    background: none;
    color: var(--color-text);
    cursor: pointer;
    border-radius: var(--r-sm);
    -webkit-tap-highlight-color: transparent;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .a-back:active { background: var(--color-surface-sub); }
  .a-back [data-lucide] { width: 22px; height: 22px; }
  .a-topbar-title {
    font-size: var(--fs-body-lg);
    font-weight: var(--fw-bold);
    color: var(--color-text);
    letter-spacing: var(--ls-body-lg);
  }

  /* ── Body ── */
  .a-body {
    flex: 1;
    overflow-y: auto;
    background: var(--color-bg);
    display: flex;
    flex-direction: column;
  }

  /* ── 프로필 카드 ── */
  .a-profile-wrap {
    padding: 20px 16px 16px;
  }
  .a-profile-card {
    background: var(--color-surface);
    border-radius: var(--r-md);
    border: 1px solid var(--color-border);
    padding: 20px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .a-profile-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .a-profile-name {
    font-size: var(--fs-heading);
    font-weight: var(--fw-bold);
    color: var(--color-text);
    letter-spacing: var(--ls-heading);
    padding-left: 8px;
  }
  .a-profile-email {
    font-size: var(--fs-caption);
    color: var(--color-text-muted);
    padding-left: 8px;
  }
  .a-credit-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    align-self: flex-start;
    margin-top: 4px;
    padding: 4px 8px;
    background: var(--color-surface-sub);
    border: none;
    border-radius: var(--r-full);
    font-family: var(--font-base);
    font-size: var(--fs-caption);
    font-weight: var(--fw-medium);
    color: var(--color-text-sub);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .a-credit-chip:active { background: var(--color-border); }
  .a-credit-chip [data-lucide] { width: 14px; height: 14px; color: var(--color-text-muted); }

  /* ── 탭 ── */
  .a-tabs {
    display: flex;
    justify-content: flex-start;
    padding: 0 8px;
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-border);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .a-tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    padding: 0 20px;
    background: none;
    border: none;
    color: var(--color-text-muted);
    font-family: var(--font-base);
    font-size: var(--fs-body);
    font-weight: var(--fw-medium);
    letter-spacing: var(--ls-body);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    transition: color var(--motion-fast) var(--ease-standard);
  }
  .a-tab:active { background: var(--color-surface-sub); }
  .a-tab.is-active {
    color: var(--color-text);
    font-weight: var(--fw-semibold);
  }
  .a-tab.is-active::after {
    content: '';
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: -1px;
    height: 2px;
    background: var(--color-text);
    border-radius: var(--r-full);
  }
  .a-tab-count {
    margin-left: 4px;
    color: var(--color-text-muted);
    font-weight: var(--fw-regular);
  }
  .a-tab.is-active .a-tab-count { color: var(--color-text-sub); }

  /* ── 탭 패널 ── */
  .a-panel {
    display: none;
    flex-direction: column;
    gap: 12px;
    padding: 20px 16px 40px;
  }
  .a-panel.is-active {
    display: flex;
  }

  /* ── 카드 (얇은 하단 border로 항목 구분) ── */
  .a-card {
    background: var(--color-surface);
    border-radius: var(--r-md);
    border: 1px solid var(--color-border);
    overflow: hidden;
  }
  .a-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px;
    border-bottom: 1px solid var(--color-border);
    background: transparent;
    border-left: none;
    border-right: none;
    border-top: none;
    width: 100%;
    font-family: var(--font-base);
    cursor: pointer;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .a-row:last-child { border-bottom: none; }
  .a-row-static { cursor: default; }
  .a-row-clickable:active { background: var(--color-surface-sub); }
  .a-row-label {
    font-size: var(--fs-body-lg);
    color: var(--color-text);
    font-weight: var(--fw-regular);
  }
  .a-row-value {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: var(--fs-body);
    color: var(--color-text-muted);
  }
  .a-row-value [data-lucide] { width: 16px; height: 16px; }
  .a-row-label-icon {
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .a-row-label-icon [data-lucide] {
    width: 20px;
    height: 20px;
    color: var(--color-text-sub);
    flex-shrink: 0;
  }

  /* ── 세그먼트 컨트롤 (라이트/다크) ── */
  .a-seg {
    display: inline-flex;
    padding: 2px;
    background: var(--color-surface-sub);
    border-radius: var(--r-full);
    gap: 2px;
  }
  .a-seg-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 28px;
    padding: 0 12px;
    background: transparent;
    border: none;
    color: var(--color-text-sub);
    font-family: var(--font-base);
    font-size: var(--fs-label);
    font-weight: var(--fw-medium);
    border-radius: var(--r-full);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .a-seg-btn.is-active {
    background: var(--color-surface);
    color: var(--color-text);
    box-shadow: var(--shadow-1);
  }
  .a-seg-btn [data-lucide] { width: 14px; height: 14px; }

  /* ── 팔로잉 리스트 ── */
  .a-list { display: flex; flex-direction: column; gap: 16px; }
  .a-list-search { position: relative; }
  .a-list-search .input { padding-left: 40px; }
  .a-list-search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--color-text-muted); pointer-events: none;
    display: inline-flex;
  }
  .a-list-search-icon [data-lucide] { width: 18px; height: 18px; }
  .a-list-items { list-style: none; display: flex; flex-direction: column; gap: 4px; padding: 0; margin: 0; }
  .a-list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 4px;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    font-family: var(--font-base);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background var(--motion-fast) var(--ease-standard);
    border-radius: var(--r-sm);
  }
  .a-list-item:active { background: var(--color-surface-sub); }
  .a-list-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .a-list-name {
    font-size: var(--fs-body-lg);
    font-weight: var(--fw-semibold);
    color: var(--color-text);
    letter-spacing: var(--ls-body-lg);
  }
  .a-list-sub {
    font-size: var(--fs-caption);
    color: var(--color-text-muted);
  }

  /* ── 하단 텍스트 액션 ── */
  .a-danger-links {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 8px 16px 24px;
  }
  .a-danger-link {
    background: none;
    border: none;
    padding: 4px 8px;
    font-family: var(--font-base);
    font-size: var(--fs-body);
    color: var(--color-text-muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .a-danger-divider {
    width: 1px;
    height: 12px;
    background: var(--color-border);
  }
</style>
</head>
<body>

<div class="frame">

  <section class="screen">

    <!-- 상단바 -->
    <header class="a-topbar">
      <button class="a-back" type="button" onclick="goBack()" aria-label="뒤로가기">
        <i data-lucide="chevron-left"></i>
      </button>
      <div class="a-topbar-title">계정 설정</div>
    </header>

    <div class="a-body">

      <!-- 프로필 카드 -->
      <div class="a-profile-wrap">
        <div class="a-profile-card">

        <button type="button" class="a-tab is-active" role="tab" data-tab="account" aria-selected="true" onclick="switchTab(this)">계정</button>
        <button type="button" class="a-tab" role="tab" data-tab="display" aria-selected="false" onclick="switchTab(this)">화면</button>
      </nav>

      <!-- 팔로잉 탭 -->
      <div class="a-panel" data-panel="following" role="tabpanel">
        <div class="a-list">
          <div class="a-list-search">
            <span class="a-list-search-icon"><i data-lucide="search"></i></span>
            <input type="text" class="input" placeholder="페이지 검색">
          </div>
          <ul class="a-list-items">
            <li>
              <button class="a-list-item" type="button">
                <div class="avatar avatar-lg"><img src="https://picsum.photos/seed/page-1/120/120" alt=""></div>
                <div class="a-list-text">
                  <div class="a-list-name">엘린피부과의원</div>
                  <div class="a-list-sub">@ellin-derma</div>
                </div>
              </button>
            </li>
            <li>
              <button class="a-list-item" type="button">
                <div class="avatar avatar-lg"><img src="https://picsum.photos/seed/page-2/120/120" alt=""></div>
                <div class="a-list-text">
                  <div class="a-list-name">블루밍 플라워 카페</div>
                  <div class="a-list-sub">@blooming-cafe</div>
                </div>
              </button>
            </li>
            <li>
              <button class="a-list-item" type="button">
                <div class="avatar avatar-lg"><img src="https://picsum.photos/seed/page-3/120/120" alt=""></div>
                <div class="a-list-text">
                  <div class="a-list-name">제로플렉스 헬스클럽</div>
                  <div class="a-list-sub">@zeroplex-gym</div>
                </div>
              </button>
            </li>
            <li>
              <button class="a-list-item" type="button">
                <div class="avatar avatar-lg"><img src="https://picsum.photos/seed/page-4/120/120" alt=""></div>
                <div class="a-list-text">
                  <div class="a-list-name">브이스타 성형외과</div>
                  <div class="a-list-sub">@vstar-ps</div>
                </div>
              </button>
            </li>
            <li>
              <button class="a-list-item" type="button">
                <div class="avatar avatar-lg"><img src="https://picsum.photos/seed/page-5/120/120" alt=""></div>
                <div class="a-list-text">
                  <div class="a-list-name">모먼트 스튜디오</div>
                  <div class="a-list-sub">@moment-studio</div>
                </div>
              </button>
            </li>
            <li>
              <button class="a-list-item" type="button">
                <div class="avatar avatar-lg"><img src="https://picsum.photos/seed/page-6/120/120" alt=""></div>
                <div class="a-list-text">
                  <div class="a-list-name">노아 반려동물 병원</div>
                  <div class="a-list-sub">@noah-vet</div>
                </div>
              </button>
            </li>
            <li>
              <button class="a-list-item" type="button">
                <div class="avatar avatar-lg"><img src="https://picsum.photos/seed/page-7/120/120" alt=""></div>
                <div class="a-list-text">
                  <div class="a-list-name">뷰티랩 네일</div>
                  <div class="a-list-sub">@beautylab-nail</div>
                </div>
              </button>
            </li>
          </ul>
        </div>
      </div>

      <!-- 계정 탭 -->
      <div class="a-panel is-active" data-panel="account" role="tabpanel">
        <div class="a-card">
          <button class="a-row a-row-clickable" type="button">
            <span class="a-row-label">이름</span>
            <span class="a-row-value">자버 어드민</span>
          </button>
          <button class="a-row a-row-clickable" type="button">
            <span class="a-row-label">연락처</span>
            <span class="a-row-value">미등록</span>
          </button>
          <button class="a-row a-row-clickable" type="button">
            <span class="a-row-label">비밀번호 변경</span>
          </button>
          <div class="a-row a-row-static">
            <span class="a-row-label">친구추가 바로 허용</span>
            <input type="checkbox" class="toggle toggle-sm" checked>
          </div>
        </div>

        <!-- 하단 텍스트 액션 (계정 탭 전용) -->

          <button class="a-danger-link" type="button">로그아웃</button>

      <!-- 화면 탭 -->

          <div class="a-row a-row-static" style="padding-top:12px;padding-bottom:12px;">
            <span class="a-row-label">화면</span>
            <div class="a-seg" role="group" aria-label="테마 선택">
              <button type="button" class="a-seg-btn is-active" onclick="setTheme(this,'light')">
                <i data-lucide="sun"></i>라이트
              </button>
              <button type="button" class="a-seg-btn" onclick="setTheme(this,'dark')">
                <i data-lucide="moon"></i>다크
              </button>
            </div>
          </div>
          <div class="a-row a-row-static">
            <span class="a-row-label">큰 글씨 모드</span>
            <input type="checkbox" class="toggle toggle-sm">
          </div>
        </div>
      </div>

    </div>
  </section>

</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  function goBack() {
    if (document.referrer && document.referrer.indexOf('avatar-shell-home') !== -1) {
      history.back();
    } else {
      location.href = 'avatar-shell-home-final.html';
    }
  }
  function switchTab(btn) {
    const name = btn.dataset.tab;
    document.querySelectorAll('.a-tab').forEach(t => {
      const active = t === btn;
      t.classList.toggle('is-active', active);
      t.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    document.querySelectorAll('.a-panel').forEach(p => {
      p.classList.toggle('is-active', p.dataset.panel === name);
    });
  }
  function setTheme(btn, mode) {
    const group = btn.closest('.a-seg');
    if (!group) return;
    group.querySelectorAll('.a-seg-btn').forEach(b => b.classList.remove('is-active'));
    btn.classList.add('is-active');
  }
  lucide.createIcons();
</script>

</body>
</html>
