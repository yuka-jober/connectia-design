<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>케이스 테스트 유카 · 빈 상태</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font-base);
    background:var(--color-border);
    color:var(--color-text);
    line-height:var(--lh-body);
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
  }
  .page{
    width:100%;max-width:430px;min-height:100vh;
    background:var(--color-bg);
    padding:20px 20px 40px;
  }

  /* ---- top nav (소유자 전용) ---- */
  .topnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px}
  .topnav-name{
    display:flex;align-items:center;gap:4px;
    font-size:var(--fs-body-lg);font-weight:var(--fw-bold);
    color:var(--color-text);
  }
  .topnav-name i[data-lucide]{width:18px;height:18px;color:var(--color-text-sub)}
  .topnav-actions{display:flex;gap:8px}

  /* ---- utility buttons ---- */
  .top{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
  .util{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--color-surface-sub);
    color:var(--color-text-sub);
    border:none;border-radius:var(--r-full);
    padding:8px 16px;
    font-family:var(--font-base);
    font-size:var(--fs-body);
    font-weight:var(--fw-medium);
    cursor:pointer;
    transition:background var(--motion-fast) var(--ease-standard);
  }
  .util:hover{background:var(--color-border)}
  .util i[data-lucide]{width:16px;height:16px}

  /* ---- profile header ---- */
  .avatar-empty{
    width:96px;height:96px;border-radius:var(--r-full);
    background:var(--color-surface-sub);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:16px;
  }
  .avatar-empty i[data-lucide]{width:48px;height:48px;color:var(--color-text-muted)}
  .name{
    font-size:var(--fs-display);font-weight:var(--fw-bold);
    letter-spacing:var(--ls-display);color:var(--color-text);
  }
  .handle{
    color:var(--color-primary);
    font-size:var(--fs-body-lg);
    margin-top:4px;
  }
  .contact{
    display:flex;align-items:center;gap:8px;
    color:var(--color-text-sub);
    font-size:var(--fs-body-lg);
    margin-top:12px;
  }
  .contact i[data-lucide]{width:16px;height:16px}

  /* ---- main CTA ---- */
  .cta{ margin-top:20px; }

  hr{
    border:none;
    border-top:1px solid var(--color-border);
    margin:24px 0;
  }

  /* ---- section ---- */
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .sec-title{
    font-size:var(--fs-title);font-weight:var(--fw-semibold);
    letter-spacing:var(--ls-title);color:var(--color-text);
  }
  .about{
    color:var(--color-text-sub);
    font-size:var(--fs-body-lg);
    line-height:var(--lh-body-lg);
  }

  /* ---- empty state ---- */
  .empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 4px}
  .empty p{
    color:var(--color-text-sub);
    font-size:var(--fs-body-lg);
    font-weight:var(--fw-medium);
  }

  :focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
</style>
</head>
<body>
<main class="page">

  <!-- 상단 내비: 소유자 본인 화면에만 노출 -->
  <div class="topnav">
    <div class="topnav-name">
      케이스 테스트 유카
      <i data-lucide="chevron-down"></i>
    </div>
    <div class="topnav-actions">
      <button class="util">프로필 편집</button>
      <button class="util">설정</button>
    </div>
  </div>

  <!-- 유틸리티 -->
  <div class="top">
    <button class="util">
      <i data-lucide="download"></i>
      연락처 저장
    </button>
    <button class="util">
      <i data-lucide="share-2"></i>
      공유
    </button>
  </div>

  <!-- 프로필 -->
  <div class="avatar-empty">
    <i data-lucide="user"></i>
  </div>
  <h1 class="name">케이스 테스트 유카</h1>
  <div class="handle">@dpt_tst_k</div>
  <div class="contact">
    <i data-lucide="mail"></i>
    contact@jober.io
  </div>

  <!-- 최상위 CTA -->
  <button class="btn btn-lg btn-fill-gradient btn-block cta">
    <i data-lucide="message-circle" style="width:18px;height:18px"></i>
    대화하기
  </button>

  <hr>

  <!-- About -->
  <section>
    <div class="sec-head"><h2 class="sec-title">About</h2></div>
    <p class="about">고객님 상황에 맞는 솔루션을 제안드립니다. 어떤 게 필요하신지 편하게 말씀해 주시면 바로 도와드릴게요.</p>
  </section>

  <hr>

  <!-- Board (빈 상태) -->
  <section>
    <div class="sec-head"><h2 class="sec-title">Board</h2></div>
    <div class="empty">
      <p>소식, 이벤트를 추가해주세요</p>
      <button class="btn btn-md btn-weak-primary btn-pill">
        <i data-lucide="plus" style="width:16px;height:16px"></i>
        게시글 추가
      </button>
    </div>
  </section>

  <hr>

  <!-- Review (빈 상태) -->
  <section>
    <div class="sec-head"><h2 class="sec-title">Review</h2></div>
    <div class="empty">
      <p>첫 리뷰를 남겨주세요.</p>
      <button class="btn btn-md btn-weak-primary btn-pill">
        <i data-lucide="pencil-line" style="width:16px;height:16px"></i>
        리뷰 작성하기
      </button>
    </div>
  </section>

</main>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
