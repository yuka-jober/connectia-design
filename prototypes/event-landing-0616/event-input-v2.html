<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이벤트 만들기 — 미리보기 작성</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-base);
    background: #e0e0e0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .frame {
    width: 390px;
    height: 844px;
    max-height: 100dvh;
    position: relative;
    overflow: hidden;
    box-shadow: 0 32px 80px -20px rgba(0,0,0,0.28);
    background: var(--color-surface);
    border-radius: 44px;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 439px) {
    .frame { width: 100vw; height: 100dvh; max-height: none; border-radius: 0; }
  }

  i[data-lucide] { display: inline-flex; flex-shrink: 0; }
  svg.lucide { flex-shrink: 0; }

  /* ── Topbar ── */
  .topbar {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 8px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
    gap: 4px;
    z-index: 10;
  }
  .topbar-title {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: var(--fs-body-lg);
    font-weight: var(--fw-semibold);
    color: var(--color-text);
    pointer-events: none;
  }
  .topbar-spacer { width: 40px; height: 40px; }

  /* ── Edit body ── */
  .edit-body {
    flex: 1;
    overflow-y: auto;
    background: var(--color-surface);
  }

  /* ── Hero / image uploader ── */
  .pv-hero {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background-color: var(--color-surface-sub);
    overflow: hidden;
  }
  .pv-hero-track {
    width: 100%; height: 100%;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .pv-hero-track::-webkit-scrollbar { display: none; }
  .pv-hero-slide {
    flex: 0 0 100%;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    scroll-snap-align: start;
  }
  .pv-hero-empty {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    color: var(--color-text-muted);
    background: var(--color-surface-sub);
    border: 1.5px dashed var(--color-border);
    cursor: pointer;
    font-family: var(--font-base);
  }
  .pv-hero-empty svg,
  .pv-hero-empty i[data-lucide] { width: 32px; height: 32px; color: var(--color-primary); }
  .pv-hero-empty .label { font-size: var(--fs-body); font-weight: var(--fw-medium); color: var(--color-text-sub); }
  .pv-hero-empty .sub { font-size: var(--fs-caption); color: var(--color-text-muted); }

  .pv-hero-counter {
    position: absolute;
    right: 12px;
    bottom: 12px;
    padding: 4px 12px;
    background: rgba(17,19,24,0.6);
    color: var(--color-on-primary);
    font-size: var(--fs-caption);
    font-weight: var(--fw-semibold);
    border-radius: var(--r-full);
    z-index: 3;
    display: none;
  }
  .pv-hero-cover {
    position: absolute; top: 12px; left: 12px;
    padding: 4px 10px;
    background: rgba(17,19,24,0.65);
    color: var(--color-on-primary);
    border-radius: var(--r-full);
    font-size: 10px;
    font-weight: var(--fw-semibold);
    z-index: 3;
    display: none;
  }
  .pv-hero-actions {
    position: absolute;
    top: 12px; right: 12px;
    display: none;
    gap: 8px;
    z-index: 3;
  }
  .pv-hero-actions.on { display: flex; }
  .pv-hero-action-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(17,19,24,0.7);
    color: var(--color-on-primary);
    border: none;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .pv-hero-action-btn svg,
  .pv-hero-action-btn i[data-lucide] { width: 14px; height: 14px; }

  /* ── Info (clinic + editable title/target) ── */
  .pv-info {
    padding: 24px 20px 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .pv-clinic-row {
    display: inline-flex; align-items: center; gap: 2px;
    align-self: flex-start;
  }
  .pv-clinic {
    font-size: var(--fs-label);
    font-weight: var(--fw-semibold);
    color: var(--color-text-sub);
  }
  .pv-clinic-row svg,
  .pv-clinic-row i[data-lucide] { width: 16px; height: 16px; color: var(--color-text-muted); }

  /* ── Editable (contenteditable) ── */
  .editable {
    outline: none;
    border-radius: var(--r-xs);
    padding: 4px 6px;
    margin: 0 -6px;
    cursor: text;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .editable:hover:not(:focus) {
    background: var(--color-surface-sub);
  }
  .editable:empty::before {
    content: attr(data-placeholder);
    color: var(--color-text-muted);
    pointer-events: none;
  }

  .pv-title {
    font-size: 24px;
    font-weight: var(--fw-bold);
    line-height: 1.35;
    letter-spacing: -0.5px;
    color: var(--color-text);
    min-height: 34px;
  }
  .pv-target {
    font-size: var(--fs-body-lg);
    color: var(--color-text-sub);
    line-height: 1.5;
    min-height: 26px;
  }
  .pv-trust-row {
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap;
    padding-top: 4px;
  }
  .pv-trust-row svg,
  .pv-trust-row i[data-lucide] { width: 14px; height: 14px; }
  .pv-star-row { display: inline-flex; align-items: center; gap: 4px; }
  .pv-star-row svg,
  .pv-star-row i[data-lucide] { color: var(--color-star); fill: var(--color-star); }
  .pv-star-score { font-size: var(--fs-label); font-weight: var(--fw-semibold); color: var(--color-text); margin-left: 2px; }
  .pv-star-count { font-size: var(--fs-caption); color: var(--color-text-muted); }
  .pv-trust-dot { font-size: var(--fs-caption); color: var(--color-text-muted); }
  .pv-tag-official {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--color-primary);
    font-size: var(--fs-caption);
    font-weight: var(--fw-semibold);
  }

  /* ── Divider ── */
  .pv-divider {
    height: 8px;
    background: var(--color-bg);
  }

  /* ── Section ── */
  .pv-section {
    padding: 24px 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .pv-section-title {
    font-size: var(--fs-heading);
    font-weight: var(--fw-bold);
    color: var(--color-text);
    letter-spacing: -0.2px;
  }

  /* ── Date timeline (시작 / 종료) ── */
  .pv-date-card {
    position: relative;
    background: var(--color-surface-sub);
    border-radius: var(--r-md);
    padding: 16px 20px;
    display: flex; flex-direction: column;
  }
  .pv-timeline-row {
    display: grid;
    grid-template-columns: 16px auto 1fr 1fr;
    align-items: center;
    column-gap: 12px;
    min-height: 36px;
  }
  .pv-timeline-marker {
    position: relative;
    width: 16px;
    height: 100%;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pv-timeline-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1.5px solid var(--color-text-muted);
    background: var(--color-surface-sub);
    z-index: 1;
  }
  .pv-timeline-dot.is-filled {
    background: var(--color-text-muted);
  }
  .pv-timeline-row.is-start .pv-timeline-marker::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translateX(-50%);
    width: 1.5px;
    height: 36px;
    background-image: linear-gradient(var(--color-border) 60%, transparent 0);
    background-size: 1.5px 6px;
    z-index: 0;
  }
  .pv-timeline-label {
    font-size: var(--fs-body);
    color: var(--color-text-sub);
    font-weight: var(--fw-medium);
  }
  .pv-date-pill {
    position: relative;
    background: var(--color-surface);
    border: none;
    border-radius: var(--r-sm);
    padding: 8px 12px;
    font-family: var(--font-base);
    font-size: var(--fs-label);
    font-weight: var(--fw-medium);
    color: var(--color-text);
    cursor: pointer;
    text-align: center;
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .pv-date-pill:hover { background: var(--color-bg); }
  .pv-date-pill-text {
    pointer-events: none;
    display: inline-block;
  }
  .pv-date-pill.is-empty .pv-date-pill-text {
    color: var(--color-text-muted);
  }
  .pv-pill-input {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    border: none;
    background: transparent;
    font-family: var(--font-base);
    padding: 0;
  }
  .pv-pill-input::-webkit-calendar-picker-indicator {
    width: 100%;
    height: 100%;
    cursor: pointer;
    position: absolute;
    inset: 0;
    margin: 0;
    opacity: 0;
  }
  .pv-date-dday {
    font-size: var(--fs-caption);
    color: var(--color-primary);
    margin-top: 10px;
    padding-left: 28px;
    display: none;
  }
  .pv-date-dday.on { display: block; }

  /* ── Picker overlay (calendar / time) ── */
  .pv-calendar,
  .pv-timepick {
    position: absolute;
    left: 8px;
    right: 8px;
    background: var(--color-surface);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-3);
    padding: 16px 16px 12px;
    z-index: 20;
  }
  .pv-calendar[hidden],
  .pv-timepick[hidden] { display: none !important; }
  .pv-cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .pv-cal-month {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: transparent;
    border: none;
    padding: 6px 0;
    font-family: var(--font-base);
    font-size: var(--fs-body-lg);
    font-weight: var(--fw-bold);
    color: var(--color-text);
    cursor: pointer;
  }
  .pv-cal-month svg,
  .pv-cal-month i[data-lucide] {
    width: 14px; height: 14px;
    color: var(--color-text-muted);
  }
  .pv-cal-nav button {
    color: var(--color-primary);
  }
  .pv-cal-nav button svg,
  .pv-cal-nav button i[data-lucide] { width: 20px; height: 20px; }
  .pv-cal-weekdays {
    grid-template-columns: repeat(7, 1fr);
    font-size: var(--fs-label);
    font-weight: var(--fw-medium);
    color: var(--color-text-sub);
    margin-bottom: 0;
  }
  .pv-cal-grid {
    row-gap: 2px;
  }
  .pv-cal-day {
    border-radius: 50%;
    aspect-ratio: 1;
    font-weight: var(--fw-medium);
  }
  .pv-cal-day:hover { background: var(--color-surface-sub); }
  .pv-cal-day.is-outside { visibility: hidden; }
  .pv-cal-day.is-selected {
    background: var(--color-primary);
    color: var(--color-on-primary);
    font-weight: var(--fw-bold);
  }
  .pv-cal-day.is-selected:hover { background: var(--color-primary); }
  .pv-cal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--color-border);
  }
  .pv-cal-footer button {
    background: transparent;
    border: none;
    color: var(--color-primary);
    font-family: var(--font-base);
    font-size: var(--fs-body);
    font-weight: var(--fw-medium);
    cursor: pointer;
    padding: 6px 4px;
  }
  .pv-cal-footer button.is-strong { font-weight: var(--fw-bold); }

  /* Time picker — scrollable list */
  .pv-timepick {
    left: auto;
    right: auto;
    width: auto;
    padding: 4px 0;
    max-height: 280px;
    display: flex;
    flex-direction: column;
  }
  .pv-tp-list {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    padding: 4px 8px;
    scroll-behavior: smooth;
  }
  .pv-timepick .pv-cal-footer {
    margin: 0 16px;
    margin-top: 8px;
    padding-top: 8px;
  }
  .pv-tp-item {
    background: transparent;
    border: none;
    padding: 10px 16px;
    border-radius: var(--r-sm);
    font-family: var(--font-base);
    font-size: var(--fs-body);
    font-weight: var(--fw-medium);
    color: var(--color-text);
    cursor: pointer;
    text-align: center;
    width: 100%;
    white-space: nowrap;
  }
  .pv-tp-item:hover { background: var(--color-surface-sub); }
  .pv-tp-item.is-selected {
    background: var(--color-primary);
    color: var(--color-on-primary);
    font-weight: var(--fw-bold);
  }
  .pv-tp-item.is-selected:hover { background: var(--color-primary); }

  /* Shared bits used by both pickers */
  .pv-cal-nav {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .pv-cal-nav button {
    background: transparent;
    border: none;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border-radius: var(--r-sm);
    padding: 0;
  }
  .pv-cal-nav button:hover { background: var(--color-surface-sub); }
  .pv-cal-weekdays {
    display: grid;
    text-align: center;
  }
  .pv-cal-weekdays span {
    padding: 8px 0;
  }
  .pv-cal-weekdays span:first-child,
  .pv-cal-weekdays span:last-child {
    color: var(--color-text-muted);
  }
  .pv-cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .pv-cal-day {
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: none;
    font-family: var(--font-base);
    font-size: var(--fs-body);
    color: var(--color-text);
    cursor: pointer;
    padding: 0;
  }
  .pv-cal-day.is-disabled {
    color: var(--color-text-muted);
    opacity: 0.4;
    cursor: not-allowed;
  }
  .pv-cal-day.is-disabled:hover { background: transparent; }
  .pv-date-pill.is-active { background: var(--color-bg); box-shadow: inset 0 0 0 1.5px var(--color-primary); }

  /* ── Conditions checklist ── */
  .pv-checklist { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  .pv-check-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--r-md);
  }
  .pv-check-circle {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--color-primary);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--color-on-primary);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .pv-check-circle svg,
  .pv-check-circle i[data-lucide] { width: 12px; height: 12px; stroke-width: 3; }
  .pv-check-text {
    flex: 1;
    font-size: var(--fs-body-lg);
    line-height: 1.5;
    color: var(--color-text);
    outline: none;
    cursor: text;
    border-radius: var(--r-xs);
    padding: 2px 4px;
    margin: 0 -4px;
    min-width: 0;
  }
  .pv-check-text:hover:not(:focus) {
    background: var(--color-surface-sub);
  }
  .pv-check-text:empty::before {
    content: attr(data-placeholder);
    color: var(--color-text-muted);
    pointer-events: none;
  }
  .pv-check-remove {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--color-text-muted);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    margin: -2px -4px 0 0;
  }
  .pv-check-remove svg,
  .pv-check-remove i[data-lucide] { width: 14px; height: 14px; }
  .pv-check-remove:hover { color: var(--color-destructive); background: var(--color-surface-sub); }

  .pv-check-add {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 16px;
    background: var(--color-surface);
    border: 1px dashed var(--color-border);
    border-radius: var(--r-md);
    color: var(--color-text-muted);
    font-size: var(--fs-body-lg);
    font-weight: var(--fw-medium);
    font-family: var(--font-base);
    cursor: pointer;
    text-align: left;
    transition: color var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
  }
  .pv-check-add:hover {
    color: var(--color-primary);
    border-color: var(--color-primary);
    background: var(--color-primary-light);
  }
  .pv-check-add-circle {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--color-surface-sub);
    color: var(--color-text-muted);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
  }
  .pv-check-add:hover .pv-check-add-circle {
    background: var(--color-primary);
    color: var(--color-on-primary);
  }
  .pv-check-add-circle svg,
  .pv-check-add-circle i[data-lucide] { width: 12px; height: 12px; stroke-width: 3; }

  /* ── Description ── */
  .pv-desc {
    font-size: var(--fs-body);
    line-height: 1.7;
    color: var(--color-text-sub);
    min-height: 24px;
    white-space: pre-wrap;
  }

  /* ── CTA config (button text inline edit) ── */
  .pv-cta-config {
    padding: 16px 20px;
    background: var(--color-surface-sub);
    display: flex; flex-direction: column; gap: 6px;
  }
  .pv-cta-config-label {
    font-size: var(--fs-caption);
    color: var(--color-text-muted);
  }
  .pv-cta-config input {
    background: transparent;
    border: none;
    font-family: var(--font-base);
    font-size: var(--fs-body);
    font-weight: var(--fw-semibold);
    color: var(--color-text);
    outline: none;
    padding: 4px 6px;
    margin: 0 -6px;
    border-radius: var(--r-xs);
    transition: background var(--motion-fast) var(--ease-standard);
  }
  .pv-cta-config input:hover { background: var(--color-surface); }
  .pv-cta-config input:focus { outline: none; }

  /* ── Sticky bar ── */
  .sticky-bar {
    padding: 12px 20px calc(20px + env(safe-area-inset-bottom));
    background: var(--color-surface);
    border-top: 1px solid var(--color-border);
    display: flex; flex-direction: column;
    flex-shrink: 0;
  }

  /* ── Required asterisk ── */
  .pv-required::after {
    content: '*';
    color: var(--color-destructive);
    font-weight: var(--fw-semibold);
    margin-left: 4px;
  }
  .pv-title.pv-required:not(:empty)::after { display: none; }

  :focus-visible { outline: none; }
</style>
</head>
<body>

<div class="frame">

  <!-- Topbar -->
  <div class="topbar">
    <button class="icon-btn icon-btn-clear" aria-label="뒤로">
      <i data-lucide="chevron-left" style="width:22px;height:22px;color:var(--color-text);"></i>
    </button>
    <span class="topbar-title">이벤트 만들기</span>
    <span class="topbar-spacer"></span>
  </div>

  <!-- Editable body -->
  <div class="edit-body">

    <!-- Hero / image uploader -->
    <div class="pv-hero" id="pv-hero">
      <div class="pv-hero-track" id="pv-hero-track" style="display:none;" onscroll="updateHeroCounter()"></div>
      <button type="button" class="pv-hero-empty" id="pv-hero-empty" onclick="addImage(event)">
        <i data-lucide="image-plus"></i>
        <span class="label">대표 사진을 추가하세요</span>
        <span class="sub">최대 5장까지 등록할 수 있어요</span>
      </button>
      <span class="pv-hero-cover" id="pv-hero-cover">대표</span>
      <span class="pv-hero-counter" id="pv-hero-counter"></span>
      <div class="pv-hero-actions" id="pv-hero-actions">
        <button type="button" class="pv-hero-action-btn" aria-label="사진 추가" onclick="addImage(event)"><i data-lucide="plus"></i></button>
        <button type="button" class="pv-hero-action-btn" aria-label="현재 사진 삭제" onclick="removeCurrentImage()"><i data-lucide="trash-2"></i></button>
      </div>
    </div>

    <!-- Title + target -->
    <div class="pv-info">
      <div class="pv-clinic">첫눈애안과</div>
      <div class="editable pv-title pv-required" id="f-title" contenteditable="true" data-placeholder="이벤트 이름" oninput="onInput()" onkeydown="blockEnter(event)"></div>
      <div class="editable pv-target" id="f-target" contenteditable="true" data-placeholder="이벤트 대상자 (예: 00대학교 학생 한정)" oninput="onInput()" onkeydown="blockEnter(event)"></div>
    </div>

    <div class="pv-divider"></div>

    <!-- 신청 기간 -->
    <div class="pv-section">
      <div class="pv-section-title">신청 기간</div>
      <div class="pv-date-card">
        <div class="pv-timeline-row is-start">
          <div class="pv-timeline-marker"><span class="pv-timeline-dot is-filled"></span></div>
          <span class="pv-timeline-label">시작</span>
          <button type="button" class="pv-date-pill is-empty" id="pill-start-date" onclick="openCalendar('start', event)">
            <span class="pv-date-pill-text" id="disp-start-date">날짜</span>
            <input type="hidden" id="f-start">
          </button>
          <button type="button" class="pv-date-pill is-empty" id="pill-start-time" onclick="openTimepick('start', event)">
            <span class="pv-date-pill-text" id="disp-start-time">시간</span>
            <input type="hidden" id="f-start-time">
          </button>
        </div>
        <div class="pv-timeline-row is-end">
          <div class="pv-timeline-marker"><span class="pv-timeline-dot"></span></div>
          <span class="pv-timeline-label">종료</span>
          <button type="button" class="pv-date-pill is-empty" id="pill-end-date" onclick="openCalendar('end', event)">
            <span class="pv-date-pill-text" id="disp-end-date">날짜</span>
            <input type="hidden" id="f-end">
          </button>
          <button type="button" class="pv-date-pill is-empty" id="pill-end-time" onclick="openTimepick('end', event)">
            <span class="pv-date-pill-text" id="disp-end-time">시간</span>
            <input type="hidden" id="f-end-time">
          </button>
        </div>
        <div class="pv-calendar" id="pv-calendar" hidden>
          <div class="pv-cal-header">
            <button type="button" class="pv-cal-month" id="pv-cal-month">2026년 6월<i data-lucide="chevron-right"></i></button>
            <div class="pv-cal-nav">
              <button type="button" onclick="changeMonth(-1)" aria-label="이전 달"><i data-lucide="chevron-left"></i></button>
              <button type="button" onclick="changeMonth(1)" aria-label="다음 달"><i data-lucide="chevron-right"></i></button>
            </div>
          </div>
          <div class="pv-cal-weekdays">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="pv-cal-grid" id="pv-cal-grid"></div>
        </div>
        <div class="pv-timepick" id="pv-timepick" hidden>
          <div class="pv-tp-list" id="pv-tp-list"></div>
        </div>
        <div class="pv-date-dday" id="f-dday"></div>
      </div>
    </div>

    <div class="pv-divider"></div>

    <!-- 자격 조건 -->
    <div class="pv-section">
      <div class="pv-section-title">이런 분이라면 신청해보세요</div>
      <div class="pv-checklist" id="pv-checklist">
        <button class="pv-check-add" type="button" onclick="addCondition()">
          <span class="pv-check-add-circle"><i data-lucide="plus"></i></span>
          <span>조건 추가</span>
        </button>
      </div>
    </div>

    <div class="pv-divider"></div>

    <!-- 이벤트 안내 -->
    <div class="pv-section">
      <div class="pv-section-title">이벤트 안내</div>
      <div class="editable pv-desc" id="f-desc" contenteditable="true" data-placeholder="이벤트 진행 방식이나 안내사항을 적어주세요"></div>
    </div>

    <!-- CTA 문구 -->
    <div class="pv-cta-config">
      <span class="pv-cta-config-label">신청 버튼 문구</span>
      <input type="text" id="f-cta" value="이벤트 신청">
    </div>

  </div>

  <!-- Publish -->
  <div class="sticky-bar">
    <button class="btn btn-xl btn-block btn-fill-primary" id="publish-btn" onclick="publishEvent()" disabled>발행하기</button>
  </div>

</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();

  /* ── Image uploader (placeholder color blocks) ── */
  var images = [];
  var stockColors = [
    'linear-gradient(135deg,#a9a9ee,#5555cc)',
    'linear-gradient(135deg,#fcd34d,#f59e0b)',
    'linear-gradient(135deg,#93c5fd,#3b82f6)',
    'linear-gradient(135deg,#f9a8d4,#ec4899)',
    'linear-gradient(135deg,#34d399,#10b981)'
  ];

  function blockEnter(e) {
    if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  }

  /* contenteditable에 남는 <br>·빈 노드를 제거해 :empty 가 다시 매칭되도록 함 */
  document.addEventListener('input', function(e) {
    var el = e.target;
    if (!el.isContentEditable) return;
    if (el.textContent.trim() === '') el.innerHTML = '';
  });

  function addImage(e) {
    if (e) e.preventDefault();
    if (images.length >= 5) return;
    images.push({ bg: stockColors[images.length % stockColors.length] });
    renderImages();
    onInput();
  }

  function removeCurrentImage() {
    if (images.length === 0) return;
    var track = document.getElementById('pv-hero-track');
    var idx = Math.round(track.scrollLeft / track.clientWidth);
    images.splice(idx, 1);
    renderImages();
    onInput();
  }

  function renderImages() {
    var emptyEl = document.getElementById('pv-hero-empty');
    var trackEl = document.getElementById('pv-hero-track');
    var counterEl = document.getElementById('pv-hero-counter');
    var actionsEl = document.getElementById('pv-hero-actions');
    var coverEl = document.getElementById('pv-hero-cover');

    trackEl.innerHTML = '';
    if (images.length === 0) {
      emptyEl.style.display = 'flex';
      trackEl.style.display = 'none';
      counterEl.style.display = 'none';
      actionsEl.classList.remove('on');
      coverEl.style.display = 'none';
      return;
    }
    emptyEl.style.display = 'none';
    trackEl.style.display = 'flex';
    actionsEl.classList.add('on');
    coverEl.style.display = 'block';

    images.forEach(function(img) {
      var slide = document.createElement('div');
      slide.className = 'pv-hero-slide';
      slide.style.background = img.bg;
      slide.style.backgroundSize = 'cover';
      slide.style.backgroundPosition = 'center';
      trackEl.appendChild(slide);
    });
    trackEl.scrollLeft = 0;

    if (images.length > 1) {
      counterEl.style.display = 'inline-block';
      counterEl.textContent = '1 / ' + images.length;
    } else {
      counterEl.style.display = 'none';
    }
    lucide.createIcons();
  }

  function updateHeroCounter() {
    var track = document.getElementById('pv-hero-track');
    var counter = document.getElementById('pv-hero-counter');
    var coverEl = document.getElementById('pv-hero-cover');
    if (images.length <= 1) return;
    var idx = Math.round(track.scrollLeft / track.clientWidth);
    counter.textContent = (idx + 1) + ' / ' + images.length;
    coverEl.style.display = idx === 0 ? 'block' : 'none';
  }

  /* ── Conditions ── */
  function addCondition() {
    var list = document.getElementById('pv-checklist');
    var addBtn = list.querySelector('.pv-check-add');
    var row = document.createElement('div');
    row.className = 'pv-check-item';
    row.innerHTML =
      '<span class="pv-check-circle"><i data-lucide="check"></i></span>' +
      '<span class="pv-check-text" contenteditable="true" data-placeholder="예) 비용 부담으로 미뤄온 분" oninput="onInput()" onkeydown="blockEnter(event)"></span>' +
      '<button class="pv-check-remove" aria-label="삭제" onclick="this.closest(\'.pv-check-item\').remove();onInput();"><i data-lucide="x"></i></button>';
    list.insertBefore(row, addBtn);
    lucide.createIcons();
    setTimeout(function(){ row.querySelector('.pv-check-text').focus(); }, 0);
  }

  /* ── Date/Time pill formatters ── */
  var WEEKDAYS = ['일','월','화','수','목','금','토'];
  function formatDate(val) {
    var d = new Date(val + 'T00:00:00');
    return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WEEKDAYS[d.getDay()] + ')';
  }
  function formatTime(val) {
    var parts = val.split(':');
    var h = parseInt(parts[0], 10);
    var m = parts[1];
    var period = h < 12 ? '오전' : '오후';
    var h12 = h % 12 === 0 ? 12 : h % 12;
    return period + ' ' + h12 + ':' + m;
  }
  function updatePillDisplay(input) {
    var display = document.getElementById(input.dataset.display);
    var pill = input.closest('.pv-date-pill');
    var val = input.value;
    if (!val) {
      display.textContent = input.type === 'date' ? '날짜' : '시간';
      pill.classList.add('is-empty');
    } else {
      display.textContent = input.type === 'date' ? formatDate(val) : formatTime(val);
      pill.classList.remove('is-empty');
    }
    onInput();
  }

  /* ── Custom calendar ── */
  var calState = { field: null, viewYear: 0, viewMonth: 0 };
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function toISO(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }
  function parseISO(s) {
    var p = s.split('-');
    return { y: +p[0], m: +p[1] - 1, d: +p[2] };
  }

  function openCalendar(field, e) {
    if (e) e.stopPropagation();
    closeTimepick();
    var input = document.getElementById('f-' + field);
    var ref;
    if (input.value) ref = parseISO(input.value);
    else {
      var t = new Date();
      ref = { y: t.getFullYear(), m: t.getMonth(), d: t.getDate() };
    }
    calState.field = field;
    calState.viewYear = ref.y;
    calState.viewMonth = ref.m;
    document.querySelectorAll('.pv-date-pill').forEach(function(p) { p.classList.remove('is-active'); });
    var pill = document.getElementById('pill-' + field + '-date');
    pill.classList.add('is-active');
    var cal = document.getElementById('pv-calendar');
    cal.hidden = false;
    placePicker(cal, pill);
    renderCalendar();
  }

  function placePicker(picker, anchorPill) {
    var card = document.querySelector('.pv-date-card');
    var cardRect = card.getBoundingClientRect();
    var pillRect = anchorPill.getBoundingClientRect();
    picker.style.top = (pillRect.bottom - cardRect.top + 8) + 'px';
    if (picker.classList.contains('pv-timepick')) {
      picker.style.left = (pillRect.left - cardRect.left) + 'px';
      picker.style.width = pillRect.width + 'px';
    }
  }

  function closeCalendar() {
    document.getElementById('pv-calendar').hidden = true;
    document.querySelectorAll('.pv-date-pill').forEach(function(p) { p.classList.remove('is-active'); });
    calState.field = null;
  }

  function changeMonth(delta) {
    var m = calState.viewMonth + delta;
    var y = calState.viewYear;
    if (m < 0) { m = 11; y--; }
    else if (m > 11) { m = 0; y++; }
    calState.viewYear = y;
    calState.viewMonth = m;
    renderCalendar();
  }

  function goToday() {
    var t = new Date();
    calState.viewYear = t.getFullYear();
    calState.viewMonth = t.getMonth();
    renderCalendar();
  }

  function renderCalendar() {
    var y = calState.viewYear, m = calState.viewMonth;
    var monthBtn = document.getElementById('pv-cal-month');
    monthBtn.innerHTML = y + '년 ' + (m + 1) + '월<i data-lucide="chevron-right"></i>';
    if (window.lucide) lucide.createIcons();

    var firstDow = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var prevMonthDays = new Date(y, m, 0).getDate();

    var selected = null;
    var input = document.getElementById('f-' + calState.field);
    if (input && input.value) selected = parseISO(input.value);

    var otherField = calState.field === 'start' ? 'end' : 'start';
    var otherVal = document.getElementById('f-' + otherField).value;
    var otherDate = otherVal ? parseISO(otherVal) : null;

    var grid = document.getElementById('pv-cal-grid');
    grid.innerHTML = '';

    var cells = [];
    for (var i = firstDow - 1; i >= 0; i--) {
      cells.push({ day: prevMonthDays - i, outside: true, year: m === 0 ? y - 1 : y, month: m === 0 ? 11 : m - 1 });
    }
    for (var d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, outside: false, year: y, month: m });
    }
    var nextMonth = m === 11 ? 0 : m + 1;
    var nextYear = m === 11 ? y + 1 : y;
    var trailing = 42 - cells.length;
    for (var t = 1; t <= trailing; t++) {
      cells.push({ day: t, outside: true, year: nextYear, month: nextMonth });
    }

    cells.forEach(function(c) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pv-cal-day';
      if (c.outside) btn.classList.add('is-outside');
      if (selected && selected.y === c.year && selected.m === c.month && selected.d === c.day) {
        btn.classList.add('is-selected');
      }
      var disabled = false;
      if (otherDate) {
        var cellTs = new Date(c.year, c.month, c.day).getTime();
        var otherTs = new Date(otherDate.y, otherDate.m, otherDate.d).getTime();
        if (calState.field === 'start' && cellTs > otherTs) disabled = true;
        if (calState.field === 'end' && cellTs < otherTs) disabled = true;
      }
      if (disabled) {
        btn.classList.add('is-disabled');
        btn.disabled = true;
      }
      btn.textContent = c.day;
      btn.onclick = function(ev) {
        ev.stopPropagation();
        selectDate(c.year, c.month, c.day);
      };
      grid.appendChild(btn);
    });
  }

  function selectDate(y, m, d) {
    var input = document.getElementById('f-' + calState.field);
    var iso = toISO(y, m, d);
    input.value = iso;
    var display = document.getElementById('disp-' + calState.field + '-date');
    var pill = document.getElementById('pill-' + calState.field + '-date');
    display.textContent = formatDate(iso);
    pill.classList.remove('is-empty');
    closeCalendar();
    onInput();
  }

  /* ── Time picker (scrollable list at 30-min steps) ── */
  var timeState = { field: null, slot: null };

  function timeSlotLabel(slot) {
    var h24 = Math.floor(slot / 2);
    var m = (slot % 2) * 30;
    var period = h24 < 12 ? '오전' : '오후';
    var h12 = h24 % 12 === 0 ? 12 : h24 % 12;
    return period + ' ' + pad2(h12) + ':' + pad2(m);
  }
  function timeSlotIso(slot) {
    var h24 = Math.floor(slot / 2);
    var m = (slot % 2) * 30;
    return pad2(h24) + ':' + pad2(m);
  }
  function slotFromIso(iso) {
    var parts = iso.split(':');
    var h24 = parseInt(parts[0], 10);
    var m = parseInt(parts[1], 10);
    return h24 * 2 + (m >= 30 ? 1 : 0);
  }

  function openTimepick(field, e) {
    if (e) e.stopPropagation();
    closeCalendar();
    var input = document.getElementById('f-' + field + '-time');
    timeState.slot = input.value ? slotFromIso(input.value) : null;
    timeState.field = field;
    var pill = document.getElementById('pill-' + field + '-time');
    document.querySelectorAll('.pv-date-pill').forEach(function(p) { p.classList.remove('is-active'); });
    pill.classList.add('is-active');
    var tp = document.getElementById('pv-timepick');
    tp.hidden = false;
    placePicker(tp, pill);
    renderTimepick();
  }

  function closeTimepick() {
    document.getElementById('pv-timepick').hidden = true;
    document.querySelectorAll('.pv-date-pill').forEach(function(p) { p.classList.remove('is-active'); });
    timeState.field = null;
  }

  function renderTimepick() {
    var list = document.getElementById('pv-tp-list');
    list.innerHTML = '';
    var selectedBtn = null;
    for (var s = 0; s < 48; s++) {
      (function(s) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pv-tp-item';
        if (timeState.slot === s) {
          btn.classList.add('is-selected');
          selectedBtn = btn;
        }
        btn.textContent = timeSlotLabel(s);
        btn.onclick = function(ev) { ev.stopPropagation(); selectTimeSlot(s); };
        list.appendChild(btn);
      })(s);
    }
    requestAnimationFrame(function() {
      var target = selectedBtn || list.children[18];
      if (target) {
        list.scrollTop = target.offsetTop - list.clientHeight / 2 + target.offsetHeight / 2;
      }
    });
  }

  function selectTimeSlot(s) {
    timeState.slot = s;
    var iso = timeSlotIso(s);
    var input = document.getElementById('f-' + timeState.field + '-time');
    input.value = iso;
    var display = document.getElementById('disp-' + timeState.field + '-time');
    var pill = document.getElementById('pill-' + timeState.field + '-time');
    display.textContent = formatTime(iso);
    pill.classList.remove('is-empty');
    closeTimepick();
    onInput();
  }

  document.addEventListener('click', function(e) {
    var cal = document.getElementById('pv-calendar');
    if (cal && !cal.hidden) {
      if (!cal.contains(e.target)) {
        var pill = e.target.closest('.pv-date-pill');
        if (!pill || (pill.id !== 'pill-start-date' && pill.id !== 'pill-end-date')) {
          closeCalendar();
        }
      }
    }
    var tp = document.getElementById('pv-timepick');
    if (tp && !tp.hidden) {
      if (!tp.contains(e.target)) {
        var pill2 = e.target.closest('.pv-date-pill');
        if (!pill2 || (pill2.id !== 'pill-start-time' && pill2.id !== 'pill-end-time')) {
          closeTimepick();
        }
      }
    }
  });

  /* ── Validation + D-Day ── */
  function onInput() {
    var titleOK = document.getElementById('f-title').textContent.trim() !== '';
    var start = document.getElementById('f-start').value;
    var end = document.getElementById('f-end').value;

    document.getElementById('publish-btn').disabled = !titleOK;

    /* D-Day */
    var dday = document.getElementById('f-dday');
    if (start && end) {
      var d1 = new Date(start), d2 = new Date(end);
      var diff = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
      if (diff < 0) {
        dday.textContent = '종료일이 시작일보다 빨라요';
        dday.style.color = 'var(--color-destructive)';
      } else {
        dday.textContent = '총 ' + (diff + 1) + '일 동안 진행돼요';
        dday.style.color = 'var(--color-primary)';
      }
      dday.classList.add('on');
    } else {
      dday.classList.remove('on');
    }
  }

  function publishEvent() {
    if (document.getElementById('publish-btn').disabled) return;
    alert('이벤트가 발행되었습니다 (목업)');
  }

  // 초기 호출
  onInput();
</script>
</body>
</html>
