<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인</title>
  <style>
    :root {
      --bg-base:           oklch(97.5% .008 285);
      --bg-surface:        oklch(99.5% .003 285);
      --bg-elevated:       oklch(94%   .015 285);
      --bg-primary-subtle: oklch(45% .24 290 / 0.08);

      --text-primary:   oklch(13%  .025 285);
      --text-secondary: oklch(48%  .02  285);
      --text-tertiary:  oklch(67%  .01  285);
      --text-brand:     oklch(45%  .24  290);

      --primary:              #6B6BE1;
      --logo-stop-a:          #6B6BE1;
      --logo-stop-b:          #E94F6E;
      --logo-stop-c:          #E94F6E;
      --border-default:       oklch(87%  .015 285);
      --checkbox-empty:       oklch(82%  .015 285);
      --checkbox-rect:        oklch(87%  .015 285);
      --checkbox-path:        oklch(67%  .01  285);
      --gradient-brand: linear-gradient(135deg, #6B6BE1, #E94F6E);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      font-size: 16px;
      line-height: 1.5;
      transition: background 0.25s, color 0.25s;
    }

    .outer-card {
      width: min(400px, 100%);
      border-radius: 20px;
      overflow: hidden;
    }

    /* ── Left panel ── */
    /* ── Right panel (login content) ── */
    .right-panel {
      flex: 1;
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 48px;
      min-height: 520px;
      transition: background 0.25s;
    }

    .login-content {
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      margin-bottom: 10px;
    }

    .logo svg {
      width: 160px;
      height: auto;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* ── Actions ── */
    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* ── Social login stack ── */
    .social-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 공통 소셜 버튼 — 모든 브랜드 동일한 크기/모양 */
    .btn-social {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid transparent;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.2s, background 0.2s;
    }

    .btn-social svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .btn-social:hover {
      opacity: 0.88;
    }

    /* 구글: 주력이면 흰 버튼으로 시선 유도 */
    .is-primary.social-google {
      background: #FFFFFF;
      color: #1F1F1F;
      border-color: var(--border-default);
    }

    /* 보조(그 아래): 투명 배경 + 연한 테두리로 조용히 물러남 */
    .is-secondary {
      background: transparent;
      color: var(--text-secondary);
      border-color: var(--bg-elevated);
    }

    .is-secondary svg {
      opacity: 0.8;
    }

    .is-secondary:hover {
      opacity: 1;
      background: var(--bg-elevated);
    }

    /* 카카오: 위치(주력/보조)와 무관하게 항상 브랜드 노랑 유지 — 보조 규칙보다 뒤에 두어 확실히 우선 */
    .social-kakao,
    .is-secondary.social-kakao {
      background: #FEE500;
      color: #191919;
      border-color: transparent;
    }

    .is-secondary.social-kakao svg {
      opacity: 1;
    }

    /* ── 데모 전용: 지역(KR/해외) 전환 토글 — 실서비스엔 없음 ── */
    .demo-locale-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px dashed var(--border-default);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      z-index: 10;
    }

    .demo-locale-toggle:hover {
      color: var(--text-primary);
    }

    /* ── OR 디바이더 ── */
    .or-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .or-divider::before,
    .or-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--bg-elevated);
    }

    .or-divider-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      letter-spacing: 0.04em;
    }

    /* ── 원형 아이콘 버튼 행 (보조 소셜 + 이메일) ── */
    .icon-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      /* 위는 박스, 아래는 원형이라 동일 간격도 원형쪽이 더 비어 보여 살짝 당김 */
      margin-top: -8px;
    }

    .btn-icon {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid var(--bg-elevated);
      background: var(--bg-surface);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-icon svg {
      width: 22px;
      height: 22px;
    }

    .btn-icon:hover {
      background: var(--bg-elevated);
    }

    /* 카카오 원형 아이콘: 다른 것과 동일한 중립 원형 + 아이콘만 카카오 브라운 */
    .btn-icon[data-social="kakao"] {
      color: #3C1E1E;
    }

    /* 개인정보 처리방침 */
    .link-privacy {
      font-size: 13px;
      color: var(--text-tertiary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .link-privacy:hover {
      color: var(--text-secondary);
    }

    /* ── Email screen ── */
    .email-screen {
      position: absolute;
      inset: 0;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border-radius: inherit;
      opacity: 0;
      pointer-events: none;
      transform: translateX(24px);
      transition: opacity 0.25s, transform 0.25s;
      padding: 48px 36px 36px;
      gap: 32px;
    }

    .email-screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .email-screen-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin-top: 16px;
    }

    .email-field-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .email-input-wrap {
      background: var(--bg-elevated);
      border-radius: 12px;
      padding: 1.5px;
      transition: background 0.15s;
    }

    .email-input-wrap.focused {
      background: var(--primary);
    }

    .email-input-inner {
      background: var(--bg-elevated);
      border-radius: 10.5px;
      padding: 14px 16px;
    }

    .email-input-inner input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 16px;
      color: var(--text-primary);
      font-family: inherit;
    }

    .email-input-inner input::placeholder {
      color: var(--text-tertiary);
    }

    .btn-next {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }

    .btn-next:hover {
      opacity: 0.88;
    }

    .email-screen-back {
      position: absolute;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .email-screen-back svg {
      width: 20px;
      height: 20px;
    }

    /* ── Signup screen ── */
    .signup-screen {
      position: absolute;
      inset: 0;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border-radius: inherit;
      opacity: 0;
      pointer-events: none;
      transform: translateX(24px);
      transition: opacity 0.25s, transform 0.25s;
      padding: 36px 36px 28px;
      gap: 16px;
    }

    .signup-screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .signup-screen-back {
      display: flex;
      align-items: center;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0;
      align-self: flex-start;
    }

    .signup-screen-back svg { width: 20px; height: 20px; }
    .signup-screen-back:hover { color: var(--text-primary); }

    .signup-screen-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .signup-email-badge {
      display: inline-flex;
      align-items: center;
      background: var(--bg-elevated);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      align-self: flex-start;
    }

    .signup-field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .signup-screen #signupPwWrap {
      margin-bottom: 8px;
    }

    .signup-agree-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .signup-screen .term-row {
      padding: 3px 4px;
    }

    .signup-field-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .signup-input-wrap {
      background: var(--bg-elevated);
      border-radius: 12px;
      padding: 1.5px;
      transition: background 0.15s;
    }

    .signup-input-wrap.focused { background: var(--primary); }

    .signup-input-inner {
      background: var(--bg-elevated);
      border-radius: 10.5px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .signup-input-inner input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 16px;
      color: var(--text-primary);
      font-family: inherit;
    }

    .signup-input-inner input::placeholder { color: var(--text-tertiary); }

    .signup-agree-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .signup-agree-label {
      flex: 1;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .link-signup-privacy {
      font-size: 13px;
      color: var(--text-tertiary);
      text-decoration: none;
      white-space: nowrap;
    }

    .link-signup-privacy:hover { color: var(--text-secondary); }

    .btn-signup {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }

    .btn-signup:hover:not(:disabled) { opacity: 0.88; }

    .btn-signup:disabled {
      background: var(--bg-elevated);
      color: var(--text-tertiary);
      cursor: not-allowed;
    }

    /* ── Password screen ── */
    .password-screen {
      position: absolute;
      inset: 0;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      border-radius: inherit;
      opacity: 0;
      pointer-events: none;
      transform: translateX(24px);
      transition: opacity 0.25s, transform 0.25s;
      padding: 48px 36px 36px;
      gap: 24px;
    }

    .password-screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .password-screen-back {
      display: flex;
      align-items: center;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0;
      align-self: flex-start;
    }

    .password-screen-back svg {
      width: 20px;
      height: 20px;
    }

    .password-screen-back:hover { color: var(--text-primary); }

    .password-screen-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .password-email-badge {
      display: inline-flex;
      align-items: center;
      background: var(--bg-elevated);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      align-self: flex-start;
    }

    .password-field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .password-field-label {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .password-input-wrap {
      background: var(--bg-elevated);
      border-radius: 12px;
      padding: 1.5px;
      transition: background 0.15s;
    }

    .password-input-wrap.focused {
      background: var(--primary);
    }

    .password-input-inner {
      background: var(--bg-elevated);
      border-radius: 10.5px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .password-input-inner input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 16px;
      color: var(--text-primary);
      font-family: inherit;
    }

    .password-input-inner input::placeholder {
      color: var(--text-tertiary);
    }

    .btn-pw-toggle {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
    }

    .btn-pw-toggle svg { width: 18px; height: 18px; }
    .btn-pw-toggle:hover { color: var(--text-secondary); }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }

    .btn-login:hover { opacity: 0.88; }

    .link-forgot {
      text-align: center;
      font-size: 13px;
      color: var(--text-tertiary);
      text-decoration: none;
    }

    .link-forgot:hover { color: var(--text-secondary); }

    /* ── Terms back button ── */
    .terms-back {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0;
      font-size: 14px;
      font-family: inherit;
      align-self: flex-start;
    }

    .terms-back svg {
      width: 18px;
      height: 18px;
    }

    .terms-back:hover {
      color: var(--text-primary);
    }

    /* ── Terms screen ── */
    .right-panel {
      position: relative;
    }

    .terms-screen {
      position: absolute;
      inset: 0;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      border-radius: inherit;
      opacity: 0;
      pointer-events: none;
      transform: translateX(24px);
      transition: opacity 0.25s, transform 0.25s;
    }

    .terms-screen.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .terms-body {
      flex: 1;
      overflow-y: auto;
      padding: 36px 36px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .terms-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .terms-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* 전체 동의하기 박스 */
    .agree-all-box {
      background: var(--bg-elevated);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .agree-all-row {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .agree-all-text {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .agree-all-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .agree-all-sub {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* 개별 약관 행 */
    .terms-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .term-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 4px;
      cursor: pointer;
    }

    .terms-screen .term-row + .term-row {
      position: relative;
    }

    .terms-screen .term-row + .term-row::before {
      content: "";
      position: absolute;
      top: 0;
      left: 40px;
      right: 0;
      height: 1px;
      background: var(--border-default);
    }

    .term-label {
      flex: 1;
      font-size: 14px;
      color: var(--text-primary);
    }

    .term-chevron {
      color: var(--text-tertiary);
    }

    .term-chevron svg {
      width: 16px;
      height: 16px;
    }

    /* 커스텀 체크박스 — Figma 컴포넌트 기반 SVG */
    .custom-check {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .custom-check .check-rect {
      fill: var(--checkbox-rect);
      transition: fill 0.15s;
    }

    .custom-check .check-path {
      fill: var(--checkbox-path);
      transition: fill 0.15s;
    }

    .custom-check.checked .check-rect {
      fill: var(--primary);
    }

    .custom-check.checked .check-path {
      fill: #fff;
    }

    /* 동의 버튼 */
    .terms-footer {
      padding: 16px 36px 32px;
    }

    .btn-agree {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s, background 0.2s;
    }

    .btn-agree:hover:not(:disabled) {
      opacity: 0.88;
    }

    .btn-agree:disabled {
      background: var(--bg-elevated);
      color: var(--text-tertiary);
      cursor: not-allowed;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        min-height: unset;
        align-items: flex-start;
      }

      .outer-card {
        width: 100%;
        border-radius: 0;
        min-height: 100svh;
      }

      .right-panel {
        padding: 36px 24px;
        border-radius: 0;
        min-height: 100svh;
      }
    }
  </style>
</head>
<body>

  <!-- 데모 전용: 지역 전환 (실서비스엔 없음) -->
  <button class="demo-locale-toggle" id="localeToggle"></button>

  <div class="outer-card">

    <!-- 왼쪽 브랜드 패널 (PC only) -->

    <!-- 오른쪽 로그인 패널 -->
    <div class="right-panel">
      <div class="login-content">
        <div class="hero">
          <div class="logo">
            <svg width="120" height="20" viewBox="0 0 120 20" fill="none" xmlns="http://www.w3.org/2000/svg">

  <script>
    // 회원가입 화면
    const signupScreen = document.getElementById('signupScreen');

    const signupEmailBadge = document.getElementById('signupEmailBadge');
    const signupNameWrap = document.getElementById('signupNameWrap');
    const signupPwWrap = document.getElementById('signupPwWrap');
    const signupNameInput = document.getElementById('signupNameInput');
    const signupPwInput = document.getElementById('signupPwInput');
    const signupPwToggle = document.getElementById('signupPwToggle');
    const signupPwEyeIcon = document.getElementById('signupPwEyeIcon');
    const signupCheckAll = document.getElementById('signupCheckAll');
    const signupCheck1 = document.getElementById('signupCheck1');
    const signupCheck2 = document.getElementById('signupCheck2');
    const signupAgreeAllRow = document.getElementById('signupAgreeAllRow');
    const signupTermRow1 = document.getElementById('signupTermRow1');
    const signupTermRow2 = document.getElementById('signupTermRow2');
    const btnSignup = document.getElementById('btnSignup');
    const signupItemChecks = [signupCheck1, signupCheck2];

    function syncSignupAll() {
      const allChecked = signupItemChecks.every(c => c.classList.contains('checked'));
      const hasName = signupNameInput.value.trim().length > 0;
      const hasPw = signupPwInput.value.length > 0;
      signupCheckAll.classList.toggle('checked', allChecked);
      btnSignup.disabled = !(allChecked && hasName && hasPw);
    }

    signupAgreeAllRow.addEventListener('click', () => {
      const allChecked = signupItemChecks.every(c => c.classList.contains('checked'));
      signupItemChecks.forEach(c => c.classList.toggle('checked', !allChecked));
      syncSignupAll();
    });

    signupTermRow1.addEventListener('click', (e) => {
      if (e.target.closest('.term-chevron')) return;
      signupCheck1.classList.toggle('checked');
      syncSignupAll();
    });

    signupTermRow2.addEventListener('click', (e) => {
      if (e.target.closest('.term-chevron')) return;
      signupCheck2.classList.toggle('checked');
      syncSignupAll();
    });

    signupBack.addEventListener('click', () => {
      signupScreen.classList.remove('active');
      emailScreen.classList.add('active');
    });

    signupNameInput.addEventListener('focus', () => signupNameWrap.classList.add('focused'));
    signupNameInput.addEventListener('blur', () => signupNameWrap.classList.remove('focused'));
    signupNameInput.addEventListener('input', syncSignupAll);
    signupPwInput.addEventListener('focus', () => signupPwWrap.classList.add('focused'));
    signupPwInput.addEventListener('blur', () => signupPwWrap.classList.remove('focused'));
    signupPwInput.addEventListener('input', syncSignupAll);

    signupPwToggle.addEventListener('click', () => {
      const isHidden = signupPwInput.type === 'password';
      signupPwInput.type = isHidden ? 'text' : 'password';
      signupPwEyeIcon.innerHTML = isHidden
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'

    });

    // 비밀번호 화면
    const passwordScreen = document.getElementById('passwordScreen');
    const passwordBack = document.getElementById('passwordBack');
    const passwordInput = document.getElementById('passwordInput');
    const passwordWrap = document.getElementById('passwordWrap');
    const passwordEmailBadge = document.getElementById('passwordEmailBadge');
    const pwToggle = document.getElementById('pwToggle');
    const pwEyeIcon = document.getElementById('pwEyeIcon');

    passwordBack.addEventListener('click', () => {
      passwordScreen.classList.remove('active');
      emailScreen.classList.add('active');
    });

    passwordInput.addEventListener('focus', () => passwordWrap.classList.add('focused'));
    passwordInput.addEventListener('blur', () => passwordWrap.classList.remove('focused'));

    pwToggle.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      pwEyeIcon.innerHTML = isHidden
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    });

    const emailBack = document.getElementById('emailBack');
    const emailInput = document.getElementById('emailInput');
    const emailWrap = document.getElementById('emailWrap');

    emailBack.addEventListener('click', () => {
      emailScreen.classList.remove('active');
    });

    emailInput.addEventListener('focus', () => emailWrap.classList.add('focused'));
    emailInput.addEventListener('blur', () => emailWrap.classList.remove('focused'));

    const btnNext = document.getElementById('btnNext');
    btnNext.addEventListener('click', () => {
      const val = emailInput.value.trim();
      if (!val) return;
      if (val === 'yuka@jober.io') {
        passwordEmailBadge.textContent = val;
        emailScreen.classList.remove('active');
        passwordScreen.classList.add('active');
        setTimeout(() => passwordInput.focus(), 260);

        signupEmailBadge.textContent = val;
        emailScreen.classList.remove('active');
        signupScreen.classList.add('active');
        setTimeout(() => signupNameInput.focus(), 260);

    const agreeAllRow = document.getElementById('agreeAllRow');

      document.getElementById('checkAll'),
      document.getElementById('check1'),
      document.getElementById('check2'),

      document.getElementById('check1'),
      document.getElementById('check2'),
    ];

    // 초기 버튼 상태 동기화

      },

    // 지역별 노출 순서 (id 배열) — 새 지역/소셜은 여기만 손보면 됨
    const ORDER = {

      INTL: ['google', 'kakao'],   // 해외: 구글 → 카카오
    };

    // 이메일 로그인 (원형 아이콘용)
    const EMAIL = {
      label: { KR: '이메일로 시작', INTL: 'Continue with email' },
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M2 7l10 7 10-7"/></svg>',
    };

    const socialStack = document.getElementById('socialStack');
    const altRow = document.getElementById('altRow');
    const localeToggle = document.getElementById('localeToggle');
    let locale = 'KR';

    // 주력(맨 위): 꽉 찬 브랜드 버튼
    function makeFullBtn(id) {
      const s = SOCIALS[id];
      const btn = document.createElement('button');
      btn.className = 'btn-social ' + s.className + ' is-primary';
      btn.dataset.social = id;
      btn.innerHTML = s.logo + '<span>' + s.label[locale] + '</span>';
      return btn;
    }

    // 보조 소셜: 원형 아이콘 버튼
    function makeIconBtn(id) {
      const s = SOCIALS[id];
      const btn = document.createElement('button');
      btn.className = 'btn-icon';
      btn.dataset.social = id;
      btn.setAttribute('aria-label', s.label[locale]);
      btn.innerHTML = s.logo;
      return btn;
    }

    // 이메일: 원형 아이콘 버튼
    function makeEmailBtn() {
      const btn = document.createElement('button');
      btn.className = 'btn-icon';
      btn.dataset.action = 'email';
      btn.setAttribute('aria-label', EMAIL.label[locale]);
      btn.innerHTML = EMAIL.icon;
      return btn;
    }

    function renderSocials() {
      const order = ORDER[locale];
      socialStack.innerHTML = '';
      socialStack.appendChild(makeFullBtn(order[0]));            // 주력 1개
      altRow.innerHTML = '';
      order.slice(1).forEach((id) => altRow.appendChild(makeIconBtn(id)));  // 나머지 소셜
      altRow.appendChild(makeEmailBtn());                        // 이메일도 원형 아이콘
    }

    // 주력 버튼 클릭 → 약관 화면
    socialStack.addEventListener('click', (e) => {
      if (e.target.closest('.btn-social')) {
        termsScreen.classList.add('active');
      }
    });

    // 원형 버튼: 소셜 → 약관, 이메일 → 이메일 입력 화면
    altRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.btn-icon');
      if (!btn) return;
      if (btn.dataset.action === 'email') {
        emailScreen.classList.add('active');
        setTimeout(() => emailInput.focus(), 260);
      } else if (btn.dataset.social) {
        termsScreen.classList.add('active');
      }
    });

    // ── 화면 전체 문구 i18n (한국어 ↔ 해외 영어) ────────────
    // sel: 대상 셀렉터, ph: placeholder, html: <br> 등 마크업 포함
    const I18N = [
      { sel: '.subtitle',              ko: '나를 소개하는 가장 새로운 방법', en: 'A whole new way to introduce yourself' },
      { sel: '.or-divider-text',       ko: '또는',                         en: 'OR' },
      { sel: '.link-privacy',          ko: '개인정보 처리방침',             en: 'Privacy Policy' },
      // 이메일 입력 화면
      { sel: '.email-screen-title',    ko: '이메일을 입력해주세요',         en: 'Enter your email' },
      { sel: '#emailInput', ph: true,  ko: '이메일',                       en: 'Email' },
      { sel: '#btnNext',               ko: '다음',                         en: 'Next' },
      // 비밀번호 화면
      { sel: '.password-screen-title', html: true, ko: '다시 오신 것을<br>환영해요', en: 'Welcome<br>back' },
      { sel: '.password-field-label',  ko: '비밀번호를 입력해주세요',       en: 'Enter your password' },
      { sel: '#passwordInput', ph: true, ko: '비밀번호',                   en: 'Password' },
      { sel: '#btnLogin',              ko: '로그인',                       en: 'Log in' },
      { sel: '.link-forgot',           ko: '비밀번호를 잊으셨나요?',        en: 'Forgot your password?' },
      // 회원가입 화면
      { sel: '.signup-screen-title',   ko: '회원가입',                     en: 'Sign up' },
      { sel: '.signup-field-label',    ko: '이름과 비밀번호를 설정해주세요', en: 'Set your name and password' },
      { sel: '#signupNameInput', ph: true, ko: '이름',                    en: 'Name' },
      { sel: '#signupPwInput', ph: true, ko: '비밀번호',                  en: 'Password' },
      { sel: '#signupAgreeAllRow .agree-all-label',   ko: '전체 동의하기', en: 'Agree to all' },
      { sel: '#signupTermRow1 .term-label', ko: '(필수) 서비스 이용약관',   en: '(Required) Terms of Service' },
      { sel: '#signupTermRow2 .term-label', ko: '(필수) 개인정보 처리방침', en: '(Required) Privacy Policy' },
      { sel: '#btnSignup',             ko: '동의 및 회원가입',             en: 'Agree & sign up' },
      // 약관동의 화면
      { sel: '.terms-back-label',      ko: '뒤로',                         en: 'Back' },
      { sel: '.terms-title', html: true, ko: '서비스 이용을 위해<br>약관에 동의해 주세요.', en: 'Please agree to the terms<br>to use the service.' },
      { sel: '#agreeAllRow .agree-all-label',  ko: '전체 동의하기',        en: 'Agree to all' },
      { sel: '#termsScreen [data-id="term1"] .term-label', ko: '(필수) 서비스 이용약관',   en: '(Required) Terms of Service' },
      { sel: '#termsScreen [data-id="term2"] .term-label', ko: '(필수) 개인정보 처리방침', en: '(Required) Privacy Policy' },
      { sel: '#btnAgree',              ko: '동의',                         en: 'Agree' },
    ];

    function applyLocale() {
      const lang = locale === 'KR' ? 'ko' : 'en';
      I18N.forEach((t) => {
        const el = document.querySelector(t.sel);
        if (!el) return;
        if (t.ph) el.placeholder = t[lang];
        else if (t.html) el.innerHTML = t[lang];
        else el.textContent = t[lang];
      });
      document.documentElement.lang = lang;
    }

    // 데모 전용: 지역(KR/해외) 전환
    function syncLocaleToggle() {
      localeToggle.textContent = locale === 'KR' ? '데모: 🇰🇷 한국' : '데모: 🌐 해외';
    }
    localeToggle.addEventListener('click', () => {
      locale = locale === 'KR' ? 'INTL' : 'KR';
      syncLocaleToggle();
      renderSocials();
      applyLocale();
    });

    renderSocials();
    syncLocaleToggle();
    applyLocale();

    // 약관 뒤로가기
    termsBack.addEventListener('click', () => {
      termsScreen.classList.remove('active');
    });

    // 동의 버튼 → 닫기 (실제 구현 시 다음 단계로 이동)
    btnAgree.addEventListener('click', () => {
      termsScreen.classList.remove('active');
    });

    // 전체 동의하기 토글
    agreeAllRow.addEventListener('click', () => {
      const allChecked = itemChecks.every(c => c.classList.contains('checked'));
      itemChecks.forEach(c => c.classList.toggle('checked', !allChecked));
      syncAllCheck();
    });

    // 개별 항목 토글
    document.querySelectorAll('.term-row').forEach((row, i) => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('.term-chevron')) return;
        itemChecks[i].classList.toggle('checked');
        syncAllCheck();
      });
    });

    function syncAllCheck() {
      const allChecked = itemChecks.every(c => c.classList.contains('checked'));
      checks[0].classList.toggle('checked', allChecked);
      btnAgree.disabled = !allChecked;
    }
  </script>
<script>document.addEventListener('click',function(e){var t=e.target.closest('.btn-social,.btn-icon,.btn-login,.btn-next,.btn-signup,.btn-agree');if(t){e.preventDefault();e.stopImmediatePropagation();location.href='profile-edit.html';}},true);</script>
</body>
</html>
