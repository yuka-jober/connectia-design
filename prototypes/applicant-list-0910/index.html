<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신청자 리스트 — 26년 청춘건배</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-base);
    background: var(--color-scrim);
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  /* 이벤트 페이지 위에 뜨는 모달이라는 걸 보이려고 깔아 둔 배경 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: var(--color-banner-gradient);
  }
  i[data-lucide] { display: inline-flex; flex-shrink: 0; }
  svg.lucide { flex-shrink: 0; }

  /* ============================================
     모달 — PC는 넓게, 모바일은 화면 전체
     ============================================ */
  .modal {
    width: 100%;
    max-width: 1280px;
    height: 90vh;
    background: var(--color-surface);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-4);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  @media (max-width: 767px) {
    body { padding: 0; }
    .modal { max-width: none; height: 100dvh; border-radius: 0; }
  }

  /* ── 헤더 — 두 줄만 고정 ── */
  .head {
    flex-shrink: 0;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }
  .head-top {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 20px 12px;
  }
  .head-title {
    font-size: var(--fs-title); font-weight: var(--fw-bold);
    letter-spacing: var(--ls-title); color: var(--color-text);
    margin-right: auto;
  }
  /* 보기 전환 — 늘 보이는 스위치 탭 */
  .view-seg {
    display: flex; gap: 4px;
    padding: 4px;
    background: var(--color-surface-sub);
    border-radius: var(--r-full);
  }
  .view-seg-btn {
    padding: 8px 16px;
    border: none; border-radius: var(--r-full);
    background: transparent;
    font-family: var(--font-base);
    font-size: var(--fs-label); font-weight: var(--fw-medium);
    color: var(--color-text-muted);
    cursor: pointer; white-space: nowrap;
    transition: background var(--motion-fast) var(--ease-standard),
                color var(--motion-fast) var(--ease-standard);
  }
  .view-seg-btn:hover { color: var(--color-text-sub); }
  .view-seg-btn.is-active {
    background: var(--color-surface);
    color: var(--color-text);
    font-weight: var(--fw-bold);
    box-shadow: var(--shadow-1);
  }

  .head-tools { display: flex; align-items: center; gap: 4px; }
  .head-tools .icon-btn i[data-lucide],
  .head-tools .icon-btn svg.lucide { width: 18px; height: 18px; }
  @media (max-width: 767px) {
    .head-title { display: none; }
    .view-seg { margin-right: auto; }
  }

  .head-filters {
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px 12px;
  }
  .type-tabs { display: flex; gap: 4px; flex-shrink: 0; }
  .type-tab {
    padding: 8px 12px;
    background: none; border: none;
    border-bottom: 2px solid transparent;
    font-family: var(--font-base);
    font-size: var(--fs-body); font-weight: var(--fw-medium);
    color: var(--color-text-muted);
    cursor: pointer; white-space: nowrap;
  }
  .type-tab.is-active {
    color: var(--color-text); font-weight: var(--fw-bold);
    border-bottom-color: var(--color-text);
  }
  .head-count {
    margin-left: auto; flex-shrink: 0;
    font-size: var(--fs-label); color: var(--color-text-sub);
  }
  .head-count strong { color: var(--color-text); font-weight: var(--fw-bold); }

  /* 자리 현황 — PC는 헤더 안 한 줄, 모바일은 목록과 함께 스크롤 */
  .slots {
    display: flex; gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .slots::-webkit-scrollbar { display: none; }
  .slot {
    display: flex; align-items: baseline; gap: 8px;
    flex-shrink: 0;
    padding: 8px 16px;
    background: var(--color-surface-sub);
    border-radius: var(--r-full);
    font-size: var(--fs-label); font-weight: var(--fw-medium);
    color: var(--color-text);
    white-space: nowrap;
  }
  .slot-left {
    font-size: var(--fs-caption); color: var(--color-text-muted);
    font-variant-numeric: tabular-nums;
  }
  .slot.is-full .slot-left { color: var(--color-destructive); font-weight: var(--fw-bold); }

  /* ── 본문 ── */
  .body {
    flex: 1; overflow-y: auto;
    background: var(--color-bg);
  }
  .slots-mobile { display: none; }
  @media (max-width: 767px) {
    .head-slots { display: none; }
    .slots-mobile {
      display: flex;
      padding: 12px 16px;
      background: var(--color-bg);
    }
  }

  /* ── 목록 — 한 줄에 한 신청 ── */
  .rows { display: flex; flex-direction: column; }
  .row {
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }
  .row-main {
    display: grid;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    cursor: pointer;
    /* 선택 · 이름 · 유형 · 자리 · 상태 · 액션 · 신청일
       이름만 남는 폭을 먹고 나머지는 고정이라 줄마다 열이 어긋나지 않는다 */
    grid-template-columns: 24px minmax(120px, 1fr) 72px 168px 76px 104px 128px;
  }
  .row-main:hover { background: var(--color-surface-sub); }
  .row.is-open .row-main { background: var(--color-surface-sub); }

  .row-name {
    display: flex; align-items: baseline; gap: 8px; min-width: 0;
    font-size: var(--fs-body-lg); font-weight: var(--fw-bold);
    color: var(--color-text); letter-spacing: var(--ls-body-lg);
  }
  .row-count { font-size: var(--fs-caption); color: var(--color-text-muted); font-weight: var(--fw-regular); }
  .row-meta { font-size: var(--fs-label); color: var(--color-text-sub); }
  .row-date {
    font-size: var(--fs-caption); color: var(--color-text-muted);
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .row-actions { display: flex; gap: 4px; }
  .row-slot { white-space: nowrap; }

  /* 모바일 — 같은 줄을 두 층으로 접는다 */
  @media (max-width: 767px) {
    .row-main {
      grid-template-columns: 24px 1fr auto;
      grid-template-areas:
        "check name   status"
        ".     meta   meta"
        ".     action action";
      row-gap: 8px;
      padding: 16px;
    }
    .row-check  { grid-area: check; }
    .row-name   { grid-area: name; }
    .row-status { grid-area: status; justify-self: end; }
    .row-type, .row-slot { display: none; }
    .row-meta-m { grid-area: meta; }
    .row-actions { grid-area: action; }
    .row-date { display: none; }
  }
  .row-meta-m { display: none; }
  @media (max-width: 767px) {
    .row-meta-m {
      display: flex; gap: 8px;
      font-size: var(--fs-label); color: var(--color-text-sub);
    }
  }

  /* ── 상세 — 라벨을 값 위에, PC는 두 열 ── */
  .detail {
    display: grid; gap: 32px;
    padding: 20px;
    background: var(--color-surface);
    border-top: 1px solid var(--color-border);
  }
  /* 팀이면 왼쪽은 신청 정보, 오른쪽은 사람. 개인이면 한 열로 둔다 */
  @media (min-width: 768px) {
    .detail.has-members { grid-template-columns: 1fr 1fr; }
  }
  .detail[hidden] { display: none; }
  .detail-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .detail-head {
    font-size: var(--fs-caption); font-weight: var(--fw-bold);
    color: var(--color-text-muted);
  }
  .fields { display: grid; gap: 12px; }
  @media (max-width: 767px) {
    .detail { padding: 16px; gap: 24px; }
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.is-inline {
    flex-direction: row; align-items: baseline; gap: 12px;
  }
  /* (대표자) 학과처럼 8자짜리 라벨도 넘치지 않을 만큼 */
  .field.is-inline .field-label { flex: 0 0 88px; }
  .field-label {
    font-size: var(--fs-caption); font-weight: var(--fw-medium);
    color: var(--color-text-muted); line-height: var(--lh-caption);
  }
  .field-value {
    font-size: var(--fs-label); color: var(--color-text);
    line-height: 1.6; word-break: break-word;
    max-width: 88ch;
  }
  .field-value.is-empty { color: var(--color-text-muted); }
  /* 객관식은 고른 보기라 값이 아니라 하나의 선택으로 읽혀야 한다 */
  .field-chip {
    align-self: flex-start;
    padding: 4px 12px;
    border-radius: var(--r-full);
    background: var(--color-primary-light);
    font-size: var(--fs-caption); font-weight: var(--fw-regular);
    line-height: var(--lh-caption);
    color: var(--color-text);
  }

  /* 세로로 쌓으면 인원이 홀수든 항목 수가 다르든 어긋나지 않는다 */
  .members { display: flex; flex-direction: column; gap: 12px; }
  .member {
    background: var(--color-bg);
    border-radius: var(--r-md);
    padding: 16px;
  }
  .member-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .member-name { font-size: var(--fs-body); font-weight: var(--fw-bold); color: var(--color-text); }
  .member .fields { grid-template-columns: 1fr; gap: 12px; }

  /* ── 하단 일괄 처리 바 ── */
  .bulk {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    background: var(--color-surface);
    border-top: 1px solid var(--color-border);
  }
  .bulk[hidden] { display: none; }
  .bulk-all {
    margin-right: auto;
    display: flex; align-items: center; gap: 8px;
    background: none; border: none; padding: 4px 0;
    font-family: var(--font-base);
    font-size: var(--fs-label); font-weight: var(--fw-medium);
    color: var(--color-text-sub);
    cursor: pointer;
  }

  /* ── 받고 있는 정보 · 메뉴 ── */
  .pop-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: var(--color-scrim);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .pop-overlay[hidden] { display: none; }
  .pop {
    width: 100%; max-width: 520px;
    background: var(--color-surface);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-4);
    padding: 24px;
  }
  .pop-title {
    display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    font-size: var(--fs-heading); font-weight: var(--fw-bold);
    color: var(--color-text);
  }
  .pop-title .icon-btn { margin-left: auto; }
  .pop-list { display: grid; gap: 12px; }
  .pop-group {
    display: flex; flex-direction: column; gap: 4px;
  }
  .pop-group-name {
    font-size: var(--fs-caption); font-weight: var(--fw-bold);
    color: var(--color-primary);
  }
  .pop-group-items {
    font-size: var(--fs-label); color: var(--color-text-sub); line-height: 1.7;
  }

  .menu-wrap { position: relative; }
  .menu-wrap .menu {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 50;
    min-width: 180px;
  }
  .menu-wrap .menu[hidden] { display: none; }

  .toast-container { position: fixed; bottom: 32px; z-index: 200; }
</style>
</head>
<body>

<div class="modal">

  <!-- ── 헤더 : 두 줄 ── -->
  <div class="head">
    <div class="head-top">
      <span class="head-title">신청자 리스트</span>
      <div class="view-seg" id="view-seg" role="group" aria-label="보기 전환">
        <button type="button" class="view-seg-btn is-active" data-view="admin" onclick="pickView('admin')">관리자 보기</button>
        <button type="button" class="view-seg-btn" data-view="user" onclick="pickView('user')">사용자 보기</button>
      </div>

      <div class="head-tools">
        <button class="icon-btn icon-btn-sm icon-btn-clear" type="button" aria-label="받고 있는 정보" onclick="openFields()">
          <i data-lucide="info"></i>
        </button>
        <div class="menu-wrap">
          <button class="icon-btn icon-btn-sm icon-btn-clear" type="button" aria-label="더보기" onclick="toggleMenu()">
            <i data-lucide="more-horizontal"></i>
          </button>
          <div class="menu" id="head-menu" hidden>
            <button type="button" class="menu-item" onclick="pickExport()">엑셀 다운로드</button>
          </div>
        </div>
        <button class="icon-btn icon-btn-sm icon-btn-clear" type="button" aria-label="닫기" onclick="showToast('이벤트 페이지로 돌아가요.')">
          <i data-lucide="x"></i>
        </button>
      </div>
    </div>

    <div class="head-filters">
      <div class="type-tabs" id="type-tabs"></div>
      <div class="slots head-slots" id="head-slots"></div>
      <span class="head-count">총 <strong id="count-total">0</strong>명</span>
    </div>
  </div>

  <!-- ── 본문 ── -->
  <div class="body">
    <div class="slots slots-mobile" id="mobile-slots"></div>
    <div class="rows" id="rows"></div>
  </div>

  <!-- ── 고른 게 있을 때만 뜨는 처리 바 ── -->
  <div class="bulk" id="bulk" hidden>
    <button type="button" class="bulk-all" onclick="toggleAll()">
      <i data-lucide="check-square" style="width:16px;height:16px"></i>
      <span id="bulk-all-text">전체 선택</span>
    </button>
    <button type="button" class="btn btn-sm btn-weak-dark" onclick="bulkAct('reject')">거절</button>
    <button type="button" class="btn btn-sm btn-fill-primary" id="bulk-approve" onclick="bulkAct('approve')">승인</button>
  </div>
</div>

<!-- 받고 있는 정보 — 한 번 확인하는 내용이라 버튼 안에 넣었다 -->
<div class="pop-overlay" id="fields-pop" hidden onclick="closeFields()">
  <div class="pop" onclick="event.stopPropagation()">
    <div class="pop-title">
      받고 있는 정보
      <button class="icon-btn icon-btn-sm icon-btn-clear" type="button" aria-label="닫기" onclick="closeFields()">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="pop-list" id="fields-list"></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="https://unpkg.com/lucide@latest"></script>

var STATUS = {
  review:   { label: '승인 대기', cls: 'badge-weak-warning' },
  approved: { label: '승인',      cls: 'badge-weak-success' },
  rejected: { label: '거절',      cls: 'badge-weak-neutral' }
};

/* ════════════════════════════════════════════
   상태
   ════════════════════════════════════════════ */

var filter = 'all';
var picked = {};
var open = {};

function headcount(a) { return a.members ? a.members.length : 1; }

function shown() {
  return filter === 'all' ? APPLICANTS : APPLICANTS.filter(function(a){ return a.type === filter; });
}
function typeName(id) {
  var t = TYPES.filter(function(x){ return x.id === id; })[0];
  return t ? t.name : '';
}
function slotName(id) {
  var s = SLOTS.filter(function(x){ return x.id === id; })[0];
  return s ? s.name : '미배정';
}
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* ════════════════════════════════════════════
   렌더
   ════════════════════════════════════════════ */

function renderTabs() {
  document.getElementById('type-tabs').innerHTML = TYPES.map(function(t){
    return '<button type="button" class="type-tab' + (filter === t.id ? ' is-active' : '') + '" '
      + 'onclick="setFilter(\'' + t.id + '\')">' + esc(t.name) + '</button>';
  }).join('');
}

function renderSlots() {
  var html = SLOTS.map(function(s){
    var full = s.used >= s.cap;
    return '<span class="slot' + (full ? ' is-full' : '') + '">'
      + esc(s.name)
      + '<span class="slot-left">' + s.used + '/' + s.cap + '</span>'
      + '</span>';
  }).join('');
  document.getElementById('head-slots').innerHTML = html;
  document.getElementById('mobile-slots').innerHTML = html;
}

/* 라벨이 짧을 때만 값을 옆에 둔다. 긴 질문을 옆에 두면 라벨이 여러 줄로 접힌다 */
function fieldHTML(f) {
  var v = String(f[1] || '').trim();
  var inline = f[2] !== 'choice' && f[0].length <= 8;
  var body = (f[2] === 'choice' && v)
    ? '<span class="field-chip">' + esc(v) + '</span>'
    : '<span class="field-value' + (v ? '' : ' is-empty') + '">' + esc(v || '—') + '</span>';
  return '<div class="field' + (inline ? ' is-inline' : '') + '">'
    + '<span class="field-label">' + esc(f[0]) + '</span>'
    + body
    + '</div>';
}

function renderRows() {
  var rows = shown();
  document.getElementById('count-total').textContent = rows.reduce(function(n, a){
    return n + headcount(a);
  }, 0);

  document.getElementById('rows').innerHTML = rows.map(function(a){
    var st = STATUS[a.status];
    var isOpen = !!open[a.id];

    var detail = '';
    if (isOpen) {
      detail = '<div class="detail' + (a.members ? ' has-members' : '') + '">'
        + '<div class="detail-col">'
        +   '<span class="detail-head">신청 정보</span>'
        +   '<div class="fields">' + (a.fields || []).map(fieldHTML).join('') + '</div>'
        + '</div>'
        + (a.members
            ? '<div class="detail-col">'
              + '<span class="detail-head">팀원 ' + a.members.length + '명</span>'
              + '<div class="members">' + a.members.map(function(m){
                  return '<div class="member">'
                    + '<div class="member-top">'
                    +   '<span class="member-name">' + esc(m.name) + '</span>'
                    +   (m.lead ? '<span class="badge badge-sm badge-weak-primary">대표자</span>' : '')
                    + '</div>'
                    + '<div class="fields">' + (m.fields || []).map(fieldHTML).join('') + '</div>'
                    + '</div>';
                }).join('') + '</div>'
              + '</div>'
            : '')
        + '</div>';
    }

    return '<div class="row' + (isOpen ? ' is-open' : '') + '">'
      + '<div class="row-main" onclick="toggleOpen(\'' + a.id + '\')">'
      +   '<input type="checkbox" class="checkbox row-check" aria-label="' + esc(a.name) + ' 선택" '
      +     (picked[a.id] ? 'checked ' : '') + 'onclick="event.stopPropagation()" onchange="pick(\'' + a.id + '\')">'
      +   '<span class="row-name">' + esc(a.name)
      +     (a.members ? '<span class="row-count">' + a.members.length + '명</span>' : '') + '</span>'
      +   '<span class="row-meta row-type">' + esc(typeName(a.type)) + '</span>'
      +   '<span class="row-meta row-slot">' + esc(slotName(a.slot)) + '</span>'
      +   '<span class="row-status"><span class="badge badge-sm ' + st.cls + '">' + st.label + '</span></span>'
      +   '<span class="row-meta-m">' + esc(typeName(a.type)) + ' · ' + esc(slotName(a.slot)) + '</span>'
      +   '<span class="row-actions">'
      +     (a.status !== 'approved'
            ? '<button type="button" class="btn btn-xs btn-weak-primary" onclick="event.stopPropagation();act(\'' + a.id + '\',\'approve\')">승인</button>' : '')
      +     (a.status !== 'rejected'
            ? '<button type="button" class="btn btn-xs btn-weak-dark" onclick="event.stopPropagation();act(\'' + a.id + '\',\'reject\')">거절</button>' : '')
      +   '</span>'
      +   '<span class="row-date">' + esc(a.date) + '</span>'
      + '</div>'
      + detail
      + '</div>';
  }).join('');

  syncBulk();
  if (window.lucide) lucide.createIcons();
}

function renderFields() {
  document.getElementById('fields-list').innerHTML = FIELD_GROUPS.map(function(g){
    return '<div class="pop-group">'
      + '<span class="pop-group-name">' + esc(g.name) + '</span>'
      + '<span class="pop-group-items">' + g.items.map(esc).join(' · ') + '</span>'
      + '</div>';
  }).join('');
}

/* ════════════════════════════════════════════
   동작
   ════════════════════════════════════════════ */

function setFilter(id) { filter = id; renderTabs(); renderRows(); }
function toggleOpen(id) { open[id] = !open[id]; renderRows(); }

function pick(id) {
  if (picked[id]) delete picked[id]; else picked[id] = true;
  syncBulk();
}

function pickedIds() { return Object.keys(picked); }

function toggleAll() {
  var rows = shown();
  var all = rows.every(function(a){ return picked[a.id]; });
  picked = {};
  if (!all) rows.forEach(function(a){ picked[a.id] = true; });
  renderRows();
}

function syncBulk() {
  var n = pickedIds().length;
  var bar = document.getElementById('bulk');
  bar.hidden = n === 0;
  document.getElementById('bulk-approve').textContent = n ? n + '건 승인' : '승인';
  var rows = shown();
  document.getElementById('bulk-all-text').textContent =
    (rows.length && rows.every(function(a){ return picked[a.id]; })) ? '전체 해제' : '전체 선택';
}

function act(id, how) {
  var a = APPLICANTS.filter(function(x){ return x.id === id; })[0];
  if (!a) return;
  a.status = how === 'approve' ? 'approved' : 'rejected';
  renderRows();
  showToast(a.name + (how === 'approve' ? ' 승인했어요.' : ' 거절했어요.'));
}

function bulkAct(how) {
  var ids = pickedIds();
  if (!ids.length) return;
  ids.forEach(function(id){
    var a = APPLICANTS.filter(function(x){ return x.id === id; })[0];
    if (a) a.status = how === 'approve' ? 'approved' : 'rejected';
  });
  picked = {};
  renderRows();
  showToast(ids.length + '건을 ' + (how === 'approve' ? '승인' : '거절') + '했어요.');
}

function openFields()  { document.getElementById('fields-pop').hidden = false; if (window.lucide) lucide.createIcons(); }
function closeFields() { document.getElementById('fields-pop').hidden = true; }

function toggleMenu() {
  var m = document.getElementById('head-menu');
  m.hidden = !m.hidden;
}
function pickView(which) {
  document.querySelectorAll('.view-seg-btn').forEach(function(b){
    b.classList.toggle('is-active', b.dataset.view === which);
  });
  showToast(which === 'admin' ? '관리자 보기예요.' : '신청자에게 보이는 화면으로 바꿨어요.');
}
function pickExport() {
  toggleMenu();
  showToast('엑셀 내보내기 시트가 열려요.');
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.menu-wrap')) document.getElementById('head-menu').hidden = true;
});

var toastTimer = null;
function showToast(msg) {
  var wrap = document.getElementById('toast-container');
  wrap.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ wrap.innerHTML = ''; }, 2400);
}

renderTabs();
renderSlots();
renderFields();
renderRows();
lucide.createIcons();
</script>
