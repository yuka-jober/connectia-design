<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아바타 관리 허브 — 통계</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }
  body {
    font-family: var(--font-base);
    background: var(--color-bg);
  }

  .frame {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: var(--color-bg);
  }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--color-bg); }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  [data-lucide] { display: inline-flex; flex-shrink: 0; }

  /* ── Header ── */
  .hub-header {
    background: var(--color-surface);
    padding: 8px 8px 12px;
    flex-shrink: 0;
  }
  .hub-header-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .hub-header-title {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hub-subtitle {
    padding: 0 8px;
    margin-top: 4px;
  }

  /* ── Tabs ── */
  .hub-tabs {
    display: flex;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }
  .hub-tab {
    flex: 1;
    position: relative;
    padding: 12px 4px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font-base);
    font-size: var(--fs-label);
    font-weight: var(--fw-medium);
    color: var(--color-text-muted);
    -webkit-tap-highlight-color: transparent;
  }
  .hub-tab.is-active {
    color: var(--color-text);
    font-weight: var(--fw-bold);
  }
  .hub-tab.is-active::after {
    content: '';
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: -1px;
    height: 2px;
    border-radius: var(--r-full);
    background: var(--color-primary);
  }

  /* ── Content ── */
  .hub-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

  /* ── Period chip + menu ── */
  .period-wrap { position: relative; align-self: flex-start; }
  .period-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 8px 12px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--r-full);
    font-family: var(--font-base);
    font-size: var(--fs-label);
    font-weight: var(--fw-semibold);
    color: var(--color-text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .period-chip [data-lucide] { width: 16px; height: 16px; color: var(--color-text-muted); }
  .period-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 20;
  }
  .period-menu[hidden] { display: none; }
  .menu-check { width: 16px; height: 16px; color: var(--color-primary); opacity: 0; }
  .menu-item.is-selected .menu-check { opacity: 1; }

  /* ── Card ── */
  .card {
    background: var(--color-surface);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-1);
    overflow: hidden;
  }
  .chart-card { overflow: visible; }
  .chart-title-wrap { position: relative; display: inline-flex; align-items: center; gap: 4px; }
  .info-btn {
    display: inline-flex;
    align-items: center;
    padding: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-muted);
    -webkit-tap-highlight-color: transparent;
  }
  .info-btn[hidden] { display: none; }
  .info-btn [data-lucide] { width: 16px; height: 16px; }
  .info-tip {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 10;
    width: max-content;
    max-width: 240px;
    padding: 8px 12px;
    background: var(--color-text);
    color: var(--color-on-primary);
    border-radius: var(--r-sm);
    box-shadow: var(--shadow-2);
    font-size: var(--fs-caption);
    font-weight: var(--fw-medium);
    line-height: 1.4;
    opacity: 0;
    visibility: hidden;
    transition: opacity var(--motion-fast) var(--ease-standard);
  }
  .info-tip.is-on { opacity: 1; visibility: visible; }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px 8px;
  }
  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font-base);
    font-size: var(--fs-label);
    font-weight: var(--fw-medium);
    color: var(--color-text-muted);
    -webkit-tap-highlight-color: transparent;
  }
  .card-link [data-lucide] { width: 14px; height: 14px; }

  /* ── Chart card ── */
  .chart-wrap { padding: 8px 16px 0; position: relative; }
  .chart-svg { width: 100%; height: auto; display: block; overflow: visible; touch-action: none; }
  .chart-xaxis {
    display: flex;
    justify-content: space-between;
    padding: 8px 16px 0;
  }
  .chart-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--color-text);
    color: var(--color-on-primary);
    padding: 4px 8px;
    border-radius: var(--r-xs);
    font-family: var(--font-base);
    font-size: var(--fs-caption);
    font-weight: var(--fw-semibold);
    white-space: nowrap;
    text-align: center;
    line-height: 1.3;
    transform: translate(-50%, -140%);
    opacity: 0;
    transition: opacity var(--motion-fast) var(--ease-standard);
    z-index: 5;
  }
  .chart-tooltip.is-on { opacity: 1; }
  .chart-tooltip .tt-date { font-weight: var(--fw-medium); }

  /* ── Metrics row ── */
  .metrics {
    display: flex;
    gap: 8px;
    padding: 16px;
  }
  .metric {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px;
    background: var(--color-surface-sub);
    border-radius: var(--r-md);
  }
  .metric-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .metric-num {
    font-family: var(--font-base);
    font-size: var(--fs-title);
    font-weight: var(--fw-bold);
    letter-spacing: var(--ls-title);
    color: var(--color-text);
  }
  .metric-delta {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    font-family: var(--font-base);
    font-size: var(--fs-label);
    font-weight: var(--fw-semibold);
  }
  .metric-delta [data-lucide] { width: 12px; height: 12px; }
  .metric-delta.is-up   { color: var(--color-success); }
  .metric-delta.is-down { color: var(--color-text-muted); }

  /* ── List rows ── */
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-phone {
    font-family: var(--font-base);
    font-size: var(--fs-label);
    font-weight: var(--fw-regular);
    color: var(--color-primary);
    margin-top: 2px;
  }
  .row-time {
    font-family: var(--font-base);
    font-size: var(--fs-label);
    color: var(--color-text-muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── FAQ row ── */
  .faq-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
  }
  .row:last-of-type,
  .faq-row:last-of-type { padding-bottom: 16px; }

  /* ── Recent chat ── */
  .chat-preview {
    font-family: var(--font-base);
    font-size: var(--fs-body-lg);
    color: var(--color-text-muted);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Empty state ── */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    padding: 32px 16px;
  }
  .empty [data-lucide] { width: 28px; height: 28px; color: var(--color-border); }
  .chart-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    padding: 40px 16px;
  }
  .chart-empty [data-lucide] { width: 32px; height: 32px; color: var(--color-border); }
</style>
</head>
<body>
  <div class="frame">
    <div class="screen">
      <!-- Body -->
      <div class="scroll">
        <div class="hub-body">

          <!-- Period chip + menu -->
          <div class="period-wrap">
            <button class="period-chip" id="periodChip" aria-haspopup="true" aria-expanded="false">
              <span id="periodChipLabel">최근 7일</span>
              <i data-lucide="chevron-down"></i>
            </button>
            <div class="period-menu menu" id="periodMenu" role="menu" hidden>
              <button class="menu-item" data-period="오늘" role="menuitem">오늘<i data-lucide="check" class="menu-check"></i></button>
              <button class="menu-item is-selected" data-period="7일" role="menuitem">최근 7일<i data-lucide="check" class="menu-check"></i></button>
              <button class="menu-item" data-period="1개월" role="menuitem">최근 1개월<i data-lucide="check" class="menu-check"></i></button>
              <button class="menu-item" data-period="3개월" role="menuitem">최근 3개월<i data-lucide="check" class="menu-check"></i></button>
              <button class="menu-item" data-period="6개월" role="menuitem">최근 6개월<i data-lucide="check" class="menu-check"></i></button>
            </div>
          </div>

          <!-- Trend chart card -->
          <div class="card chart-card">
            <div class="card-head">
              <div class="chart-title-wrap">
                <span class="text-heading">방문수 추이</span>
                <button class="info-btn" id="chartInfoBtn" aria-label="설명" hidden><i data-lucide="info"></i></button>
                <span class="info-tip" id="chartInfoTip">각 점은 그 날짜까지 일주일간의 방문 추이예요</span>
              </div>
            </div>
            <div class="chart-wrap">
              <svg class="chart-svg" id="chartSvg" viewBox="0 0 300 120" preserveAspectRatio="none" role="img" aria-label="방문 추이 그래프">
                <defs>
                  <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="var(--color-primary)" stop-opacity="0.22"/>
                    <stop offset="100%" stop-color="var(--color-primary)" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                <path id="chartArea" d="" fill="url(#areaFill)"/>
                <path id="chartLine" d="" fill="none" stroke="var(--color-primary)" stroke-width="2.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
                <!-- scrub guide (hidden until drag) -->
                <line id="scrubGuide" x1="0" y1="16" x2="0" y2="112"
                      stroke="var(--color-border)" stroke-width="1" visibility="hidden"/>
                <circle id="scrubMarker" r="4" fill="var(--color-primary)"
                        stroke="var(--color-surface)" stroke-width="2" visibility="hidden"/>
                <!-- end dot + label -->
                <circle id="chartEndDot" cx="0" cy="0" r="4.5" fill="var(--color-primary)"
                        stroke="var(--color-surface)" stroke-width="2"/>
                <text id="chartEndLabel" x="0" y="0" text-anchor="end"
                      font-family="var(--font-base)" font-size="13" font-weight="700"
                      fill="var(--color-primary)"></text>
              </svg>
              <div class="chart-tooltip" id="chartTooltip"></div>
            </div>
            <div class="chart-xaxis" id="chartXaxis"></div>

            <!-- Metrics -->
            <div class="metrics" id="chartMetrics"></div>
          </div>

          <!-- 정보를 제출한 사람 -->
          <div class="card">
            <div class="card-head">
              <span class="text-heading">정보를 제출한 사람</span>
              <button class="card-link">전체 보기</button>
            </div>
            <div class="row">
              <div class="row-main">
                <div class="text-body-lg" style="font-weight:var(--fw-medium)">김지현</div>
                <div class="row-phone">010-2847-1102 · jihyun@gmail.com</div>
              </div>
              <span class="row-time">2시간 전</span>
            </div>
            <div class="row">
              <div class="row-main">
                <div class="text-body-lg" style="font-weight:var(--fw-medium)">박서준</div>
                <div class="row-phone">010-5531-8890</div>
              </div>
              <span class="row-time">어제</span>
            </div>
            <div class="row">
              <div class="row-main">
                <div class="text-body-lg" style="font-weight:var(--fw-medium)">이도윤</div>
                <div class="row-phone">010-7742-3361</div>
              </div>
              <span class="row-time">3일 전</span>
            </div>
          </div>

          <!-- 자주 묻는 질문 -->
          <div class="card">
            <div class="card-head">
              <span class="text-heading">자주 묻는 질문</span>
              <button class="card-link">전체 보기</button>
            </div>
            <div class="faq-row">
              <span class="badge badge-lg badge-weak-neutral">1건</span>
              <span class="text-body-lg">예약은 어떻게 하나요?</span>
            </div>
            <div class="faq-row">
              <span class="badge badge-lg badge-weak-neutral">1건</span>
              <span class="text-body-lg">미팅 일정은 어떻게 잡아요?</span>
            </div>
            <div class="faq-row">
              <span class="badge badge-lg badge-weak-neutral">1건</span>
              <span class="text-body-lg">회사 소개 자료 받을 수 있나요?</span>
            </div>

          <!-- 최근 대화 -->
          <div class="card">
            <div class="card-head">
              <span class="text-heading">최근 대화</span>
              <button class="card-link">전체 보기</button>
            </div>
            <div class="row">
              <div class="row-main">
                <div class="text-body-lg" style="font-weight:var(--fw-medium)">익명의 사용자</div>
                <div class="chat-preview">피부과 시술 상담을 받고 싶어요. 여드름 흉터 치료가 가능한가요?</div>
              </div>
              <span class="row-time">19시간 전</span>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
  // ── Mock data per period ──
  const nf = new Intl.NumberFormat('en-US');

  // 구간 데이터 (오늘=2026-07-23 기준, 마지막 구간이 오늘로 끝남 → 반토막 없음)
  function buildBuckets(n, days) {
    const fmt = d => (d.getMonth() + 1) + '/' + d.getDate();
    const base = new Date(2026, 6, 23);
    const pts = [];
    let start0;
    for (let k = n - 1; k >= 0; k--) {
      const end = new Date(base); end.setDate(base.getDate() - k * days);
      const start = new Date(end); start.setDate(end.getDate() - (days - 1));
      if (k === n - 1) start0 = fmt(start);
      const daily = Math.max(20, 186 - (k * days / 7) * 4 + Math.sin(k * 1.1) * 6);
      pts.push({ d: fmt(end), tip: fmt(start) + '~' + fmt(end), v: Math.round(daily * days), hx: n - k });
    }
    return { pts: pts, start: start0, n: n };
  }
  const WEEK_NOTE = '각 점은 그 날짜까지 일주일간의 방문 추이예요';
  const MONTH_NOTE = '각 점은 그 날짜까지 30일간의 방문 추이예요';
  const sumV = pts => pts.reduce((a, p) => a + p.v, 0);
  const b1 = buildBuckets(5, 7), b3 = buildBuckets(12, 7), b6 = buildBuckets(6, 30);

  const DATA = {
    '오늘': {
      label: '오늘',
      xMax: 24,
      points: [
        { d: '0시', v: 2, hx: 0 }, { d: '1시', v: 1, hx: 1 }, { d: '2시', v: 1, hx: 2 },
        { d: '3시', v: 1, hx: 3 }, { d: '4시', v: 2, hx: 4 }, { d: '5시', v: 4, hx: 5 },
        { d: '6시', v: 7, hx: 6 }, { d: '7시', v: 11, hx: 7 }, { d: '8시', v: 15, hx: 8 },
        { d: '9시', v: 19, hx: 9 }, { d: '10시', v: 22, hx: 10 }, { d: '11시', v: 24, hx: 11 },
        { d: '12시', v: 25, hx: 12 }, { d: '13시', v: 24, hx: 13 }, { d: '14시', v: 22, hx: 14 },
        { d: '15시', v: 20, hx: 15 }, { d: '16시', v: 16, hx: 16 }, { d: '17시', v: 12, hx: 17 },
        { d: '18시', v: 12, hx: 18 }
      ],
      axis: ['0시', '6시', '12시', '18시', '24시'],
      metrics: [
        { label: '방문', num: '240', delta: '9%', up: true },
        { label: '받은 대화', num: '64', delta: '4%', up: false }
      ]
    },
    '7일': {
      label: '최근 7일',
      points: [
        { d: '7/17', v: 140 }, { d: '7/18', v: 175 }, { d: '7/19', v: 168 },
        { d: '7/20', v: 120 }, { d: '7/21', v: 210 }, { d: '7/22', v: 231 },
        { d: '7/23', v: 240 }
      ],
      axis: ['7/17', '7/18', '7/19', '7/20', '7/21', '7/22', '7/23'],
      metrics: [
        { label: '방문', num: '1,284', delta: '12%', up: true },
        { label: '받은 대화', num: '512', delta: '12%', up: false }
      ]
    },
    '1개월': {
      label: '최근 1개월',
      note: WEEK_NOTE,
      xMax: b1.n,
      originStart: true,
      points: b1.pts,
      axis: [b1.start, ...b1.pts.map(p => p.d)],
      metrics: [
        { label: '방문', num: nf.format(sumV(b1.pts)), delta: '18%', up: true },
        { label: '받은 대화', num: '2,940', delta: '5%', up: false }
      ]
    },
    '3개월': {
      label: '최근 3개월',
      note: WEEK_NOTE,
      xMax: b3.n,
      originStart: true,
      points: b3.pts,
      axis: [b3.start, b3.pts[2].d, b3.pts[5].d, b3.pts[8].d, b3.pts[11].d],
      metrics: [
        { label: '방문', num: nf.format(sumV(b3.pts)), delta: '24%', up: true },
        { label: '받은 대화', num: '8,180', delta: '9%', up: true }
      ]
    },
    '6개월': {
      label: '최근 6개월',
      note: MONTH_NOTE,
      xMax: b6.n,
      originStart: true,
      points: b6.pts,
      axis: [b6.start, ...b6.pts.map(p => p.d)],
      metrics: [
        { label: '방문', num: nf.format(sumV(b6.pts)), delta: '31%', up: true },
        { label: '받은 대화', num: '15,300', delta: '7%', up: false }
      ]
    }
  };

  // ── Chart geometry (viewBox 0 0 300 120) ──
  const X_L = 8, X_R = 292, Y_TOP = 20, Y_BOT = 104, Y_BASE = 116;
  const svg = document.getElementById('chartSvg');
  const elLine = document.getElementById('chartLine');
  const elArea = document.getElementById('chartArea');
  const elEndDot = document.getElementById('chartEndDot');
  const elEndLabel = document.getElementById('chartEndLabel');
  const elGuide = document.getElementById('scrubGuide');
  const elMarker = document.getElementById('scrubMarker');
  const elTooltip = document.getElementById('chartTooltip');
  const elXaxis = document.getElementById('chartXaxis');
  const elMetrics = document.getElementById('chartMetrics');
  const infoBtn = document.getElementById('chartInfoBtn');
  const infoTip = document.getElementById('chartInfoTip');
  const wrap = svg.parentElement; // .chart-wrap

  let coords = []; // [{x, y, d, v}] in viewBox units

  function render(key) {
    const data = DATA[key];
    const pts = data.points;
    const n = pts.length;
    const vals = pts.map(p => p.v);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (max === min) max = min + 1;

    coords = pts.map((p, i) => ({
      x: data.xMax != null
        ? X_L + (X_R - X_L) * (p.hx / data.xMax)
        : X_L + (X_R - X_L) * (i / (n - 1)),
      y: Y_BOT - (p.v - min) / (max - min) * (Y_BOT - Y_TOP),
      d: p.d,
      tip: p.tip,
      v: p.v
    }));

    const first = coords[0], last = coords[n - 1];
    // originStart: 선을 왼쪽 끝 바닥(구간 시작점, 점·값 없음)에서부터 이음
    const lineVerts = data.originStart ? [{ x: X_L, y: Y_BASE }].concat(coords) : coords;
    const linePath = lineVerts.map((c, i) => (i ? 'L' : 'M') + c.x.toFixed(2) + ' ' + c.y.toFixed(2)).join(' ');
    elLine.setAttribute('d', linePath);
    const leftX = data.originStart ? X_L : first.x;
    elArea.setAttribute('d', linePath + ' L' + last.x.toFixed(2) + ' ' + Y_BASE + ' L' + leftX.toFixed(2) + ' ' + Y_BASE + ' Z');

    elEndDot.setAttribute('cx', last.x);
    elEndDot.setAttribute('cy', last.y);
    elEndLabel.setAttribute('x', last.x);
    elEndLabel.setAttribute('y', Math.max(last.y - 10, 10));
    elEndLabel.textContent = nf.format(last.v);

    // x-axis labels
    elXaxis.innerHTML = data.axis.map(a => '<span class="text-caption">' + a + '</span>').join('');

    // metrics
    elMetrics.innerHTML = data.metrics.map(m =>
      '<div class="metric">' +
        '<span class="text-caption">' + m.label + '</span>' +
        '<div class="metric-row">' +
          '<span class="metric-num">' + m.num + '</span>' +
          '<span class="metric-delta ' + (m.up ? 'is-up' : 'is-down') + '">' +
            '<i data-lucide="' + (m.up ? 'arrow-up' : 'arrow-down') + '"></i>' + m.delta +
          '</span>' +
        '</div>' +
      '</div>'
    ).join('');
    lucide.createIcons();

    if (data.note) {
      infoBtn.hidden = false;
      infoTip.textContent = data.note;
    } else {
      infoBtn.hidden = true;
      infoTip.classList.remove('is-on');
    }

    hideScrub();
  }

  // ── Scrub interaction (Pointer Events: touch + mouse) ──
  function showScrub(clientX) {
    if (!coords.length) return;
    const rect = svg.getBoundingClientRect();
    const vx = (clientX - rect.left) / rect.width * 300;
    let idx = 0, best = Infinity;
    coords.forEach((c, i) => {
      const dd = Math.abs(c.x - vx);
      if (dd < best) { best = dd; idx = i; }
    });
    const c = coords[idx];
    elGuide.setAttribute('x1', c.x);
    elGuide.setAttribute('x2', c.x);
    elGuide.setAttribute('visibility', 'visible');
    elMarker.setAttribute('cx', c.x);
    elMarker.setAttribute('cy', c.y);
    elMarker.setAttribute('visibility', 'visible');

    const wrapRect = wrap.getBoundingClientRect();
    elTooltip.innerHTML = '<span class="tt-date">' + (c.tip || c.d) + '</span> · ' + nf.format(c.v);
    elTooltip.classList.add('is-on');
    const half = elTooltip.offsetWidth / 2;
    let px = (rect.left - wrapRect.left) + (c.x / 300) * rect.width;
    px = Math.max(half + 2, Math.min(px, wrapRect.width - half - 2));
    const py = (rect.top - wrapRect.top) + (c.y / 120) * rect.height;
    elTooltip.style.left = px + 'px';
    elTooltip.style.top = py + 'px';
  }
  function hideScrub() {
    elGuide.setAttribute('visibility', 'hidden');
    elMarker.setAttribute('visibility', 'hidden');
    elTooltip.classList.remove('is-on');
  }

  let scrubbing = false;
  svg.addEventListener('pointerdown', e => {
    scrubbing = true;
    svg.setPointerCapture(e.pointerId);
    showScrub(e.clientX);
    e.preventDefault();
  });
  svg.addEventListener('pointermove', e => {
    if (!scrubbing) return;
    showScrub(e.clientX);
    e.preventDefault();
  });
  const endScrub = () => { scrubbing = false; hideScrub(); };
  svg.addEventListener('pointerup', endScrub);
  svg.addEventListener('pointercancel', endScrub);
  svg.addEventListener('pointerleave', () => { if (scrubbing) endScrub(); });

  // ── Period menu ──
  const chip = document.getElementById('periodChip');
  const chipLabel = document.getElementById('periodChipLabel');
  const menu = document.getElementById('periodMenu');

  function openMenu(open) {
    menu.hidden = !open;
    chip.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  chip.addEventListener('click', e => {
    e.stopPropagation();
    openMenu(menu.hidden);
  });
  menu.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', () => {
      const key = item.dataset.period;
      menu.querySelectorAll('.menu-item').forEach(x => x.classList.toggle('is-selected', x === item));
      chipLabel.textContent = DATA[key].label;
      render(key);
      openMenu(false);
    });
  });
  infoBtn.addEventListener('click', e => {
    e.stopPropagation();
    infoTip.classList.toggle('is-on');
  });
  document.addEventListener('click', () => { openMenu(false); infoTip.classList.remove('is-on'); });

  // ── Init ──
  render('7일');
  lucide.createIcons();
  </script>
</body>
</html>
