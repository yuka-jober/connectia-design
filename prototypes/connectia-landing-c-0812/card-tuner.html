<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Tuner — Section 02 Blocks</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0E1420; color: #E7ECF2; }
  .app { display: flex; gap: 24px; align-items: flex-start; padding: 24px; }
  @media (max-width: 900px) { .app { flex-direction: column; align-items: center; } }

  /* Stage — mirrors the landing section exactly */
  .stage-wrap { position: sticky; top: 24px; flex: 0 0 auto; }
  .panel { width: 420px; max-width: 92vw; border-radius: 34px; padding: 34px 22px; background: #0FA895; display: flex; justify-content: center; }
  .frame { position: relative; width: 340px; }
  .frame img { position: absolute; display: block; border-radius: 16px; cursor: grab; touch-action: none; user-select: none; -webkit-user-drag: none; }
  .frame img.dragging { cursor: grabbing; }
  .frame img.sel { outline: 2px solid #34E3C8; outline-offset: 2px; border-radius: 12px; }
  .hint { margin: 12px 2px 0; font-size: 12.5px; color: #8FA1B6; text-align: center; }

  /* Controls */
  .controls { flex: 1; min-width: 320px; max-width: 560px; width: 100%; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  .sub { margin: 0 0 18px; font-size: 13px; color: #8FA1B6; }
  .card-ctl { border: 1px solid #24314400; background: #161F2E; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .card-ctl.active { box-shadow: 0 0 0 1.5px #34E3C8 inset; }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card-head b { font-size: 14px; }
  .card-head .front { font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid #33445C; background: transparent; color: #B9C6D6; cursor: pointer; }
  .card-head .front:hover { background: #22314A; }
  .row { display: grid; grid-template-columns: 58px 1fr 62px; align-items: center; gap: 10px; margin: 6px 0; }
  .row label { font-size: 12px; color: #93A2B6; }
  .row input[type=range] { width: 100%; accent-color: #0FA895; }
  .row input[type=number] { width: 100%; background: #0E1725; border: 1px solid #2A3A50; color: #E7ECF2; border-radius: 7px; padding: 5px 7px; font-size: 12px; }
  .toolbar { display: flex; gap: 8px; margin: 14px 0 10px; flex-wrap: wrap; }
  .toolbar button { font-size: 12.5px; padding: 8px 14px; border-radius: 8px; border: 1px solid #33445C; background: #1B2740; color: #E7ECF2; cursor: pointer; }
  .toolbar button.primary { background: #0FA895; border-color: #0FA895; color: #04211D; font-weight: 700; }
  .toolbar button:hover { filter: brightness(1.08); }
  .globals { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #93A2B6; margin-bottom: 12px; }
  .globals input[type=range] { flex: 1; accent-color: #0FA895; }
  textarea { width: 100%; height: 200px; background: #0A111C; border: 1px solid #24344B; color: #A8E6DC; border-radius: 10px; padding: 12px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap">
    <div class="panel"><div class="frame" id="frame"></div></div>
    <div class="hint">카드를 드래그해 위치 이동 · 클릭하면 선택 · 슬라이더로 미세조정</div>
  </div>

  <div class="controls">
    <h1>Card Tuner — 02 Blocks</h1>
    <p class="sub">각 카드의 위치(Left/Top)·회전·크기를 조정하세요. 아래 코드를 복사해 붙여넣으면 됩니다.</p>

    <div class="globals">
      <span>패널 높이</span>
      <input type="range" id="gHeight" min="360" max="820" step="2">
      <span id="gHeightVal" style="width:56px;text-align:right"></span>
    </div>

    <div id="ctls"></div>

    <div class="toolbar">
      <button class="primary" id="copyBtn">CSS 복사</button>
      <button id="resetBtn">처음값으로 리셋</button>
    </div>
    <textarea id="out" readonly onclick="this.select()"></textarea>
  </div>
</div>

<script>
  const DEFAULTS = [
    { key:'gallery', file:'studiogloss-card-gallery.png', name:'Gallery', left:0,  top:0,   rot:-4, w:66, sh:'0 18px 32px rgba(0,0,0,.26)' },
    { key:'review',  file:'studiogloss-card-review.png',  name:'Reviews', left:34, top:66,  rot:4,  w:66, sh:'0 18px 32px rgba(0,0,0,.26)' },
    { key:'event',   file:'studiogloss-card-event.png',   name:'Events',  left:-1, top:212, rot:-3, w:66, sh:'0 18px 32px rgba(0,0,0,.26)' },
    { key:'board',   file:'studiogloss-card-board.png',   name:'Board',   left:35, top:300, rot:4,  w:66, sh:'0 18px 32px rgba(0,0,0,.26)' },
    { key:'social',  file:'studiogloss-card-social.png',  name:'Socials', left:1,  top:432, rot:-3, w:66, sh:'0 18px 32px rgba(0,0,0,.26)' },
    { key:'link',    file:'studiogloss-card-link.png',    name:'Links',   left:33, top:452, rot:3,  w:66, sh:'0 20px 34px rgba(0,0,0,.28)' },
  ];
  const FRAME_W = 340;
  let cards, order, height, sel = null;

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function init(){
    cards = clone(DEFAULTS);
    order = cards.map((_, i) => i);   // back -> front
    height = 590;
    sel = null;
    document.getElementById('gHeight').value = height;
    buildControls();
    render();
  }

  const frame = document.getElementById('frame');
  const imgs = [];
  function render(){
    frame.style.height = height + 'px';
    frame.innerHTML = '';
    imgs.length = 0;
    cards.forEach((c, i) => {
      const im = document.createElement('img');
      im.src = c.file; im.alt = c.name; im.dataset.i = i;
      im.style.top = c.top + 'px';
      im.style.left = c.left + '%';
      im.style.width = c.w + '%';
      im.style.transform = 'rotate(' + c.rot + 'deg)';
      im.style.filter = 'drop-shadow(' + c.sh + ')';
      im.style.zIndex = order.indexOf(i) + 1;
      if (i === sel) im.classList.add('sel');
      attachDrag(im, i);
      frame.appendChild(im);
      imgs[i] = im;
    });
    document.getElementById('gHeightVal').textContent = height + 'px';
    updateOut();
    syncInputs();
  }

  function bringFront(i){
    order = order.filter(x => x !== i); order.push(i);
    render();
  }
  function select(i){ sel = i; render(); document.querySelectorAll('.card-ctl').forEach((el,k)=>el.classList.toggle('active', k===i)); }

  function attachDrag(im, i){
    im.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      select(i); bringFront(i);
      const im2 = imgs[i];
      im2.classList.add('dragging');
      im2.setPointerCapture(e.pointerId);
      const startX = e.clientX, startY = e.clientY;
      const startLeft = cards[i].left, startTop = cards[i].top;
      function move(ev){
        const dxPct = (ev.clientX - startX) / FRAME_W * 100;
        const dyPx = ev.clientY - startY;
        cards[i].left = Math.round((startLeft + dxPct) * 10) / 10;
        cards[i].top = Math.round(startTop + dyPx);
        imgs[i].style.left = cards[i].left + '%';
        imgs[i].style.top = cards[i].top + 'px';
        updateOut(); syncInputs();
      }
      function up(ev){
        im2.classList.remove('dragging');
        im2.releasePointerCapture(e.pointerId);
        im2.removeEventListener('pointermove', move);
        im2.removeEventListener('pointerup', up);
      }
      im2.addEventListener('pointermove', move);
      im2.addEventListener('pointerup', up);
    });
  }

  function buildControls(){
    const wrap = document.getElementById('ctls');
    wrap.innerHTML = '';
    cards.forEach((c, i) => {
      const box = document.createElement('div');
      box.className = 'card-ctl';
      box.innerHTML =
        '<div class="card-head"><b>' + c.name + '</b><button class="front" data-i="'+i+'">맨 앞으로</button></div>' +
        ctlRow(i,'left','Left','%',-40,100,0.5) +
        ctlRow(i,'top','Top','px',-80,760,1) +
        ctlRow(i,'rot','Rotate','°',-30,30,0.5) +
        ctlRow(i,'w','Width','%',40,90,0.5);
      box.addEventListener('mousedown', () => select(i));
      wrap.appendChild(box);
    });
    wrap.querySelectorAll('.front').forEach(b => b.addEventListener('click', (e)=>{ e.stopPropagation(); bringFront(+b.dataset.i); }));
    wrap.querySelectorAll('input').forEach(inp => inp.addEventListener('input', onInput));
  }
  function ctlRow(i, prop, label, unit, min, max, step){
    const v = cards[i][prop];
    return '<div class="row">' +
      '<label>'+label+'</label>' +
      '<input type="range" data-i="'+i+'" data-p="'+prop+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+v+'">' +
      '<input type="number" data-i="'+i+'" data-p="'+prop+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+v+'">' +
      '</div>';
  }
  function onInput(e){
    const i = +e.target.dataset.i, p = e.target.dataset.p;
    cards[i][p] = parseFloat(e.target.value);
    render();
  }
  function syncInputs(){
    document.querySelectorAll('#ctls input').forEach(inp => {
      const i = +inp.dataset.i, p = inp.dataset.p;
      if (document.activeElement !== inp) inp.value = cards[i][p];
    });
  }

  document.getElementById('gHeight').addEventListener('input', e => { height = +e.target.value; render(); });
  document.getElementById('resetBtn').addEventListener('click', init);
  document.getElementById('copyBtn').addEventListener('click', () => {
    const ta = document.getElementById('out'); ta.select();
    try { navigator.clipboard.writeText(ta.value); } catch(_) { document.execCommand('copy'); }
    const b = document.getElementById('copyBtn'); const t = b.textContent; b.textContent = '복사됨 ✓';
    setTimeout(()=> b.textContent = t, 1200);
  });

  function updateOut(){
    // emit in back->front (DOM) order so it pastes as-is
    const lines = order.map(i => {
      const c = cards[i];
      const top = Math.round(c.top);
      const left = (Math.round(c.left*10)/10);
      const rot = (Math.round(c.rot*10)/10);
      const w = (Math.round(c.w*10)/10);
      return '        <img src="'+c.file+'" alt="'+c.name+'" style="position: absolute; border-radius: 16px; top: '+top+'px; left: '+left+'%; width: '+w+'%; transform: rotate('+rot+'deg); filter: drop-shadow('+c.sh+');">';
    });
    const header = '    <!-- frame height: ' + height + 'px -->\n';
    document.getElementById('out').value = header + lines.join('\n');
  }

  init();
</script>
</body>
</html>
