<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 페이지 만들기</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  /* ============================================================
     새 페이지 만들기 — 프리셋 고르기.
     고르면 그 블록이 이미 올라간 편집 화면으로 바로 들어간다.
     미리보기가 곧 설명이라, 무엇이 들어가는지 따로 적지 않는다.
     ============================================================ */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--color-bg); font-family: var(--font-base);
    -webkit-font-smoothing: antialiased; color: var(--color-text);
  }
  button { font-family: var(--font-base); }

  .top { display: flex; align-items: center; height: 56px; padding: 0 12px; }
  .back {
    display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 8px;
    background: none; border: none; cursor: pointer;
    font-size: var(--fs-body); color: var(--color-text-sub);
  }
  .back svg { width: 18px; height: 18px; }

  .page { max-width: 920px; margin: 0 auto; padding: 0 20px 48px; }
  h1 {
    margin: 24px 0 32px; text-align: center;
    font-size: var(--fs-display); font-weight: var(--fw-bold); letter-spacing: var(--ls-display);
  }

  /* 좁은 화면에서는 가로로 밀어 본다 — 네 장을 세로로 쌓으면 비교가 안 된다 */
  .grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;
  }
  /* 좁은 화면 — 가운데 한 장이 서고 양옆이 뒤로 물러나 겹쳐 보인다 */
  @media (max-width: 860px) {
    .page { padding-left: 0; padding-right: 0; }
    h1 { padding: 0 20px; }
    .grid {
      display: flex; gap: 0; overflow-x: auto; scroll-snap-type: x mandatory;
      padding: 8px 0 16px; scrollbar-width: none;
    }
    .grid::-webkit-scrollbar { display: none; }
    /* 처음·마지막 장도 가운데 설 수 있도록 양 끝을 비워 둔다 */
    .grid::before, .grid::after { content: ''; flex: 0 0 13%; }
    .preset {
      flex: 0 0 74%; scroll-snap-align: center;
      transform: scale(0.86); opacity: 0.5; z-index: 0;
      transition: transform var(--motion-standard) var(--ease-standard),
                  opacity var(--motion-standard) var(--ease-standard);
    }
    .preset + .preset { margin-left: -5%; }
    .preset.is-center { transform: scale(1); opacity: 1; z-index: 2; }
  }

  .preset {
    display: flex; flex-direction: column; gap: 12px; padding: 12px;
    background: var(--color-surface); border: none;
    border-radius: var(--r-xl); box-shadow: var(--shadow-1);
    cursor: pointer; text-align: left;
  }
  /* 넓은 화면에서는 가리킨 한 장이 앞으로 떠오른다 — 네 장을 견주는 자리라 그 한 장만 커진다 */
  @media (min-width: 861px) {
    .preset {
      position: relative;
      transition: transform var(--motion-standard) var(--ease-standard),
                  box-shadow var(--motion-standard) var(--ease-standard);
    }
    .grid:hover .preset:not(:hover) { opacity: 0.6; }
    .preset:hover { transform: scale(1.08); box-shadow: var(--shadow-3); z-index: 2; }
  }
  .grid .preset { transition: opacity var(--motion-standard) var(--ease-standard); }
  .preset-name { text-align: center; font-size: var(--fs-body-lg); font-weight: var(--fw-semibold); color: var(--color-text); }

  /* 실제 페이지를 찍은 그림 — 위에서부터 보이는 만큼 */
  .shot {
    width: 100%; aspect-ratio: 5 / 7; overflow: hidden;
    border-radius: var(--r-md); background: var(--color-bg);
  }
  .shot img { width: 100%; display: block; }

</style>
</head>
<body>

<header class="top">
  <button class="back"><i data-lucide="chevron-left"></i>돌아가기</button>
</header>

<div class="page">
  <h1>템플릿을 선택하세요</h1>

  <div class="grid" id="grid">

    <button class="preset" data-k="card">
      <span class="shot"><img src="../../assets/presets/preset-card.jpg" alt="튼튼내과 김태현 원장"></span>
      <span class="preset-name">명함</span>
    </button>

    <button class="preset" data-k="profile">
      <span class="shot"><img src="../../assets/presets/preset-profile.jpg" alt="글로스네일"></span>
      <span class="preset-name">프로필 1</span>
    </button>

    <button class="preset" data-k="photo">
      <span class="shot"><img src="../../assets/presets/preset-photo.jpg" alt="하루요가"></span>
      <span class="preset-name">프로필 2</span>
    </button>

    <button class="preset" data-k="group">
      <span class="shot"><img src="../../assets/presets/preset-group.jpg" alt="서울시립대학교 총동문회"></span>
      <span class="preset-name">모임</span>
    </button>

  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();
  const grid = document.getElementById('grid');
  const cards = [...document.querySelectorAll('.preset')];
  const narrow = () => window.matchMedia('(max-width: 860px)').matches;

  /* 가운데 온 장이 고른 장이다 — 밀어 보는 동안 선택이 따라온다 */
  /* offsetLeft 는 위치 지정 조상에 따라 기준이 달라진다 — 화면 좌표로 잰다 */
  const midOf = el => { const r = el.getBoundingClientRect(); return r.left + r.width / 2; };
  function markCenter() {
    const mid = midOf(grid);
    let best = cards[0], bestD = Infinity;
    cards.forEach(p => {
      const d = Math.abs(midOf(p) - mid);
      if (d < bestD) { bestD = d; best = p; }
    });
    cards.forEach(p => p.classList.toggle('is-center', p === best));
  }

  let tick;
  grid.addEventListener('scroll', () => { clearTimeout(tick); tick = setTimeout(markCenter, 60); });
  window.addEventListener('resize', markCenter);

  grid.addEventListener('click', e => {
    const b = e.target.closest('.preset');
    if (!b) return;
    /* 좁은 화면에서 옆에 있던 장은 먼저 가운데로 온다 — 반쯤 가린 장이 바로 만들어지면 곤란하다 */
    if (narrow() && !b.classList.contains('is-center')) {
      grid.scrollBy({ left: midOf(b) - midOf(grid), behavior: 'smooth' });
      return;
    }
    location.href = '../profile-edit-card-1015/profile-edit-card.html#' + b.dataset.k;
  });

  markCenter();
</script>
</body>
</html>
