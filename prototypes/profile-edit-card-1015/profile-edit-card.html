      + '<button class="rail-btn" data-mv="-1"' + (i === 0 ? ' disabled' : '') + ' aria-label="위로"><i data-lucide="chevron-up"></i></button>'
      + '<span class="rail-grip" aria-label="순서 이동"><i data-lucide="grip-vertical"></i></span>'
      + '<button class="rail-btn" data-mv="1"' + (i === blocks.length - 1 ? ' disabled' : '') + ' aria-label="아래로"><i data-lucide="chevron-down"></i></button>'
      + '</div>'
      + '<div class="block-body">'
      + (b.visible ? '' : '<span class="badge badge-sm badge-weak-neutral block-tag">숨김</span>')
      + cardWrap(b)
      + '</div>';

    el.querySelector('.block-body').addEventListener('click', () => openEditor(b.id));
    el.querySelectorAll('.rail-btn').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); moveBlock(b.id, Number(btn.dataset.mv)); });
    });
    el.querySelector('.rail-grip').addEventListener('pointerdown', e => gripDown(e, b.id));
    return el;
  }

  /* 캔버스에는 값이 채워진 항목만 나온다 */
  function contactRows(b) {
    return CONTACT_FIELDS.filter(f => b[f[0]]);
  }

  /* 카드형 템플릿 — 대화하기 버튼을 뺀 모든 블록 본문이 흰 카드 안에 들어간다 */
  function cardWrap(b) {
    if (b.kind === 'chat') return blockInner(b);
    if (b.kind === 'profile') {
      const center = b.align === 'center' ? ' pf-center' : '';
      /* 동그란 사진 — 명함 면 없이 사진과 이름만 선다 */
      if (P.layout === 'avatar') {
        return '<div class="sec-card pf-avatar-card' + center + '">' + blockInner(b) + '</div>';
      }
      /* 큰 이미지 — 사진이 명함 앞면을 대신하고, 이름·직함·연락처는 아래 별도 카드로 분리된다 */
      if (P.layout === 'image' && P.hero) {
        const info = pfInfo(b);
        return '<div class="sec-card pf-card pf-photo-face' + center + '">'
          + '<div class="pf-media"><img src="' + P.hero + '" alt=""></div></div>'
          + (info ? '<div class="sec-card pf-info-card' + center + '">' + info + '</div>' : '');
      }
      return '<div class="sec-card pf-card' + center + '">' + blockInner(b) + '</div>';
    }
    return '<div class="sec-card">' + blockInner(b) + '</div>';
  }

  /* 명함 앞면 — 로고는 좌상단, 사진은 우상단 */
  function pfFace() {
    if (P.layout !== 'card' || (!P.logo && !P.photo)) return '';
    return '<div class="pf-top">'
      + (P.logo ? '<img class="pf-logo" src="' + P.logo + '" alt="">' : '<span></span>')
      + (P.photo ? '<img class="pf-photo" src="' + P.photo + '" alt="">' : '')
      + '</div>';
  }

  /* 이름·직함·연락처 */
  function pfInfo(b) {
    const nameRow = (P.name || P.role)
      ? '<div class="pf-name-row">'
        + (P.name ? '<span class="pf-name">' + esc(P.name) + '</span>' : '')
        + (P.role ? '<span class="pf-role">' + esc(P.role) + '</span>' : '')
        + '</div>'
      : '';
    const rows = contactRows(b);
    const ct = rows.length
      ? '<div class="ct-list">' + rows.map(f =>
          '<div class="ct-row"><span class="ct-k">' + f[1] + '</span>'
          + '<span class="ct-v">' + esc(b[f[0]]) + '</span></div>').join('') + '</div>'
      : '';
    return nameRow || ct ? '<div class="pf-info">' + nameRow + ct + '</div>' : '';
  }

  /* 섹션 제목 — 비우면 표시하지 않는다 */
  const secTitle = t => t ? '<div class="lp-section-title">' + esc(t) + '</div>' : '';

  function blockInner(b) {
    if (b.kind === 'chat') return chatBtn();
    if (b.kind === 'profile') {
      if (P.layout === 'avatar') {
        const info = pfInfo(b);
        return '<span class="avatar avatar-2xl pf-avatar">'
          + (P.photo ? '<img src="' + P.photo + '" alt="">' : '') + '</span>'
          + (info || '<div class="pf-info"><div class="pf-name is-empty">이름을 설정해주세요</div></div>');
      }
      const face = pfFace();
      const info = pfInfo(b);
      if (!face && !info) return '<div class="pf-info"><div class="pf-name is-empty">이름을 설정해주세요</div></div>';
      return face + info;
    }
    if (b.kind === 'sns') {
      return secTitle(b.name)
        + '<div class="sns-block">' + b.icons.map(o => snsTile(o.p)).join('') + '</div>';
    }
    if (b.kind === 'text') return secTitle(b.title)
      + '<div class="text-block"><div class="text-p">' + (b.html || '') + '</div></div>';
    if (b.kind === 'info') {
      return secTitle(b.name) + '<div class="ib-list">' + b.links.map(l =>
        '<div class="ib-card">'
        + '<span class="ib-text">'
        + '<span class="ib-title' + (l.title ? '' : ' is-ph') + '">' + esc(l.title || '제목') + '</span>'
        + '</span>'
        + '<span class="ib-chev"><i data-lucide="arrow-up-right"></i></span>'
        + '</div>').join('') + '</div>';
    }
    if (b.kind === 'gallery') {
      const title = secTitle(b.name);
      if (!b.items.length) return '<div class="lp-gallery-section">' + title + '<div class="gal-empty"><i data-lucide="image"></i></div></div>';
      const cls = b.layout === 'carousel' ? 'lp-gallery-carousel'
        : b.layout === 'stack' ? 'lp-gallery-stack' : 'lp-gallery-grid';
      return '<div class="lp-gallery-section">' + title + '<div class="' + cls + '">'
        + b.items.map(galCell).join('')
        + '</div>' + moreBtn() + '</div>';
    }
    if (isColl(b.kind)) return collInner(b);
    return '';
  }

  /* 갤러리 항목 — 이미지 · 영상 · 유튜브. 셀 마크업은 board.html 그대로이고,
     영상·유튜브는 board.html과 같이 play 아이콘을 얹는다. */
  function galMedia(it) {
    if (it.thumb) return '<img src="' + it.thumb + '" alt="">';
    if (it.type === 'video' && it.src) return '<video src="' + it.src + '" muted playsinline preload="metadata"></video>';
    if (it.type === 'image' && it.src) return '<img src="' + it.src + '" alt="">';
    return '';
  }
  function galIcon(it) {
    return it.type === 'image' ? '' : '<i data-lucide="play" class="lp-gallery-cell-icon"></i>';
  }
  function galCell(it) {
    return '<span class="lp-gallery-cell">' + galMedia(it) + galIcon(it) + '</span>';
  }

  /* 컬렉션 본문은 screens/board.html(방문자 화면)의 마크업을 그대로 쓴다.
     블록 종류마다 형태가 고정이며 편집 화면에서 형태를 고를 수 없다. */
  const moreBtn = () => '<button class="lp-more" type="button">전체보기</button>';

  function collInner(b) {
    const total = b.items.length;
    const title = secTitle(b.name);

    if (total === 0) {
      return '<div class="lp-post-section">' + title
        + '<div class="coll-empty">아직 등록된 ' + ITEM[b.kind].n + ITEM[b.kind].j + ' 없어요</div></div>';
    }

    const n = Math.min(Number(b.limit), total);
    const rows = b.items.slice(0, n);
    if (b.kind === 'event') {
      return '<div class="lp-banner-section">' + title
        + '<div class="lp-banner-scroll">' + rows.map(eventCard).join('') + '</div>' + moreBtn() + '</div>';
    }
    if (b.kind === 'board') {
      return '<div class="lp-post-section">' + title
        + '<div class="lp-post-list">' + rows.map(postRow).join('') + '</div>' + moreBtn() + '</div>';
    }
    return '<div class="lp-review-section">' + title + starRow(b)
      + '<div class="lp-review-cards">' + rows.map(reviewCard).join('') + '</div>' + moreBtn() + '</div>';
  }

  function eventCard(it) {
    const avatars = '<span class="avatar"><img src="../../assets/profile.svg" alt=""></span>'.repeat(4);
    return '<div class="lp-banner-card">'
      + '<div class="lp-banner-img">'
      + (it.n
          ? '<div class="lp-banner-applicants"><div class="lp-banner-avatars">' + avatars + '</div>'
            + '<span class="lp-banner-count"><b>' + it.n + '</b>명 신청 중</span></div>'
          : '')
      + '<img src="' + it.img + '" alt="">'
      + '</div>'
      + '<div class="lp-banner-text">'
      + '<div class="lp-banner-title">' + esc(it.t) + '</div>'
      + (it.d ? '<div class="lp-banner-date"><i data-lucide="calendar-days"></i>' + esc(it.d) + '</div>' : '')
      + '<div class="lp-banner-desc' + (it.d ? ' lp-banner-desc-1' : '') + '">' + esc(it.p) + '</div>'
      + '</div></div>';
  }

  function postRow(it) {
    return '<div class="lp-post">'
      + (it.img ? '<div class="lp-post-img"><img src="' + it.img + '" alt=""></div>' : '')
      + '<div class="lp-post-body">'
      + (it.tag
          ? '<div class="lp-post-tags"><span class="badge badge-sm ' + it.tagCls + '">' + esc(it.tag) + '</span>'
            + '<span class="lp-post-title">' + esc(it.t) + '</span></div>'
          : '<div class="lp-post-title">' + esc(it.t) + '</div>')
      + (it.d ? '<div class="lp-post-date">' + esc(it.d) + '</div>' : '')
      + '</div></div>';
  }

  function reviewCard(it) {
    const rate = it.rate || 5;
    let stars = '';
    for (let i = 1; i <= 5; i++) stars += '<i data-lucide="star"' + (i > rate ? ' class="is-off"' : '') + '></i>';
    return '<div class="lp-review-card">'
      + '<div class="lp-review-top">'
      + '<span class="lp-review-stars">' + stars + '</span>'
      + '<span class="lp-review-date">' + esc(it.d) + '</span>'
      + '</div>'
      + '<div class="lp-review-text">' + esc(it.t) + '</div>'
      + '<div class="lp-review-meta">' + esc(it.n) + '</div>'
      + '</div>';
  }

  function starRow(b) {
    const avg = b.items.reduce((s, it) => s + (it.rate || 5), 0) / b.items.length;
    let stars = '';
    for (let i = 1; i <= 5; i++) stars += '<i data-lucide="star"' + (i > Math.round(avg) ? ' class="is-off"' : '') + '></i>';
    return '<div class="lp-star-row">'
      + '<span class="lp-star-rate">' + avg.toFixed(1) + '</span>'
      + '<span class="lp-star-stars">' + stars + '</span>'
      + '<span class="lp-star-count">(' + b.items.length + ')</span></div>';
  }

  /* ============================================================
     시트 공통
     ============================================================ */
  function openLayer(id) { $(id).classList.add('on'); document.body.classList.add('sheet-open'); }
  function closeLayer(id) { $(id).classList.remove('on'); }
  function closeAllSheets() {
    ['layer-editor', 'layer-design', 'layer-catalog', 'layer-snspick', 'layer-autofill'].forEach(closeLayer);
    document.body.classList.remove('sheet-open', 'design-open');
    if (!previewMode) document.body.classList.remove('preview');
    activeId = null;
    render();
  }

  function fieldLabel(t) { return '<p class="label field-label">' + t + '</p>'; }
  /* opts 항목은 [값, 라벨] 또는 [값, 라벨, Lucide 아이콘] */
  function optRow(act, key, cur, opts, twoCol) {
    return '<div class="opt-row' + (twoCol ? ' opt-row-2' : '') + '">' + opts.map(o =>
      '<button class="opt' + (String(cur) === String(o[0]) ? ' is-active' : '') + '" data-act="' + act + '" data-k="' + key + '" data-v="' + o[0] + '">'
      + (o[2] ? '<i data-lucide="' + o[2] + '"></i>' : '') + o[1] + '</button>'
    ).join('') + '</div>';
  }
  function switchRow(label, on, key) {
    return '<div class="switch-row"><span class="switch-label">' + label + '</span>'
      + '<input type="checkbox" class="toggle toggle-sm"' + (on ? ' checked' : '') + ' data-act="togglef" data-k="' + key + '"></div>';
  }
  /* AI 학습 행 — [라벨] ......... [AI 학습 (토글)]
     label 이 있으면 항목별(라벨 우측 상단), 없으면 블록 단위(라벨 자리가 'AI 학습') */
  function aiRow(label, on, attrs) {
    return '<div class="label-row">'
      + fieldLabel(label || 'AI 학습')
      + '<span class="ai-toggle">' + (label ? '<span class="ai-toggle-label">AI 학습</span>' : '')
      + '<input type="checkbox" class="toggle toggle-sm"' + (on ? ' checked' : '') + ' ' + attrs + '></span>'
      + '</div>';
  }
  /* 블록 단위 — 상태 키는 블록 객체에 */
  const aiKeyRow  = (label, on, key) => aiRow(label, on, 'data-act="togglef" data-k="' + key + '"');
  /* 항목별 — 상태 키는 항목 객체 안의 ai */
  const aiItemRow = (label, on, arr, i) =>
    aiRow(label, on, 'data-act="togglei" data-arr="' + arr + '" data-i="' + i + '"');

  /* 업로드 행 — 현재 썸네일 + 라벨 + 변경/등록 + 셰브론, 등록돼 있으면 제거 버튼을 옆에 둔다 */
  function pickRow(act, thumbHtml, label, src, clearAct) {
    const row = '<button class="pick-row" data-act="' + act + '">' + thumbHtml
      + '<span class="pick-label">' + label + '</span>'
      + '<span class="pick-more">' + (src ? '변경' : '등록') + '</span>'
      + '<i data-lucide="chevron-right"></i></button>';
    if (!clearAct || !src) return row;
    return '<div class="pick-wrap">' + row
      + '<button class="icon-btn icon-btn-clear" data-act="' + clearAct + '" aria-label="이미지 제거">'
      + '<i data-lucide="trash-2" style="width:18px;height:18px"></i></button></div>';
  }

  /* ============================================================
     이미지 업로드 — 프로필·커버·블록 이미지 모두 기기에서 고른다
     ============================================================ */
  let fileCb = null;
  function pickFile(cb, multiple, accept) {
    fileCb = cb;
    const f = $('file-input');
    f.multiple = !!multiple;
    f.accept = accept || 'image/*';
    f.value = '';
    f.click();
  }
  $('file-input').addEventListener('change', e => {
    const list = Array.prototype.slice.call(e.target.files || []);
    if (!list.length || !fileCb) return;
    const cb = fileCb; fileCb = null;
    cb(list.map(f => ({ src: URL.createObjectURL(f), type: /^video/.test(f.type) ? 'video' : 'image' })));
  });

  /* ============================================================
     SNS 플랫폼 선택 시트
     ============================================================ */
  function openSnsPick() {
    const b = find(activeId);
    if (!b) return;
    const has = p => b.icons.some(o => o.p === p);
    $('snspick-body').innerHTML = '<div class="pick-grid">' + PLATFORMS.map(p =>
      '<button class="pick-cell pick-sns" data-p="' + esc(p) + '"' + (has(p) ? ' disabled' : '') + '>'
      + '<span class="sns-tile-ico" role="img" aria-label="' + esc(p) + '">' + (SNS_SVG[p] || '') + '</span></button>'
    ).join('') + '</div>';
    $('layer-snspick').classList.add('on');
  }
  $('snspick-body').addEventListener('click', e => {
    const el = e.target.closest('[data-p]');
    if (!el) return;
    const b = find(activeId);
    if (!b) return;
    b.icons.push({ p: el.dataset.p, id: '', ai: true });
    closeLayer('layer-snspick');
    touch(); render(); drawEditor();
  });
  $('snspick-cancel').onclick = () => closeLayer('layer-snspick');
  $('snspick-overlay').onclick = () => closeLayer('layer-snspick');

  /* ============================================================
     블록 편집 시트
     ============================================================ */
  /* 블록 삭제 — 편집 시트의 삭제 버튼과 구분선의 휴지통이 함께 쓴다 */
  function askDeleteBlock(id) {
    confirmDlg('블록을 삭제할까요?', '삭제', true, () => {
      const idx = blocks.findIndex(x => x.id === id);
      if (idx < 0) return;
      const removed = blocks[idx];
      blocks.splice(idx, 1);
      touch(); closeAllSheets();
      toast('블록을 삭제했어요', '실행 취소', () => {
        blocks.splice(idx, 0, removed);
        render();
      });
    });
  }

  function openCover() {
    if (previewMode || document.body.classList.contains('design-open')) return;
    closeLayer('layer-design');
    closeLayer('layer-catalog');
    activeId = COVER_ID;
    render();
    $('scroll').scrollTo({ top: 0 });
    openLayer('layer-editor');
    drawEditor();
  }
  $('head').addEventListener('click', e => { if (e.target.closest('[data-cover]')) openCover(); });

  function openEditor(id) {
    const b = find(id);
    if (!b || previewMode || document.body.classList.contains('design-open')) return;
    /* 대화하기 블록은 자체 편집 항목이 없다 — 디자인 시트의 대화버튼 탭으로 보낸다 */
    if (b.kind === 'chat') { designTab = 'chat'; openDesign(); return; }
    closeLayer('layer-design');
    closeLayer('layer-catalog');
    activeId = id;
    render();
    openLayer('layer-editor');
    drawEditor();
    scrollToActive();
  }

  /* 편집 시트가 덮고 남은 위쪽 영역 안에 편집 중인 블록이 들어오도록 스크롤한다.
     시트는 열릴 때 아래에서 올라오므로 위치 대신 높이로 잔여 영역을 계산한다. */
  function scrollToActive() {
    requestAnimationFrame(() => {
      const el = document.querySelector('.block.is-active');
      const sc = $('scroll');
      if (!el || !sc) return;

      const sheet = document.querySelector('#layer-editor .bottom-sheet');
      const sheetH = sheet ? sheet.getBoundingClientRect().height : 0;
      const scRect = sc.getBoundingClientRect();

      const viewTop = Math.max(scRect.top, 0);
      const viewBottom = Math.min(scRect.bottom, window.innerHeight - sheetH);
      const room = viewBottom - viewTop;
      if (room <= 0) return;

      const elRect = el.getBoundingClientRect();
      /* 블록이 잔여 영역보다 작으면 가운데, 크면 위쪽에 여유 16px 두고 정렬 */
      const offset = elRect.height < room ? (room - elRect.height) / 2 : 16;
      const target = sc.scrollTop + (elRect.top - viewTop) - offset;
      sc.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
    });
  }

  function thumbBox(src, icon, fit) {
    return '<span class="pick-thumb">' + (src ? '<img src="' + src + '" alt="" style="width:100%;height:100%;object-fit:' + (fit || 'cover') + ';border-radius:var(--r-xs)">' : '<i data-lucide="' + icon + '"></i>') + '</span>';
  }

  function drawEditor() {
    if (activeId === COVER_ID) {
      $('editor-title').textContent = '배경 사진';
      let ch = pickRow('pick-cover', thumbBox(P.cover, 'image'), '배경 사진', P.cover, 'clear-cover');
      /* 커버가 없으면 가장자리 처리는 의미가 없다 */
      if (P.cover) {
        ch += fieldLabel('가장자리') + '<div class="mock-row mock-row-2">'
          + mock('coverEdge', 'sharp', T.coverEdge, mkCoverEdge('sharp'), '기본')
          + mock('coverEdge', 'fade',  T.coverEdge, mkCoverEdge('fade'),  '페이드')
          + '</div>';
      }
      $('editor-body').innerHTML = ch;
      icons();
      return;
    }
    const b = find(activeId);
    if (!b) return;
    $('editor-title').textContent = KIND_ALL[b.kind];
    let h = '';

    if (b.kind === 'profile') {
      h += pickRow('pick-logo', thumbBox(P.logo, 'image', 'contain'), '로고', P.logo, 'clear-logo')
        + pickRow('pick-photo', thumbBox(P.photo, 'image'), '사진', P.photo, 'clear-photo')
        + pickRow('pick-hero', thumbBox(P.hero, 'image'), '대표 이미지', P.hero, 'clear-hero')
        + fieldLabel('이름') + '<input class="input" data-pin="name" value="' + esc(P.name) + '" placeholder="이름">'
        + fieldLabel('직함') + '<input class="input" data-pin="role" value="' + esc(P.role) + '" placeholder="직함">'
        + fieldLabel('정렬') + optRow('setf', 'align', b.align,
            [['left', '좌측정렬', 'align-left'], ['center', '중앙정렬', 'align-center']])
        + CONTACT_FIELDS.map(f =>
            aiKeyRow(f[1], b[f[2]], f[2])
            + '<input class="input" data-in="' + f[0] + '" value="' + esc(b[f[0]] || '') + '" placeholder="' + esc(f[1]) + '">').join('');

    } else if (b.kind === 'text') {
      const fmtBtn = (cmd, icon, label) =>
        '<button class="icon-btn icon-btn-sm icon-btn-clear" data-act="fmt" data-v="' + cmd + '" aria-label="' + label + '">'
        + '<i data-lucide="' + icon + '" style="width:16px;height:16px"></i></button>';
      h += fieldLabel('블록 제목') + '<input class="input" data-in="title" value="' + esc(b.title || '') + '" placeholder="표시 안 함">'
        + '<div class="rt">'
        + '<div class="rt-bar">'
        + fmtBtn('bold', 'bold', '굵게') + fmtBtn('italic', 'italic', '기울임')
        + fmtBtn('underline', 'underline', '밑줄') + fmtBtn('strikeThrough', 'strikethrough', '취소선')
        + '</div>'
        + '<div class="rt-body">'
        + '<div class="rt-area" id="rt-area" contenteditable="true" data-ph="내용을 입력하세요">' + (b.html || '') + '</div>'
        + '<span class="rt-count" id="char-count">' + rtLen(b.html) + '/2000</span>'
        + '</div></div>'
        + aiKeyRow('', b.ai, 'ai');

    } else if (b.kind === 'sns') {
      h += fieldLabel('블록 제목') + '<input class="input" data-in="name" value="' + esc(b.name) + '" placeholder="표시 안 함">'
        + '<div class="sns-edit-list">'
        + b.icons.map((o, i) =>
          '<div class="sns-edit-item">'
          + aiItemRow(esc(o.p), o.ai, 'icons', i)
          + '<div class="sns-edit-row">' + snsTile(o.p)
          + '<span class="id-field"><span class="id-prefix">@</span>'
          + '<input class="input" data-sns="' + i + '" value="' + esc(o.id) + '" placeholder="아이디"></span>'
          + '<button class="icon-btn icon-btn-sm icon-btn-clear" data-act="sns-del" data-v="' + i + '" aria-label="삭제">'
          + '<i data-lucide="trash-2" style="width:16px;height:16px"></i></button></div></div>').join('')
        + '</div>'
        + '<button class="sns-add" data-act="sns-add" aria-label="SNS 추가"><i data-lucide="plus"></i></button>';

    } else if (b.kind === 'info') {
      h += fieldLabel('블록 제목') + '<input class="input" data-in="name" value="' + esc(b.name) + '" placeholder="표시 안 함">'
        + fieldLabel('항목')
        + b.links.map((l, i) =>
          '<div class="kv-item">'
          + aiItemRow('링크 ' + (i + 1), l.ai, 'links', i)
          + '<div class="kv-row">'
          + '<input class="input kv-v" data-kv="' + i + '" data-f="title" value="' + esc(l.title) + '" placeholder="제목">'
          + '<button class="icon-btn icon-btn-sm icon-btn-clear" data-act="kv-del" data-v="' + i + '" aria-label="삭제">'
          + '<i data-lucide="trash-2" style="width:16px;height:16px"></i></button></div>'
          + '<input class="input" data-kv="' + i + '" data-f="url" value="' + esc(l.url) + '" placeholder="주소">'
          + '</div>').join('')
        + '<button class="btn btn-md btn-block btn-weak-primary" data-act="kv-add">항목 추가</button>';

    } else if (b.kind === 'gallery') {
      h += fieldLabel('블록 제목') + '<input class="input" data-in="name" value="' + esc(b.name) + '" placeholder="표시 안 함">'
        + fieldLabel('레이아웃') + optRow('setf', 'layout', b.layout, [['grid', '격자'], ['carousel', '가로'], ['stack', '세로']])
        + fieldLabel('사진·영상') + '<div class="thumb-manage">'
        + b.items.map((it, i) => '<div class="thumb-item">' + galMedia(it) + galIcon(it)
            + '<button class="thumb-del" data-act="gal-del" data-v="' + i + '" aria-label="삭제"><i data-lucide="x"></i></button></div>').join('')
        + '<button class="thumb-add" data-act="gal-add" aria-label="사진·영상 추가"><i data-lucide="plus"></i></button>'
        + '</div>'
        + fieldLabel('유튜브 영상 추가')
        + '<div class="kv-row"><input class="input kv-v" id="gal-yt" placeholder="유튜브 주소">'
        + '<button class="btn btn-md btn-weak-primary" data-act="yt-add">추가</button></div>';

    } else if (isColl(b.kind)) {
      h += fieldLabel('블록 제목') + '<input class="input" data-in="name" value="' + esc(b.name) + '" placeholder="표시 안 함">'
        + fieldLabel('노출 개수') + optRow('setf', 'limit', b.limit, [['3', '3개'], ['5', '5개'], ['10', '10개']]);
      /* 리뷰는 방문자가 남기는 순서대로 쌓이므로 정렬을 두지 않는다 */
      if (b.kind !== 'review') {
        h += fieldLabel('정렬') + optRow('setf', 'order', b.order, [['recent', '최신순'], ['manual', '직접 지정']]);
      }
      /* 콘텐츠 등록은 프로필 화면에서 한다. 여기서는 정렬을 '직접 지정'으로 바꿨을 때
         바로 아래에 순서 변경 진입을 붙여 흐름이 이어지게 한다. */
      if (b.order === 'manual' && b.items.length > 0) {
        h += '<button class="goto-full" data-act="full"><span>노출 순서 변경 (' + b.items.length + ')</span>'
          + '<i data-lucide="arrow-right"></i></button>';
      }
      /* 이벤트·게시판은 항목마다 따로 AI 학습을 지정하므로 블록 단위 토글을 두지 않는다.
         리뷰는 방문자가 남기는 것이라 항목별 설정이 없어 블록 단위로만 둔다. */
      if (b.kind === 'review') h += aiKeyRow('', b.ai, 'ai');
      h += '<hr class="sheet-divider">' + switchRow('프로필에 표시', b.visible, 'visible');
    }

    /* 컬렉션은 항목이 0개일 때만 삭제 허용 (데이터 유실 위험 없음) */
    const canDelete = !isColl(b.kind) || b.items.length === 0;
    if (canDelete) {
      h += '<div style="margin-top:24px"></div>'
        + '<button class="btn btn-md btn-block btn-weak-danger" data-act="del">블록 삭제</button>';
    }

    $('editor-body').innerHTML = h;
    icons();
  }

  $('editor-body').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    if (activeId === COVER_ID) {
      if (act === 'sett') { T[el.dataset.k] = el.dataset.v; touch(); render(); drawEditor(); }
      else if (act === 'pick-cover') pickFile(v => { P.cover = v[0].src; touch(); render(); drawEditor(); });
      else if (act === 'clear-cover') { P.cover = ''; touch(); render(); drawEditor(); }
      return;
    }

    const b = find(activeId);
    if (!b) return;

    if (act === 'setf') {
      b[el.dataset.k] = el.dataset.v;
      touch(); render(); drawEditor();

    } else if (act === 'togglef') {
      const k = el.dataset.k;
      b[k] = !b[k];
      touch(); render(); drawEditor();

    } else if (act === 'togglei') {
      const it = b[el.dataset.arr][Number(el.dataset.i)];
      it.ai = !it.ai;
      touch(); render(); drawEditor();

    } else if (act === 'del') {
      askDeleteBlock(b.id);

    } else if (act === 'full') {
      openFull(b.id);

    } else if (act === 'fmt') {
      fmt(el.dataset.v);

    } else if (act === 'pick-hero') {
      pickFile(v => { P.hero = v[0].src; touch(); render(); drawEditor(); });

    } else if (act === 'clear-hero') {
      P.hero = ''; touch(); render(); drawEditor();

    } else if (act === 'pick-logo') {
      pickFile(v => { P.logo = v[0].src; touch(); render(); drawEditor(); });

    } else if (act === 'clear-logo') {
      P.logo = ''; touch(); render(); drawEditor();

    } else if (act === 'pick-photo') {
      pickFile(v => { P.photo = v[0].src; touch(); render(); drawEditor(); });

    } else if (act === 'clear-photo') {
      P.photo = ''; touch(); render(); drawEditor();

    } else if (act === 'sns-add') {
      openSnsPick();

    } else if (act === 'sns-del') {
      b.icons.splice(Number(el.dataset.v), 1);
      touch(); render(); drawEditor();

    } else if (act === 'kv-add') {
      b.links.push({ title: '', url: '', ai: true });
      touch(); render(); drawEditor();

    } else if (act === 'kv-del') {
      b.links.splice(Number(el.dataset.v), 1);
      touch(); render(); drawEditor();

    } else if (act === 'gal-add') {
      pickFile(v => {
        v.forEach(f => b.items.push({ type: f.type, src: f.src, thumb: '' }));
        touch(); render(); drawEditor();
      }, true, 'image/*,video/*');

    } else if (act === 'yt-add') {
      const inp = $('gal-yt');
      const url = inp ? inp.value.trim() : '';
      if (!url) return;
      b.items.push({ type: 'youtube', src: url, thumb: '' });
      touch(); render(); drawEditor();

    } else if (act === 'gal-del') {
      b.items.splice(Number(el.dataset.v), 1);
      touch(); render(); drawEditor();
    }
  });

  $('editor-body').addEventListener('input', e => {
    const b = find(activeId);
    if (!b) return;
    /* 이름·직함은 블록이 아니라 프로필 정체성(P)을 고친다 */
    const pin = e.target.closest('[data-pin]');
    if (pin) { P[pin.dataset.pin] = pin.value; touch(); render(); return; }
    const sns = e.target.closest('[data-sns]');
    if (sns) { b.icons[Number(sns.dataset.sns)].id = sns.value; touch(); return; }
    const kv = e.target.closest('[data-kv]');
    if (kv) { b.links[Number(kv.dataset.kv)][kv.dataset.f] = kv.value; touch(); render(); return; }
    const rt = e.target.closest('.rt-area');
    if (rt) {
      b.html = rt.innerHTML;
      if ($('char-count')) $('char-count').textContent = rtLen(b.html) + '/2000';
      touch(); render(); return;
    }
    const el = e.target.closest('[data-in]');
    if (!el) return;
    b[el.dataset.in] = el.value;
    touch(); render();
  });

  /* 텍스트 서식 — contenteditable 에 실제 서식을 적용한다 (마크다운 미지원) */
  const rtLen = html => {
    const d = document.createElement('div');
    d.innerHTML = html || '';
    return d.textContent.length;
  };
  function fmt(cmd) {
    const area = $('rt-area');
    const b = find(activeId);
    if (!area || !b) return;
    area.focus();
    document.execCommand(cmd, false, null);
    b.html = area.innerHTML;
    if ($('char-count')) $('char-count').textContent = rtLen(b.html) + '/2000';
    touch(); render();
  }

  $('editor-cancel').onclick = closeAllSheets;
  $('editor-done').onclick = closeAllSheets;

  /* ============================================================
     전역 디자인 시트 — 캔버스를 축소해 시트 위에 남긴다
     ============================================================ */
  function openDesign() {
    closeLayer('layer-editor');
    closeLayer('layer-catalog');
    activeId = null;
    render();
    $('scroll').scrollTo({ top: 0 });
    openLayer('layer-design');
    /* 축소 중에는 레일·삽입점·배지를 숨겨 실제 페이지처럼 보이게 한다 */
    document.body.classList.add('design-open', 'preview');
    drawDesign();
  }

  /* ── 목업 조각 ── */
  function mock(key, val, cur, art, name, act) {
    return '<button class="mock' + (name ? '' : ' mock-compact')
      + (String(cur) === String(val) ? ' is-active' : '') + '"'
      + ' data-act="' + (act || 'sett') + '" data-k="' + key + '" data-v="' + val + '">'
      + '<span class="mock-art">' + art + '</span>'
      + (name ? '<span class="mock-name">' + name + '</span>' : '') + '</button>';
  }
  const F = c => ' style="fill:var(' + c + ')"';

  /* 커버 가장자리 — 아래쪽 경계가 또렷한지, 페이지 배경으로 풀리는지 */
  function mkCoverEdge(v) {
    if (v === 'sharp') return '<svg class="mk" viewBox="0 0 72 28">'
      + '<rect x="0" y="0" width="72" height="28" rx="4"' + F('--color-surface-sub') + '/></svg>';
    return '<svg class="mk" viewBox="0 0 72 28">'
      + '<defs><linearGradient id="mkedge" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0.35" style="stop-color:var(--color-surface-sub)"/>'
      + '<stop offset="1" style="stop-color:var(--color-surface-sub);stop-opacity:0"/></linearGradient></defs>'
      + '<rect x="0" y="0" width="72" height="28" rx="4" style="fill:url(#mkedge)"/></svg>';
  }

  function mkChat(v) {
    const frame = '<rect x="1" y="1" width="42" height="58" rx="6" style="fill:var(--color-surface);stroke:var(--color-border);stroke-width:1"/>'
      + '<circle cx="11" cy="12" r="5"' + F('--color-surface-sub') + '/>'
      + '<rect x="6" y="20" width="18" height="3" rx="1.5"' + F('--color-border') + '/>';
    const blocksArt = (y) => '<rect x="6" y="' + y + '" width="32" height="6" rx="3"' + F('--color-surface-sub') + '/>'
      + '<rect x="6" y="' + (y + 9) + '" width="32" height="6" rx="3"' + F('--color-surface-sub') + '/>';
    let extra = '';
    if (v === 'bottom') extra = blocksArt(29) + '<rect x="6" y="49" width="32" height="7" rx="3.5"' + F('--color-text') + '/>';
    else if (v === 'corner') extra = blocksArt(29) + '<circle cx="34" cy="50" r="6"' + F('--color-text') + '/>';
    else extra = '<rect x="6" y="27" width="32" height="7" rx="3.5"' + F('--color-text') + '/>' + blocksArt(39);
    return '<svg class="mk" viewBox="0 0 44 60" style="max-width:44px;margin:0 auto">' + frame + extra + '</svg>';
  }

  function mkShape(v) {
    const rx = v === 'sharp' ? 2 : (v === 'pill' ? 10 : 6);
    return '<svg class="mk" viewBox="0 0 72 28">'
      + '<rect x="2" y="4" width="68" height="20" rx="' + rx + '" style="fill:var(--color-surface);stroke:var(--color-border);stroke-width:1.5"/></svg>';
  }

  function mkShadow(v) {
    return '<span class="mk-shadow" style="box-shadow:' + SHADOW[v] + '"></span>';
  }

  function mkIcon(name) { return '<i data-lucide="' + name + '" class="mk-ico"></i>'; }

  /* 프로필 앞면 미리보기 — 동그란 사진 · 명함 · 큰 이미지 */
  function mkLayout(v) {
    const line = (x, y, w) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="4" rx="2"' + F('--color-border') + '/>';
    let art;
    if (v === 'avatar') art = '<circle cx="31" cy="16" r="9"' + F('--color-text-muted') + '/>' + line(18, 31, 26) + line(23, 39, 16);
    else if (v === 'card') art = '<rect x="6" y="6" width="50" height="32" rx="4" style="fill:var(--color-surface);stroke:var(--color-border);stroke-width:1.5"/>'
      + '<rect x="11" y="11" width="14" height="8" rx="2"' + F('--color-text-muted') + '/>'
      + '<rect x="42" y="11" width="9" height="9" rx="2"' + F('--color-border') + '/>' + line(11, 28, 22);
    else art = '<rect x="6" y="4" width="50" height="28" rx="4"' + F('--color-text-muted') + '/>'
      + '<rect x="6" y="36" width="50" height="14" rx="4" style="fill:var(--color-surface);stroke:var(--color-border);stroke-width:1.5"/>';
    return '<svg class="mk" viewBox="0 0 62 52" style="max-width:62px;margin:0 auto">' + art + '</svg>';
  }

  /* 섹션이 흰 카드 면에 올라가는지 */
  function mkSurface(v) {
    const face = v === 'card'
      ? '<rect x="2" y="3" width="68" height="22" rx="6" style="fill:var(--color-surface);stroke:var(--color-border);stroke-width:1.5"/>'
      : '';
    return '<svg class="mk" viewBox="0 0 72 28">' + face
      + '<rect x="10" y="9" width="30" height="4" rx="2"' + F('--color-text-muted') + '/>'
      + '<rect x="10" y="17" width="44" height="4" rx="2"' + F('--color-border') + '/></svg>';
  }

  /* 색상 스와치 줄 — 프리셋 + 마지막 칸의 컬러피커(자유 선택) */
  function swatchRow(key, cur, presets, fillOf, custom, fallbackToken) {
    const cells = presets.map(v =>
      '<button class="swatch' + (cur === v ? ' is-active' : '') + '" data-act="sett" data-k="' + key + '" data-v="' + v + '"'
      + ' style="background:' + fillOf(v) + '" aria-label="' + v + '"></button>').join('');
    const val = custom || tokenHex(fallbackToken);
    return '<div class="swatch-row">' + cells
      + '<label class="swatch swatch-pick' + (cur === 'custom' ? ' is-active' : '') + '"'
      + (custom ? ' style="background:' + custom + '"' : '') + '>'
      + '<i data-lucide="pipette"></i>'
      + '<input type="color" data-pick="' + key + '"' + (val ? ' value="' + val + '"' : '') + '>'
      + '</label></div>';
  }

  function drawDesign() {
    $('design-tabs').innerHTML = [['profile', '프로필'], ['style', '스타일'], ['block', '블록'], ['chat', '대화버튼']].map(t =>
      '<button class="tab' + (designTab === t[0] ? ' is-active' : '') + '" data-act="dtab" data-v="' + t[0] + '">' + t[1] + '</button>'
    ).join('');

    let h = '';
    if (designTab === 'profile') {
      const pb = blocks.find(b => b.kind === 'profile');
      h += fieldLabel('레이아웃') + '<div class="mock-row mock-row-3">'
        + mock('layout', 'avatar', P.layout, mkLayout('avatar'), '동그란 사진', 'setp')
        + mock('layout', 'card',   P.layout, mkLayout('card'),   '명함',       'setp')
        + mock('layout', 'image',  P.layout, mkLayout('image'),  '큰 이미지',   'setp')
        + '</div>';
      if (pb) h += fieldLabel('정렬') + '<div class="mock-row mock-row-2">'
        + mock('align', 'left',   pb.align, mkIcon('align-left'),   '좌측정렬', 'setpb')
        + mock('align', 'center', pb.align, mkIcon('align-center'), '중앙정렬', 'setpb')
        + '</div>';

    } else if (designTab === 'style') {
      h += fieldLabel('배경색')
        + swatchRow('pageBg', T.pageBg, PAGE_BG, v => 'var(--color-page-' + v + ')', T.pageBgCustom, '--color-page-lilac')
        + fieldLabel('텍스트 색상')
        + swatchRow('pageText', T.pageText, PAGE_TEXT_PRESET, v => TEXT_FILL[v], T.pageTextCustom, '--color-text');

    } else if (designTab === 'block') {
      h += fieldLabel('모양') + '<div class="mock-row mock-row-3">'
        + mock('shape', 'sharp', T.shape, mkShape('sharp'), '')
        + mock('shape', 'round', T.shape, mkShape('round'), '')
        + mock('shape', 'pill',  T.shape, mkShape('pill'),  '')
        + '</div>'
        + fieldLabel('그림자') + '<div class="mock-row mock-row-4">'
        + mock('shadow', 'none',   T.shadow, mkShadow('none'),   '')
        + mock('shadow', 'soft',   T.shadow, mkShadow('soft'),   '')
        + mock('shadow', 'mid',    T.shadow, mkShadow('mid'),    '')
        + mock('shadow', 'strong', T.shadow, mkShadow('strong'), '')
        + '</div>'
        + fieldLabel('카드 면') + '<div class="mock-row mock-row-2">'
        + mock('surface', 'card',  T.surface, mkSurface('card'),  '있음')
        + mock('surface', 'plain', T.surface, mkSurface('plain'), '없음')
        + '</div>'
        + fieldLabel('정렬') + '<div class="mock-row mock-row-2">'
        + mock('balign', 'left',   T.balign, mkIcon('align-left'),   '좌측정렬')
        + mock('balign', 'center', T.balign, mkIcon('align-center'), '중앙정렬')
        + '</div>';

    } else {
      h += fieldLabel('위치') + '<div class="mock-row mock-row-3">'
        + mock('chat', 'bottom', T.chat, mkChat('bottom'), '하단 고정')
        + mock('chat', 'corner', T.chat, mkChat('corner'), '코너')
        + mock('chat', 'inline', T.chat, mkChat('inline'), '프로필 안')
        + '</div>'
        + fieldLabel('버튼 문구')
        + '<input class="input" data-tin="ctaLabel" value="' + esc(T.ctaLabel) + '" placeholder="대화하기">'
        + fieldLabel('색상')
        + swatchRow('cta', T.cta, CTA_PRESET, v => CTA_FILL[v], T.ctaCustom, '--color-chat-plum')
        + fieldLabel('텍스트 색상')
        + swatchRow('ctaText', T.ctaText, TEXT_PRESET, v => TEXT_FILL[v], T.ctaTextCustom, '--color-text');
    }
    $('design-body').innerHTML = h;
    icons();
  }

  $('design-tabs').addEventListener('click', e => {
    const el = e.target.closest('[data-act="dtab"]');
    if (!el) return;
    designTab = el.dataset.v;
    drawDesign();
  });

  $('design-body').addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (act === 'sett') {
      T[el.dataset.k] = el.dataset.v;
      touch(); render(); drawDesign();
    }
    if (act === 'setp') {
      P[el.dataset.k] = el.dataset.v;
      touch(); render(); drawDesign();
    }
    if (act === 'setpb') {
      const pb = blocks.find(b => b.kind === 'profile');
      if (pb) pb[el.dataset.k] = el.dataset.v;
      touch(); render(); drawDesign();
    }
  });

  /* 컬러피커 — 프리셋 밖의 색을 런타임에 직접 고른다 */
  $('design-body').addEventListener('input', e => {
    const tin = e.target.closest('[data-tin]');
    if (tin) { T[tin.dataset.tin] = tin.value; touch(); render(); return; }
    const el = e.target.closest('[data-pick]');
    if (!el) return;
    const k = el.dataset.pick;
    T[k] = 'custom';
    T[k + 'Custom'] = el.value;
    touch(); render();
    el.closest('.swatch').style.background = el.value;
    document.querySelectorAll('#design-body .swatch').forEach(s => s.classList.remove('is-active'));
    el.closest('.swatch').classList.add('is-active');
  });

  $('design-cancel').onclick = closeAllSheets;
  $('design-done').onclick = closeAllSheets;
  $('chip-design').onclick = () => { if (!previewMode) openDesign(); };
  $('chip-name').onclick = () => { if (!previewMode) openNameDialog(); };
  $('chip-autofill').onclick = () => {
    if (previewMode) return;
    closeAllSheets();
    openLayer('layer-autofill');
  };
  $('autofill-cancel').onclick = closeAllSheets;
  $('autofill-overlay').onclick = closeAllSheets;
  document.querySelector('.autofill-actions').addEventListener('click', e => {
    if (!e.target.closest('[data-af]')) return;
    closeAllSheets();
    toast('빈 항목을 채웠어요');
  });

  /* ============================================================
     블록 추가 카탈로그
     ============================================================ */
  function openCatalog(i) {
    insertAt = i;
    closeLayer('layer-editor');
    closeLayer('layer-design');
    document.body.classList.remove('design-open');
    if (!previewMode) document.body.classList.remove('preview');
    activeId = null;
    render();
    openLayer('layer-catalog');
    drawCatalog();
  }

  const KIND_ICON = {
    profile: 'circle-user-round', text: 'type', gallery: 'images', sns: 'at-sign',
    info: 'list', event: 'calendar-days', board: 'newspaper', review: 'star'
  };

  function drawCatalog() {
    const has = k => blocks.some(b => b.kind === k);
    const cells = ['profile', 'sns', 'text', 'gallery', 'event', 'info', 'board', 'review'];
    $('catalog-body').innerHTML = '<div class="cat-grid">' + cells.map(k => {
      const off = SINGLETON.indexOf(k) >= 0 && has(k);
      return '<button class="cat-cell" data-act="add" data-v="' + k + '"' + (off ? ' disabled' : '') + '>'
        + '<i data-lucide="' + KIND_ICON[k] + '"></i>' + KIND_ALL[k] + '</button>';
    }).join('') + '</div>';
    icons();
  }

  $('catalog-body').addEventListener('click', e => {
    const el = e.target.closest('[data-act="add"]');
    if (el) addBlock(el.dataset.v);
  });
  $('catalog-cancel').onclick = closeAllSheets;
  $('catalog-overlay').onclick = closeAllSheets;

  function addBlock(kind) {
    const id = ++seq;
    let nb;
    if (kind === 'profile') nb = { id, kind, align: 'left', visible: true };
    else if (kind === 'text') nb = { id, kind: 'text', title: KIND_ALL.text, html: '', ai: true, visible: true };
    else if (kind === 'sns') nb = { id, kind: 'sns', name: KIND_ALL.sns, visible: true, icons: [{ p: 'Instagram', id: '', ai: true }] };
    else if (kind === 'gallery') nb = { id, kind: 'gallery', name: KIND_ALL.gallery, layout: 'grid', items: [], visible: true };
    else if (kind === 'info') nb = { id, kind: 'info', name: KIND_ALL.info, visible: true, links: [{ title: '', url: '', ai: true }] };
    else nb = { id, kind, name: KIND[kind], limit: '3', order: 'recent', visible: true, ai: true, items: [] };

    blocks.splice(insertAt, 0, nb);
    touch();
    closeLayer('layer-catalog');
    openEditor(id);
  }

  /* ============================================================
     컬렉션 전체 화면
     ============================================================ */
  function openFull(id) {
    fullId = id;
    drawFull();
    openLayer('layer-full');
  }

  /* 전체 화면은 노출 순서 변경 전용. 콘텐츠 등록·수정은 프로필 화면에서만 한다. */
  function drawFull() {
    const b = find(fullId);
    if (!b) return;
    const shown = Math.min(Number(b.limit), b.items.length);
    $('full-title').textContent = KIND[b.kind] + ' 순서 변경';

    $('full-body').innerHTML = b.items.length === 0
      ? '<div class="full-empty">아직 등록된 ' + ITEM[b.kind].n + ITEM[b.kind].j + ' 없어요</div>'
      : b.items.map((it, i) =>
        '<div class="full-item' + (i < shown ? '' : ' is-dim') + '">'
        + '<span class="full-item-grip"><i data-lucide="grip-vertical"></i></span>'
        + '<span class="full-item-info"><span class="full-item-title">' + esc(it.t) + '</span>'
        + (it.d ? '<span class="full-item-sub">' + esc(it.d) + '</span>' : '') + '</span>'
        + '<span class="full-item-arrows">'
        + '<button class="icon-btn icon-btn-sm icon-btn-border" data-fmv="-1" data-id="' + it.id + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="위로"><i data-lucide="chevron-up" style="width:14px;height:14px"></i></button>'
        + '<button class="icon-btn icon-btn-sm icon-btn-border" data-fmv="1" data-id="' + it.id + '"' + (i === b.items.length - 1 ? ' disabled' : '') + ' aria-label="아래로"><i data-lucide="chevron-down" style="width:14px;height:14px"></i></button>'
        + '</span></div>').join('');
    icons();
  }

  $('full-body').addEventListener('click', e => {
    const el = e.target.closest('[data-fmv]');
    if (!el) return;
    const b = find(fullId);
    const i = b.items.findIndex(x => x.id === el.dataset.id);
    const j = i + Number(el.dataset.fmv);
    if (j < 0 || j >= b.items.length) return;
    const tmp = b.items[i]; b.items[i] = b.items[j]; b.items[j] = tmp;
    touch(); render(); drawFull();
  });

  $('full-back').onclick = () => {
    closeLayer('layer-full');
    if (fullId) openEditor(fullId);
  };

  /* ============================================================
     블록 이동 (화살표 / 드래그)
     ============================================================ */
  function moveBlock(id, d) {
    const i = blocks.findIndex(b => b.id === id);
    const j = i + d;
    if (j < 0 || j >= blocks.length) return;
    const tmp = blocks[i]; blocks[i] = blocks[j]; blocks[j] = tmp;
    touch(); render();
    if (activeId === id) scrollToActive();
  }

  let drag = null;
  function gripDown(e, id) {
    if (previewMode) return;
    e.preventDefault(); e.stopPropagation();
    const grip = e.currentTarget;
    grip.setPointerCapture(e.pointerId);
    const row = document.querySelector('.block[data-block-id="' + id + '"]');
    const line = document.createElement('div');
    line.className = 'drop-line';
    $('canvas').appendChild(line);
    drag = { id, idx: null, line, grip };
    row.classList.add('is-dragging');
    document.body.classList.add('dragging');
    grip.addEventListener('pointermove', gripMove);
    grip.addEventListener('pointerup', gripUp);
    grip.addEventListener('pointercancel', gripUp);
  }

  function gripMove(e) {
    if (!drag) return;
    const rows = Array.prototype.slice.call(document.querySelectorAll('.block'));
    const top = $('canvas').getBoundingClientRect().top;
    let idx = rows.length;
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i].getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { idx = i; break; }
    }
    drag.idx = idx;
    const y = idx < rows.length
      ? rows[idx].getBoundingClientRect().top - top
      : rows[rows.length - 1].getBoundingClientRect().bottom - top;
    drag.line.style.top = y + 'px';
  }

  function gripUp() {
    if (!drag) return;
    const d = drag; drag = null;
    d.grip.removeEventListener('pointermove', gripMove);
    d.grip.removeEventListener('pointerup', gripUp);
    d.grip.removeEventListener('pointercancel', gripUp);
    if (d.line.parentNode) d.line.parentNode.removeChild(d.line);
    document.body.classList.remove('dragging');

    if (d.idx !== null) {
      const from = blocks.findIndex(b => b.id === d.id);
      let to = d.idx;
      if (to > from) to--;
      if (to !== from && to >= 0 && to < blocks.length) {
        const moved = blocks.splice(from, 1)[0];
        blocks.splice(to, 0, moved);
        touch();
      }
    }
    render();
  }

  /* ============================================================
     이름·주소 다이얼로그
     ============================================================ */
  function openNameDialog() {
    $('nd-name').value = P.name;
    $('nd-handle').value = '';
    $('nd-old').textContent = 'connectia.bio/' + P.handle;
    $('nd-status').textContent = '';
    $('nd-status').className = 'url-status';
    $('nd-save').disabled = true;
    $('layer-name').classList.add('on');
  }

  function ndCheck() {
    const h = $('nd-handle').value.trim().toLowerCase();
    const st = $('nd-status');
    let handleOk = false;
    if (!h) {
      st.textContent = ''; st.className = 'url-status';
    } else if (TAKEN.indexOf(h) >= 0) {
      st.textContent = '사용 중'; st.className = 'url-status no';
    } else {
      st.textContent = '사용 가능'; st.className = 'url-status ok'; handleOk = true;
    }
    const nameChanged = $('nd-name').value.trim() && $('nd-name').value.trim() !== P.name;
    $('nd-save').disabled = !(handleOk || nameChanged);
  }

  $('nd-name').addEventListener('input', ndCheck);
  $('nd-handle').addEventListener('input', ndCheck);
  $('nd-cancel').onclick = () => $('layer-name').classList.remove('on');
  $('nd-save').onclick = () => {
    const n = $('nd-name').value.trim();
    const h = $('nd-handle').value.trim().toLowerCase();
    if (n) P.name = n;
    if (h && TAKEN.indexOf(h) < 0) P.handle = h;
    $('layer-name').classList.remove('on');
    touch(); render();
    const ab = find(activeId);
    if (ab && ab.kind === 'profile') drawEditor();
    toast('변경했어요');
  };

  /* ============================================================
     확인 다이얼로그
     ============================================================ */
  let cfCb = null;
  function confirmDlg(title, yes, danger, cb) {
    cfCb = cb;
    $('cf-title').textContent = title;
    $('cf-yes').textContent = yes;
    $('cf-yes').className = 'btn btn-md ' + (danger ? 'btn-fill-danger' : 'btn-fill-primary');
    $('layer-confirm').classList.add('on');
  }
  $('cf-no').onclick = () => { $('layer-confirm').classList.remove('on'); cfCb = null; };
  $('cf-yes').onclick = () => {
    $('layer-confirm').classList.remove('on');
    const cb = cfCb; cfCb = null;
    if (cb) cb();
  };

  /* ============================================================
     저장 · 이탈
     ============================================================ */
  $('btn-apply').onclick = () => {
    dirty = false;
    $('btn-apply').disabled = true;
    closeAllSheets();
    toast('저장했어요');
  };

  $('btn-cancel').onclick = () => {
    if (!dirty) { toast('편집을 닫았어요'); return; }
    confirmDlg('변경사항을 저장하지 않고 나갈까요?', '나가기', false, () => {
      dirty = false;
      $('btn-apply').disabled = true;
      closeAllSheets();
      toast('편집을 닫았어요');
    });
  };

  /* ============================================================
     미리보기 모드
     ============================================================ */
  $('chip-preview').onclick = function () {
    previewMode = !previewMode;
    if (previewMode) { closeLayer('layer-full'); closeAllSheets(); }
    document.body.classList.toggle('preview', previewMode);
    this.classList.toggle('is-active', previewMode);
    $('chip-design').disabled = previewMode;
    $('chip-name').disabled = previewMode;
    $('chip-autofill').disabled = previewMode;
    render();
  };

  render();
  icons();
  </script>
</body>
</html>
