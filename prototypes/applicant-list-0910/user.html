<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>참석자 — 26년 청춘건배</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-base);
    background: var(--color-scrim);
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  /* 이벤트 페이지 위에 뜨는 모달이라는 걸 보이려고 깔아 둔 배경 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: var(--color-banner-gradient);
  }
  i[data-lucide] { display: inline-flex; flex-shrink: 0; }
  svg.lucide { flex-shrink: 0; }

  /* ============================================
     모달 — PC는 넓게, 모바일은 화면 전체
     ============================================ */
  .modal {
    width: 100%;
    max-width: 1280px;
    height: 90vh;
    background: var(--color-surface);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-4);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  @media (max-width: 767px) {
    body { padding: 0; }
    .modal { max-width: none; height: 100dvh; border-radius: 0; }
  }

  /* ── 헤더 — 두 줄만 고정 ── */
  .head {
    flex-shrink: 0;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }
  .head-top {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 20px 12px;
  }
  .head-title {
    font-size: var(--fs-title); font-weight: var(--fw-bold);
    letter-spacing: var(--ls-title); color: var(--color-text);
    margin-right: auto;
  }
  /* 보기 전환 — 늘 보이는 스위치 탭 */
  .view-seg {
    display: flex; gap: 4px;
    padding: 4px;
    background: var(--color-surface-sub);
    border-radius: var(--r-full);
  }
  .view-seg-btn {
    padding: 8px 16px;
    border: none; border-radius: var(--r-full);
    background: transparent;
    font-family: var(--font-base);
    font-size: var(--fs-label); font-weight: var(--fw-medium);
    color: var(--color-text-muted);
    cursor: pointer; white-space: nowrap;
    transition: background var(--motion-fast) var(--ease-standard),
                color var(--motion-fast) var(--ease-standard);
  }
  .view-seg-btn:hover { color: var(--color-text-sub); }
  .view-seg-btn.is-active {
    background: var(--color-surface);
    color: var(--color-text);
    font-weight: var(--fw-bold);
    box-shadow: var(--shadow-1);
  }

  .head-tools { display: flex; align-items: center; gap: 4px; }
  .head-tools .icon-btn i[data-lucide],
  .head-tools .icon-btn svg.lucide { width: 18px; height: 18px; }
  @media (max-width: 767px) {
    .head-title { display: none; }
    body.is-user .head-title { display: block; }
    .view-seg { margin-right: auto; }
  }

  .head-filters {
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px 12px;
  }
  .type-tabs { display: flex; gap: 4px; flex-shrink: 0; }
  .type-tab {
    padding: 8px 12px;
    background: none; border: none;
    border-bottom: 2px solid transparent;
    font-family: var(--font-base);
    font-size: var(--fs-body); font-weight: var(--fw-medium);
    color: var(--color-text-muted);
    cursor: pointer; white-space: nowrap;
  }
  .type-tab.is-active {
    color: var(--color-text); font-weight: var(--fw-bold);
    border-bottom-color: var(--color-text);
  }
  /* 승인이 주 용도라 대기 건만 보는 경로를 한 번에 준다 */
  .pending-toggle {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: var(--fs-label); font-weight: var(--fw-medium);
    color: var(--color-text-sub);
    cursor: pointer; white-space: nowrap;
  }
  .pending-toggle[hidden] { display: none; }
  .pending-toggle:has(input:checked) {
    color: var(--color-text); font-weight: var(--fw-bold);
  }

  .head-right {
    margin-left: auto; flex-shrink: 0;
    display: flex; align-items: center; gap: 16px;
  }
  .head-count {
    flex-shrink: 0;
    font-size: var(--fs-label); color: var(--color-text-sub);
  }
  /* 좁은 화면에서 탭·토글·총원이 한 줄에 다 안 들어간다.
     토글이 뜨는 탭에서만 총원을 접는다 — 다른 탭에서는 그대로 보인다 */
  @media (max-width: 767px) {
    .head-right:has(#pending-toggle:not([hidden])) .head-count { display: none; }
  }
  .head-count strong { color: var(--color-text); font-weight: var(--fw-bold); }

  /* 자리 현황 — PC는 헤더 안 한 줄, 모바일은 목록과 함께 스크롤 */
  .slots {
    display: flex; gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .slots::-webkit-scrollbar { display: none; }
  .slot {
    display: flex; align-items: baseline; gap: 8px;
    flex-shrink: 0;
    padding: 8px 16px;
    background: var(--color-surface-sub);
    border-radius: var(--r-full);
    font-size: var(--fs-label); font-weight: var(--fw-medium);
    color: var(--color-text);
    white-space: nowrap;
  }
  .slot-left {
    font-size: var(--fs-caption); color: var(--color-text-muted);
    font-variant-numeric: tabular-nums;
  }
  .slot.is-full .slot-left { color: var(--color-destructive); font-weight: var(--fw-bold); }

  /* ── 본문 ── */
  .body {
    flex: 1; overflow-y: auto;
    background: var(--color-bg);
  }
  .slots-mobile { display: none; }
  @media (max-width: 767px) {
    .head-slots { display: none; }
    .slots-mobile {
      display: flex;
      padding: 12px 16px;
      background: var(--color-bg);
    }
  }

  /* ── 목록 — 한 줄에 한 신청 ── */
  .rows { display: flex; flex-direction: column; }
  .rows-empty {
    padding: 64px 20px; text-align: center;
    background: var(--color-surface);
    font-size: var(--fs-body); color: var(--color-text-muted);
  }
  .row {
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }
  /* 펼친 줄은 끝나는 지점이 다음 줄과 같은 굵기면 어디까지가 상세인지 안 보인다 */
  .row.is-open { border-bottom: 8px solid var(--color-bg); }
  .row-main {
    display: grid;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    cursor: pointer;
    /* 선택 · 이름 · 유형 · 자리 · 상태 · 액션 · 신청일
       이름만 남는 폭을 먹고 나머지는 고정이라 줄마다 열이 어긋나지 않는다 */
    grid-template-columns: 24px minmax(120px, 1fr) 72px 168px 76px 104px 128px 32px;
  }
  .row-main:hover { background: var(--color-surface-sub); }
  .row.is-open .row-main { background: var(--color-surface-sub); }
  /* 펼친 상태로 상세를 훑을 때 어느 신청을 보는지 놓치지 않게 그 줄만 붙여 둔다.
     붙어 있는 줄에 승인·거절이 함께 있어 돌아가지 않고 처리할 수 있다 */
  .row.is-open .row-main {
    position: sticky; top: 0; z-index: 5;
    border-bottom: 1px solid var(--color-border);
  }

  .row-name {
    display: flex; align-items: baseline; gap: 8px; min-width: 0;
    font-size: var(--fs-body-lg); font-weight: var(--fw-bold);
    color: var(--color-text); letter-spacing: var(--ls-body-lg);
  }
  .row-count { font-size: var(--fs-caption); color: var(--color-text-muted); font-weight: var(--fw-regular); }
  .row-meta { font-size: var(--fs-label); color: var(--color-text-sub); }
  .row-date {
    font-size: var(--fs-caption); color: var(--color-text-muted);
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .row-actions { display: flex; gap: 4px; }
  .row-slot { white-space: nowrap; }
  .row-del { display: flex; justify-content: flex-end; }
  /* 사용자 화면 — 이름·요약·펼치기 셋뿐이라 줄 구성이 다르다 */
  body.is-user .row-main {
    grid-template-columns: 1fr 24px;
    grid-template-areas: "name more";
  }
  body.is-user .row-name { grid-area: name; }
  body.is-user .row-more { grid-area: more; }
  .row-more { display: flex; justify-content: flex-end; color: var(--color-text-muted); }
  .row-more i[data-lucide], .row-more svg.lucide { width: 18px; height: 18px; }
  @media (max-width: 767px) {
  }
  /* 사용자 화면에서는 운영 도구를 통째로 감춘다 */
  body.is-user .head-tools .icon-btn[aria-label="더보기"],
  body.is-user .menu-wrap,
  body.is-user #pending-toggle,
  body.is-user #bulk { display: none; }
  .row-del i[data-lucide], .row-del svg.lucide { width: 16px; height: 16px; }

  /* 모바일 — 같은 줄을 두 층으로 접는다 */
  @media (max-width: 767px) {
    .row-main {
      grid-template-columns: 24px 1fr auto auto;
      grid-template-areas:
        "check name   status del"
        ".     meta   meta   meta"
        ".     action date   date";
      row-gap: 8px;
      padding: 16px;
    }
    .row-check  { grid-area: check; }
    .row-name   { grid-area: name; }
    .row-status { grid-area: status; justify-self: end; }
    .row-type, .row-slot { display: none; }
    .row-meta-m { grid-area: meta; }
    .row-actions { grid-area: action; }
    .row-date { grid-area: date; align-self: center; }
    .row-del { grid-area: del; }
  }
  .row-meta-m { display: none; }
  @media (max-width: 767px) {
    .row-meta-m {
      display: flex; gap: 8px;
      font-size: var(--fs-label); color: var(--color-text-sub);
    }
  }

  /* ── 상세 — 라벨을 값 위에, PC는 두 열 ── */
  .detail {
    display: grid; gap: 32px;
    padding: 20px;
    background: var(--color-surface);
    border-top: 1px solid var(--color-border);
  }
  /* 팀이면 왼쪽은 신청 정보, 오른쪽은 사람. 개인이면 한 열로 둔다 */
  @media (min-width: 768px) {
    .detail.has-members { grid-template-columns: 1fr 1fr; }
  }
  .detail[hidden] { display: none; }
  .detail-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .detail-head {
    font-size: var(--fs-caption); font-weight: var(--fw-bold);
    color: var(--color-text-muted);
  }
  .fields { display: grid; gap: 12px; }
  /* 항목이 붙어 보이지 않게 옅은 선으로 가른다 */
  .field + .field {
    border-top: 1px solid var(--color-border);
    padding-top: 12px;
  }
  @media (max-width: 767px) {
    .detail { padding: 16px; gap: 24px; }
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field-label {
    font-size: var(--fs-caption); font-weight: var(--fw-medium);
    color: var(--color-text-muted); line-height: var(--lh-caption);
  }
  .field-value {
    font-size: var(--fs-label); color: var(--color-text);
    line-height: 1.6; word-break: break-word;
    max-width: 88ch;
  }
  .field-value.is-empty { color: var(--color-text-muted); }
  /* 객관식은 고른 보기라 값이 아니라 하나의 선택으로 읽혀야 한다 */
  /* 대표자가 고른 순서 — 승인할 때 어디에 넣을지 판단하는 근거다 */
  .field-ranks { display: flex; flex-wrap: wrap; gap: 8px; }
  .rank-chip {
    display: inline-flex; align-items: baseline; gap: 8px;
    padding: 4px 12px;
    border-radius: var(--r-full);
    background: var(--color-surface-sub);
    font-size: var(--fs-caption); color: var(--color-text);
  }
  .rank-chip .rank-no {
    font-weight: var(--fw-bold); color: var(--color-text-muted);
    font-style: normal;
  }

  .field-file {
    align-self: flex-start;
    max-width: 100%;
    min-width: 0;
  }
  .field-file .field-file-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .field-file i[data-lucide], .field-file svg.lucide { width: 14px; height: 14px; }

  .field-chip {
    align-self: flex-start;
    padding: 4px 12px;
    border-radius: var(--r-full);
    background: var(--color-primary-light);
    font-size: var(--fs-caption); font-weight: var(--fw-regular);
    line-height: var(--lh-caption);
    color: var(--color-text);
  }

  /* 세로로 쌓으면 인원이 홀수든 항목 수가 다르든 어긋나지 않는다 */
  .members { display: flex; flex-direction: column; gap: 12px; }
  .member {
    background: var(--color-bg);
    border-radius: var(--r-md);
    padding: 16px;
  }
  .member-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .member-name { font-size: var(--fs-body); font-weight: var(--fw-bold); color: var(--color-text); }
  .member .fields { grid-template-columns: 1fr; gap: 12px; }

  /* ── 하단 일괄 처리 바 ── */
  .bulk {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    background: var(--color-surface);
    border-top: 1px solid var(--color-border);
  }
  .bulk[hidden] { display: none; }
  .bulk-all {
    margin-right: auto;
    display: flex; align-items: center; gap: 8px;
    background: none; border: none; padding: 4px 0;
    font-family: var(--font-base);
    font-size: var(--fs-label); font-weight: var(--fw-medium);
    color: var(--color-text-sub);
    cursor: pointer;
  }

  /* ── 받고 있는 정보 · 메뉴 ── */
  .pop-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: var(--color-scrim);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .pop-overlay[hidden] { display: none; }
  .pop {
    width: 100%; max-width: 520px;
    max-height: 80vh; overflow-y: auto;
    background: var(--color-surface);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-4);
    padding: 24px;
  }
  .pop-title {
    display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    font-size: var(--fs-heading); font-weight: var(--fw-bold);
    color: var(--color-text);
  }
  .pop-title .icon-btn { margin-left: auto; }
  .pop-list { display: grid; gap: 24px; }
  .pop-group { display: flex; flex-direction: column; gap: 12px; }
  .pop-group-name {
    display: flex; align-items: baseline; gap: 8px;
    font-size: var(--fs-body); font-weight: var(--fw-bold);
    color: var(--color-text);
  }
  .pop-group-count {
    font-size: var(--fs-caption); font-weight: var(--fw-regular);
    color: var(--color-text-muted);
  }
  .pop-items { display: grid; gap: 8px; list-style: none; }
  .pop-items li {
    position: relative; padding-left: 16px;
    font-size: var(--fs-label); color: var(--color-text-sub);
    line-height: var(--lh-label);
  }
  /* 브라우저 기본 마커 대신 작은 점 — 다른 화면의 목록과 같은 모양 */
  .pop-items li::before {
    content: ""; position: absolute; left: 0; top: 8px;
    width: 4px; height: 4px; border-radius: var(--r-full);
    background: var(--color-border);
  }
  /* 팀원 항목은 팀 항목의 하위다 — 들여쓰고 세로선으로 묶는다 */
  .pop-sub {
    display: flex; flex-direction: column; gap: 8px;
    margin-top: 4px; padding-left: 16px;
    border-left: 2px solid var(--color-border);
  }
  .pop-sub-name {
    display: flex; align-items: baseline; gap: 8px;
    font-size: var(--fs-caption); font-weight: var(--fw-bold);
    color: var(--color-text-muted);
  }

  .menu-wrap { position: relative; }
  .menu-wrap .menu {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 50;
    min-width: 180px;
  }
  .menu-wrap .menu[hidden] { display: none; }

  .toast-container { position: fixed; bottom: 32px; z-index: 200; }
</style>
</head>
<body class="is-user">

<div class="modal">

  <div class="head">
    <div class="head-top">
      <span class="head-title">참석자</span>
      <div class="head-tools">
        <button class="icon-btn icon-btn-sm icon-btn-clear" type="button" aria-label="닫기" onclick="showToast('이벤트 페이지로 돌아가요.')">
          <i data-lucide="x"></i>
        </button>
      </div>
    </div>

    <div class="head-filters">
      <div class="type-tabs" id="type-tabs"></div>
      <div class="head-right">
        <span class="head-count">총 <strong id="count-total">0</strong>명</span>
      </div>
    </div>
  </div>

  <div class="body">
    <div class="rows" id="rows"></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
/* ════════════════════════════════════════════
   신청자에게 보이는 참석자 목록.
   관리자 화면(index.html)의 '사용자 보기'와 같은 것을 보여준다.
   ════════════════════════════════════════════ */

/* reveal — 신청자에게 공개하는 항목. 없으면 그 유형은 사용자 화면에 아예 안 나온다.
   주최측이 이벤트 만들 때 고르는 '참석자 공개' 설정이 여기로 온다. */
var TYPES = [
  { id: 'all',  name: '전체' },
  { id: 'stu',  name: '재학생', slots: true,  approval: true,  reveal: ['학과'] },
  { id: 'grad', name: '졸업생', slots: false, approval: false,
    reveal: ['졸업한 학과, 학번', '소속 직장', '후배들에게 한마디'] }
];

var APPLICANTS = [
  {
    id: 'a1', type: 'stu', name: '대나무 밭', slot: 's2',
    status: 'review', date: '2026.09.09 21:52',
    fields: [
      ['자리 우선순위', ['2타임 (19:00~19:50)', '1타임 (17:30~18:40)'], 'ranks'],
      ['(대표자) [필수항목] 개인정보 수집, 이용 제공에 동의하십니까?', '동의합니다.', 'choice'],
      ['(대표자) [선택항목] 향후 총동문회 소식 수신에 동의하십니까?', '동의합니다.', 'choice'],
      ['(대표자, 선택) 장학금 사연', '취준생과 대학원준비생입니다.'],
      ['(대표자) 학과', '경제학부'],
      ['(대표자) 학번', '2023280033']
    ],
    members: [
      { name: '김형우', lead: true, fields: [['전화번호', '01092524624']] },
      { name: '김범룡', fields: [
        ['전화번호', '01046704850'],
        ['학과', '전자전기컴퓨터공학부'],

/* review·approved만 아직 손댈 수 있다. 나머지는 끝난 상태다 */

function typeOf(id) { return TYPES.filter(function(t){ return t.id === id; })[0] || {}; }
function revealOf(id) { return typeOf(id).reveal || null; }

/* 공개를 켠 유형만 이 화면에 나온다 */
function revealedTypes() {
  return TYPES.filter(function(t){ return t.id !== 'all' && t.reveal; });
}
/* 확정된 신청만 공개한다. 대기·거절·실패·취소 건은 남에게 보일 이유가 없다 */
function isPublic(a) {
  return !!revealOf(a.type) && (a.status === 'approved' || a.status === 'done');
}

/* '(대표자) 학과'는 대표자가 답한 '학과'다. 공개 항목을 맞출 때 접두사는 떼고 본다 */
function baseLabel(name) { return String(name).replace(/^\(대표자[^)]*\)\s*/, ''); }

/* 공개로 켠 항목만, 켠 순서대로 — 누구를 보든 같은 항목이 같은 자리에 온다.
   팀은 대표자와 팀원의 답을 한 항목으로 모은다 */
function publicFields(a) {
  var pool = (a.fields || []);
  (a.members || []).forEach(function(m){ pool = pool.concat(m.fields || []); });
  return (revealOf(a.type) || []).map(function(label){
    var vals = [];
    pool.forEach(function(f){
      if (baseLabel(f[0]) !== label) return;
      var v = Array.isArray(f[1]) ? '' : String(f[1] || '').trim();
      if (v && vals.indexOf(v) < 0) vals.push(v);
    });
    return vals.length ? [label, vals.join(' · ')] : null;
  }).filter(Boolean);
}

var filter = revealedTypes().length === 1 ? revealedTypes()[0].id : 'all';
var open = {};

function headcount(a) { return a.members ? a.members.length : 1; }
function shown() {
  return APPLICANTS.filter(function(a){
    return isPublic(a) && (filter === 'all' || a.type === filter);
  });
}
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function renderTabs() {
  var list = revealedTypes();
  if (list.length > 1) list = [TYPES[0]].concat(list);
  document.getElementById('type-tabs').innerHTML = list.map(function(t){
    return '<button type="button" class="type-tab' + (filter === t.id ? ' is-active' : '') + '" '
      + 'onclick="setFilter(\'' + t.id + '\')">' + esc(t.name) + '</button>';
  }).join('');
}

function fieldHTML(f) {
  var v = Array.isArray(f[1]) ? '' : String(f[1] || '').trim();
  var body;
  if (f[2] === 'choice' && v) {
    body = '<span class="field-chip">' + esc(v) + '</span>';
  } else if (f[2] === 'ranks' && Array.isArray(f[1]) && f[1].length) {
    body = '<div class="field-ranks">' + f[1].map(function(name, i){
      return '<span class="rank-chip"><em class="rank-no">' + (i + 1) + '</em>' + esc(name) + '</span>';
    }).join('') + '</div>';
  } else if (f[2] === 'file' && v) {
    body = '<button type="button" class="btn btn-sm btn-line-dark btn-pill field-file" '
      + 'onclick="event.stopPropagation();showToast(\'' + esc(v) + ' 을 내려받아요.\')">'
      + '<i data-lucide="download"></i>'
      + '<span class="field-file-name">' + esc(v) + '</span>'
      + '</button>';
  } else {
    body = '<span class="field-value' + (v ? '' : ' is-empty') + '">' + esc(v || '—') + '</span>';
  }
  return '<div class="field">'
    + '<span class="field-label">' + esc(f[0]) + '</span>'
    + body
    + '</div>';
}

function renderRows() {
  var rows = shown();
  document.getElementById('count-total').textContent = rows.reduce(function(n, a){
    return n + headcount(a);
  }, 0);

  if (rows.length === 0) {
    document.getElementById('rows').innerHTML =
      '<p class="rows-empty">아직 참석자가 없어요.</p>';
    return;
  }

  document.getElementById('rows').innerHTML = rows.map(function(a){
    var isOpen = !!open[a.id];
    return '<div class="row' + (isOpen ? ' is-open' : '') + '">'
      + '<div class="row-main" onclick="toggleOpen(\'' + a.id + '\')">'
      +   '<span class="row-name">' + esc(a.name)
      +     (a.members ? '<span class="row-count">' + a.members.length + '명</span>' : '') + '</span>'
      +   '<span class="row-more"><i data-lucide="' + (isOpen ? 'chevron-up' : 'chevron-down') + '"></i></span>'
      + '</div>'
      + (isOpen
          ? '<div class="detail"><div class="detail-col">'
            + '<div class="fields">' + publicFields(a).map(fieldHTML).join('') + '</div>'
            + '</div></div>'
          : '')
      + '</div>';
  }).join('');

  if (window.lucide) lucide.createIcons();
}

function setFilter(id) { filter = id; renderTabs(); renderRows(); }
function toggleOpen(id) { open[id] = !open[id]; renderRows(); }

var toastTimer = null;
function showToast(msg) {
  var wrap = document.getElementById('toast-container');
  wrap.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ wrap.innerHTML = ''; }, 2400);
}

renderTabs();
renderRows();
lucide.createIcons();
</script>
