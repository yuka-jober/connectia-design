<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>프로필 편집 — 카드형</title>
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="../../components.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-base);
      background: var(--color-bg);
      color: var(--color-text);
      max-width: 430px;
      margin: 0 auto;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;

      /* 전역 테마 (디자인 시트에서 런타임 교체) */
      --page-bg:       var(--color-page-mist);
      --cta-fill:      var(--color-brand-gradient);
      --cta-solid:     var(--color-primary);
      --btn-radius:    var(--r-md);
      --card-radius:   var(--r-md);
      --block-shadow:  var(--shadow-1);

      /* 하단 앱 탭바 높이 — 대화하기 버튼이 이만큼 위로 올라간다 */
      --tabbar-h: 60px;
    }

    i[data-lucide] { display: inline-flex; flex-shrink: 0; }

    /* 토스트는 시트보다 위, 상단에 띄운다 (하단은 시트가 덮음) */
    .toast-container { top: 104px; bottom: auto; z-index: 600; }

    /* ── 상단 바 ── */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-surface);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 52px;
    }
    .navbar-action {
      font-size: var(--fs-body); font-weight: var(--fw-medium);
      color: var(--color-text-muted); background: none; border: none;
      cursor: pointer; padding: 8px 0; min-width: 44px; font-family: var(--font-base);
      text-align: left;
    }
    .navbar-action.primary { color: var(--color-primary); font-weight: var(--fw-semibold); text-align: right; }
    .navbar-action.primary:disabled { color: var(--color-text-muted); opacity: 0.5; cursor: default; }
    .navbar-title { font-size: var(--fs-body-lg); font-weight: var(--fw-bold); color: var(--color-text); }

    /* ── 툴 칩 행 ── */
    .toolbar {
      display: flex; gap: 8px;
      padding: 0 16px 12px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar { display: none; }
    .tool-chip {
      display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
      height: 32px; padding: 0 12px; white-space: nowrap;
      border: 1px solid var(--color-border-subtle); background: var(--color-surface);
      border-radius: var(--r-full);
      font-family: var(--font-base); font-size: var(--fs-label); font-weight: var(--fw-medium);
      color: var(--color-text-sub); cursor: pointer;
    }
    .tool-chip svg { width: 14px; height: 14px; }
    .tool-chip.is-active {
      background: var(--color-surface-sub); border-color: transparent; color: var(--color-text);
    }
    .tool-chip:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── 캔버스 무대 (스크롤 영역 + 대화하기 버튼) ── */
    .stage {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      transition: transform var(--motion-standard) var(--ease-standard);
    }
    .scroll-area {
      flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 120px; scroll-behavior: smooth;
      background: var(--page-bg);
    }
    body.sheet-open .scroll-area { padding-bottom: 60vh; }

    /* 디자인 시트가 열리면 상단바를 감추고 캔버스를 축소해 페이지를 목업처럼 보여준다.
       transform을 .stage에 주면 안쪽의 .page-cta(position:fixed)도 함께 축소·클리핑된다. */
    body.design-open .navbar,
    body.design-open .toolbar { display: none; }
    /* 시트가 페이지를 덮고 있을 뿐이라는 인상을 주기 위해 목업을 시트 뒤까지 내리고
       아래쪽 라운딩을 없앤다. body가 overflow:hidden이라 넘치는 만큼은 잘린다. */
    body.design-open .stage {
      flex: none; height: 92vh; margin-top: 16px;
      transform: scale(0.6); transform-origin: top center;
      pointer-events: none; overflow: hidden;
      box-shadow: var(--shadow-3);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
    }
    body.design-open .scroll-area { overflow: hidden; padding-bottom: 0; }

    /* ── 커버 — 본문 블록이 아니라 페이지 배경. 이미지가 등록됐을 때만 렌더된다 ── */
    .head { background: var(--page-bg); position: relative; }
    body:not(.preview) .cover { cursor: pointer; }
    /* 커버가 없으면 편집 중에만 등록 슬롯을 둔다 — 미리보기·실제 페이지에는 아무것도 없다 */
    .cover-empty {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: calc(100% - 40px); height: 72px; margin: 8px 20px 0;
      border: 1px dashed var(--color-border); border-radius: var(--r-md);
      background: none; cursor: pointer; font-family: var(--font-base);
      font-size: var(--fs-label); font-weight: var(--fw-medium); color: var(--color-text-muted);
    }
    .cover-empty svg { width: 16px; height: 16px; }
    body.preview .cover-empty { display: none; }
    .cover {
      position: relative;
      aspect-ratio: 9 / 5;
      background-image: var(--cover-img, none);
      background-size: cover; background-position: center;
      background-color: var(--page-bg);
    }
    /* 페이드는 커버 배경에 합치지 않고 별도 오버레이로 얹는다.
       같은 요소에 이미지와 그라데이션을 겹치면 두 레이어가 각각 안티에일리어싱된 뒤
       합성되면서 하단 경계에 잔선이 남고, 화면 배율에 따라 보였다 안 보였다 한다.
       오버레이를 커버보다 2px 아래까지 내려 그 경계 자체를 덮는다. */
    .cover-fade {
      position: absolute; left: 0; right: 0; bottom: -2px; height: 64%;
      background: linear-gradient(to bottom, transparent 0%, var(--page-bg) 76%, var(--page-bg) 100%);
      pointer-events: none;
    }

    /* ── 섹션 카드 — 본문에 놓이는 모든 블록은 흰 카드 안에 들어간다 ── */
    .sec-card {
      width: 100%;
      display: flex; flex-direction: column; gap: 12px;
      padding: 22px 18px 24px;
      background: var(--color-surface);
      border-radius: var(--r-section);
      box-shadow: var(--shadow-1);
    }

    /* 카드 면 끄기 — 섹션이 면 없이 페이지 배경 위에 바로 놓인다 */
    body.surface-plain .sec-card:not(.pf-card) {
      background: none; box-shadow: none; border-radius: 0; padding: 22px 4px 24px;
    }

    /* ── 동그란 사진 레이아웃 — 명함 면 없이 사진과 이름만 ── */
    .pf-avatar-card { align-items: center; text-align: center; gap: 16px; background: none; box-shadow: none; }
    .pf-avatar-card.pf-center { align-items: center; }
    .pf-avatar { box-shadow: 0 0 0 4px var(--color-surface); }
    .pf-avatar-card .pf-info { align-items: center; }
    .pf-avatar-card .pf-name-row { flex-direction: column; align-items: center; gap: 4px; }
    .pf-avatar-card .pf-name { letter-spacing: var(--ls-title); }
    .pf-avatar-card .ct-list { align-items: center; }

    /* ── 프로필 블록 — 카드형 명함. 모서리를 더 작게, 그림자를 한 단계 강하게 ── */
    .pf-card {
      position: relative;
      aspect-ratio: 91 / 55; justify-content: space-between;
      padding: 22px 22px 20px; gap: 0;
      border-radius: var(--r-md); box-shadow: var(--shadow-lift);
    }
    /* 사진이 명함 앞면을 대신할 때는 사진이 카드를 꽉 채운다 */
    .pf-card.pf-photo-face { padding: 0; }
    /* 명함 한 장이 더 깔린 듯 아래로 비치는 종이 */
    .pf-card::after {
      content: ''; position: absolute; left: 14px; right: 14px; bottom: -8px; height: 14px;
      border-radius: 0 0 var(--r-md) var(--r-md);
      background: var(--color-card-stack); filter: blur(10px); pointer-events: none;
    }
    .pf-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .pf-card.pf-center .pf-top { justify-content: center; }
    .pf-photo { width: 54px; height: 54px; border-radius: var(--r-xs); object-fit: cover; display: block; flex-shrink: 0; }
    /* 대표 이미지는 명함 비율에 꽉 채워 자른다 — 실서비스는 올릴 때 자르기 창을 띄운다 */
    .pf-media { width: 100%; height: 100%; overflow: hidden; border-radius: var(--r-md); }
    .pf-media img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .pf-info { padding: 0; display: flex; flex-direction: column; }
    .pf-name-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .pf-card.pf-center .pf-name-row { justify-content: center; }
    .pf-card.pf-center .pf-info { align-items: center; text-align: center; }
    /* 세로 플렉스 안에서 늘어나지 않도록 — 로고는 카드 좌상단(가운데 정렬이면 가운데) */
    .pf-logo { display: block; height: 60px; width: auto; max-width: 108px; object-fit: contain; object-position: left center; }
    .pf-card.pf-center .pf-logo { object-position: center; }
    .pf-name {
      font-size: var(--fs-title); font-weight: var(--fw-bold);
      line-height: var(--lh-title); letter-spacing: var(--ls-namecard);
      color: var(--color-text);
    }
    .pf-name.is-empty { color: var(--color-text-muted); font-weight: var(--fw-medium); }
    .pf-role { font-size: var(--fs-badge); letter-spacing: var(--ls-namecard-sub); color: var(--color-text-muted); }

    /* 대화하기 버튼 (하단 고정 / 코너) — 프레임 안에 고정 */
    /* 하단 고정·코너 CTA는 실제 페이지의 요소다. 편집 chrome이 떠 있는 기본 화면에서는 감추고,
       미리보기와 디자인 목업(둘 다 body.preview)에서만 보여준다. 인라인은 블록이라 항상 보인다. */
    .page-cta {
      display: none;
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
      width: 100%; max-width: 430px; z-index: 80; pointer-events: none;
    }
    /* 하단 탭바가 실제 페이지에도 깔리므로 CTA는 탭바 위에서 시작한다 */
    .page-cta { bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
    body.preview .page-cta { display: block; }
    .cta-bar {
      padding: 12px 16px;
      background: linear-gradient(to top, var(--page-bg) 64%, transparent);
      pointer-events: auto;
    }
    .cta-fab {
      position: absolute; right: 16px; bottom: 16px;
      height: 56px; padding: 0 20px; border-radius: var(--r-full); border: none;
      background: var(--cta-fill); color: var(--cta-text, var(--color-on-primary));
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: var(--font-base); font-size: var(--fs-body-lg); font-weight: var(--fw-semibold);
      white-space: nowrap;
      box-shadow: var(--shadow-3); cursor: pointer; pointer-events: auto;
    }
    .cta-fab svg { width: 20px; height: 20px; }
    /* 하단바 · 프로필 안 블록에 공통으로 쓰는 대화하기 버튼 색 */
    .cta-btn { background: var(--cta-fill); color: var(--cta-text, var(--color-on-primary)); border: none; }

    /* ── 하단 앱 탭바 — 편집 캔버스 아래 고정. 미리보기에도 그대로 보인다 ── */
    .tabbar {
      flex-shrink: 0; z-index: 90;
      display: flex; align-items: stretch;
      height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
    }
    .tab-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; padding: 8px 4px;
      background: none; border: none; cursor: pointer;
      color: var(--color-text-muted); font-family: var(--font-base);
    }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-item.is-active { color: var(--color-primary); }
    .tab-item.is-active .tab-label { color: var(--color-primary); }

    /* ── 블록 캔버스 ── */
    .canvas { padding: 8px 0 0; position: relative; }

    .ins {
      display: flex; align-items: center; gap: 8px;
      width: 100%; height: 32px; padding: 0 44px;
      background: none; border: none; cursor: pointer;
    }
    .ins-line { flex: 1; height: 0; border-top: 1px dashed var(--color-border); }
    .ins-plus {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: var(--r-full);
      background: var(--color-surface);
      color: var(--color-text-muted); flex-shrink: 0;
    }
    .ins-plus svg { width: 14px; height: 14px; }
    .ins:hover .ins-plus { color: var(--color-primary); }

    /* 세로 여백을 모든 블록에 동일하게 32px. 짧은 블록만 커지던 min-height 대신
       .block-body 최소 높이로 레일(112px) 자리를 확보한다 → 삽입선까지 거리가 항상 같다 */
    .block { display: flex; align-items: center; padding: 32px 44px; position: relative; }
    .block.is-hidden .block-body { opacity: 0.4; }
    .block.is-dragging .block-body { opacity: 0.4; }

    .drop-line {
      position: absolute; left: 44px; right: 44px; height: 2px;
      background: var(--color-primary); border-radius: var(--r-full);
      pointer-events: none; z-index: 4;
    }
    body.dragging { -webkit-user-select: none; user-select: none; }

    /* 좌측 레일 — 아이콘은 작게, 탭 영역은 44px */
    .rail {
      position: absolute; right: 0; top: 0; bottom: 0; width: 44px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .rail-btn {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; padding: 0;
      background: none; border: none; cursor: pointer;
      color: var(--color-text-muted);
    }
    .rail-btn svg { width: 20px; height: 20px; }
    .rail-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .rail-grip {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 24px; color: var(--color-border); cursor: grab;
      touch-action: none;
    }
    .rail-grip svg { width: 16px; height: 16px; }

    .block-body {
      flex: 1; min-width: 0; position: relative; min-height: 48px;
      display: flex; flex-direction: column; justify-content: center; gap: 12px;
    }
    /* 블록을 편집하는 동안 나머지는 흐리게 뒤로 물려 편집 대상만 또렷하게 남긴다.
       활성 블록에 테두리를 두르지 않으므로 페이지 배경색이 무엇이든 영향받지 않는다. */
    .head,
    .canvas > * {
      transition: opacity var(--motion-standard) var(--ease-standard),
                  filter var(--motion-standard) var(--ease-standard);
    }
    body.editing .head:not(.is-active),
    body.editing .canvas > *:not(.block.is-active) {
      opacity: 0.4; filter: blur(var(--blur-dim));
    }
    .block-tag  { position: absolute; top: -20px; left: 0; z-index: 2; }

    /* ── 빈 캔버스 안내 ── */
    .canvas-empty {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; padding: 48px 24px;
    }
    .canvas-empty-t { font-size: var(--fs-title); font-weight: var(--fw-bold); color: var(--color-text); letter-spacing: var(--ls-title); }
    .canvas-empty-s { font-size: var(--fs-body); color: var(--color-text-muted); margin-bottom: 12px; }
    .canvas-empty .btn svg { width: 18px; height: 18px; }
    body.preview .canvas-empty { display: none; }

    /* ── About 블록 ── */
    .text-block { width: 100%; text-align: left; background: none; border: none; cursor: pointer; font-family: var(--font-base); }
    .text-block .text-p { font-size: var(--fs-body-lg); line-height: var(--lh-body-lg); color: var(--color-text); white-space: pre-wrap; }

    /* 아이콘이 많아지면 거터를 넘지 않고 블록 열 안에서 가로로 잘린다 (이벤트 캐러셀과 동일) */
    .sns-block {
      display: flex; justify-content: center; gap: 12px; width: 100%; background: none; border: none;
      padding: 4px 0; cursor: pointer;
      overflow-x: auto; scrollbar-width: none;
    }
    .sns-block::-webkit-scrollbar { display: none; }
    body.balign-center .sns-block { justify-content: center; }
    body.balign-center .text-block .text-p,
    body.balign-center .lp-section-title { text-align: center; }
    body.balign-center .lp-star-row { justify-content: center; }
    /* SNS 타일 — 브랜드 마크는 인라인 SVG(fill=currentColor)로 그린다 */
    .sns-tile {
      width: 48px; height: 48px; border-radius: var(--r-tile);
      background: var(--color-text);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .sns-tile-ico {
      width: 20px; height: 20px; display: block;
      color: var(--color-on-primary);
    }
    .sns-tile-ico svg { width: 100%; height: 100%; display: block; }
    .sns-add {
      width: 48px; height: 48px; border-radius: var(--r-tile);
      border: 1.5px dashed var(--color-border); color: var(--color-text-muted);
      background: transparent; display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer;
    }
    .sns-add svg { width: 16px; height: 16px; }

    /* ── 연락처 블록 — [라벨] ........ [값] ↗ ── */
    .ct-list { width: 100%; display: flex; flex-direction: column; gap: 4px; }
    .pf-card .ct-list { margin-top: 12px; }
    .ct-row { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .pf-card.pf-center .ct-row { justify-content: center; }
    .ct-k { font-size: var(--fs-caption); color: var(--color-text-muted); flex-shrink: 0; }
    .ct-v {
      min-width: 0; font-size: var(--fs-caption); color: var(--color-text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ── 링크 모음 블록 ── */
    .ib-list { width: 100%; display: flex; flex-direction: column; }
    .ib-card {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 0; border-bottom: 1px solid var(--color-line-warm);
    }
    .ib-card:last-child { border-bottom: none; }
    .ib-text { min-width: 0; }
    .ib-title { font-size: var(--fs-body); color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ib-title.is-ph { color: var(--color-text-muted); }
    .ib-chev { display: inline-flex; color: var(--color-text-warm-sub); flex-shrink: 0; }
    .ib-chev svg { width: 16px; height: 16px; }

    /* ══════════════════════════════════════════════════════════
       컬렉션 블록 — screens/board.html 원본 마크업·스타일 그대로.
       방문자 화면과 UI가 갈리면 안 되므로 전역 모서리(--card-radius)
       설정의 영향을 받지 않고 board.html의 radius를 고정으로 쓴다.
       ══════════════════════════════════════════════════════════ */
    .lp-section-title { font-weight: var(--fw-bold); font-size: var(--fs-body); color: var(--color-text); }
    /* 컬렉션 전체보기 — 탭을 꺼도 별도 화면으로 들어갈 수 있는 진입점.
       콘텐츠 정렬과 무관하게 섹션 우측 하단에 고정한다. */
    .lp-more {
      align-self: flex-end;
      display: inline-flex; align-items: center;
      height: auto; padding: 12px 0 0; gap: 4px;
      background: none; border: none; cursor: pointer; font-family: var(--font-base);
      font-size: var(--fs-caption); color: var(--color-text-warm-sub);
    }

    /* ── 이벤트: 가로 배너 캐러셀 ── */
    .lp-banner-section { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .lp-banner-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .lp-banner-scroll::-webkit-scrollbar { display: none; }
    .lp-banner-card {
      flex: 0 0 200px; min-width: 0;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      font-family: var(--font-base);
    }
    .lp-banner-img {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: var(--r-md);
      background: var(--color-line-warm);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .lp-banner-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lp-banner-text { padding: 12px 0 0; display: flex; flex-direction: column; gap: 4px; }
    .lp-banner-title + .lp-banner-date,
    .lp-banner-title + .lp-banner-desc { margin-top: 4px; }
    .lp-banner-title {
      font-size: var(--fs-body-lg);
      font-weight: var(--fw-semibold);
      color: var(--color-text);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lp-banner-desc {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lp-banner-desc.lp-banner-desc-1 { -webkit-line-clamp: 1; }
    .lp-banner-applicants {
      display: flex;
      align-items: center;
      gap: 4px;
      line-height: 1.3;
      overflow: hidden;
    }
    .lp-banner-img .lp-banner-applicants {
      position: absolute;
      bottom: 8px;
      left: 8px;
      z-index: 1;
      padding: 4px 8px;
      border-radius: var(--r-full);
      background: var(--color-surface-glass);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: var(--shadow-1);
    }
    .lp-banner-img .lp-banner-count { color: var(--color-text); }
    .lp-banner-avatars { display: inline-flex; align-items: center; }
    .lp-banner-avatars .avatar {
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--color-surface);
      margin-left: -8px;
      background: var(--color-surface-sub);
      overflow: hidden;
    }
    .lp-banner-avatars .avatar:first-child { margin-left: 0; }
    .lp-banner-avatars .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .lp-banner-count {
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lp-banner-count b { font-weight: var(--fw-semibold); }
    .lp-banner-date {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--fs-caption);
      color: var(--color-text-muted);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lp-banner-date i[data-lucide],
    .lp-banner-date svg { width: 12px; height: 12px; }

    /* ── 게시판: 카드로 묶인 리스트 ── */
    .lp-post-section { width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .lp-post-list { width: 100%; }
    .lp-post { display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px 0; border-bottom: 1px solid var(--color-line-warm); cursor: pointer; }
    .lp-post:last-child { border-bottom: none; }
    .lp-post-img { width: 48px; height: 48px; align-self: center; margin: 0; border-radius: var(--r-sm); overflow: hidden; flex-shrink: 0; background: var(--color-bg); display: flex; align-items: center; justify-content: center; order: 2; }
    .lp-post-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lp-post-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0; min-width: 0; }
    .lp-post-tags { display: flex; gap: 8px; align-items: center; }
    .lp-post-title { font-size: var(--fs-body); line-height: var(--lh-body); color: var(--color-text); }
    .lp-post-date { font-size: var(--fs-badge); color: var(--color-text-warm-faint); }

    /* ── 리뷰: 별점 요약 + 가로 텍스트 카드 ── */
    .lp-review-section { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .lp-star-row { display: flex; align-items: baseline; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--color-line-warm); }
    .lp-star-stars { display: inline-flex; gap: 2px; }
    .lp-star-count { margin-left: auto; }
    .lp-star-row i[data-lucide],
    .lp-star-row svg { width: 14px; height: 14px; color: var(--color-star); fill: var(--color-star); }
    .lp-star-rate { font-size: var(--fs-metric); font-weight: var(--fw-bold); color: var(--color-text); }
    .lp-star-count { font-size: var(--fs-caption); color: var(--color-text-muted); }
    .lp-review-cards { display: flex; flex-direction: column; width: 100%; }
    .lp-review-card { width: 100%; padding: 16px 0; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--color-line-warm); }
    .lp-review-card:last-child { border-bottom: none; }
    .lp-review-top { display: flex; justify-content: space-between; align-items: center; }
    .lp-review-date { font-size: var(--fs-nav); color: var(--color-text-warm-faint); }
    .lp-review-stars { display: inline-flex; gap: 2px; }
    .lp-review-stars svg { width: 12px; height: 12px; color: var(--color-star); fill: currentColor; }
    .lp-review-stars svg.is-off { color: var(--color-star-empty); }
    .lp-review-text { font-size: var(--fs-label); color: var(--color-text); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .lp-review-meta { font-size: var(--fs-badge); color: var(--color-text-warm-sub); }

    /* ── 갤러리: board.html 원본 (격자 gap 2px는 board.html 값 그대로) ── */
    .lp-gallery-section { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .lp-gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .lp-gallery-cell {
      position: relative; aspect-ratio: 4 / 5; overflow: hidden;
      background: var(--color-surface-sub); border: none; padding: 0; cursor: pointer;
    }
    .lp-gallery-cell img,
    .lp-gallery-cell video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lp-gallery-cell-icon {
      position: absolute; top: 8px; right: 8px;
      width: 16px; height: 16px;
      color: var(--color-on-primary); fill: currentColor;
      filter: drop-shadow(0 1px 2px var(--color-scrim));
    }
    .lp-gallery-carousel { display: flex; gap: 8px; overflow-x: auto; width: 100%; padding-bottom: 4px; scrollbar-width: none; }
    .lp-gallery-carousel::-webkit-scrollbar { display: none; }
    .lp-gallery-carousel .lp-gallery-cell { flex: 0 0 auto; width: 150px; aspect-ratio: 4 / 5; border-radius: var(--r-md); }
    /* 세로 — 전체 폭 이미지를 위아래로 쌓는다 */
    .lp-gallery-stack { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .lp-gallery-stack .lp-gallery-cell { width: 100%; aspect-ratio: 4 / 3; border-radius: var(--r-md); }

    .gal-empty {
      width: 100%; border: 1.5px dashed var(--color-border); border-radius: var(--r-md);
      padding: 24px; display: flex; align-items: center; justify-content: center;
      color: var(--color-text-muted);
    }
    .gal-empty svg { width: 24px; height: 24px; }


    .coll-empty {
      border: 1.5px dashed var(--color-border); border-radius: var(--r-md);
      padding: 24px 16px; text-align: center;
      font-size: var(--fs-body); color: var(--color-text-muted);
    }

    /* ── 미리보기 모드 ── */
    body.preview .rail,
    body.preview .ins,
    body.preview .block-tag,
    body.preview .block.is-hidden { display: none; }
    body.preview .block.is-empty-coll { display: none; }
    body.preview .block { padding: 0 16px; }
    body.preview .block-body { min-height: 0; }
    /* 카드 사이는 간격만으로 구획된다 (구분선 블록이 없다) */
    body.preview .canvas { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }

    /* ── 레이어 (시트 / 전체화면 / 다이얼로그) ── */
    .layer {
      position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px; z-index: 500; pointer-events: none;
    }
    .layer.on { pointer-events: auto; }
    .layer-slide { overflow: hidden; }
    .layer.layer-nodim, .layer.layer-nodim.on { pointer-events: none; }
    .layer-nodim .bottom-sheet { pointer-events: auto; }

    .layer .bottom-sheet-overlay { opacity: 0; pointer-events: none; transition: opacity var(--motion-standard) var(--ease-enter); }
    .layer.on .bottom-sheet-overlay { opacity: 1; pointer-events: auto; }
    .layer .bottom-sheet { transform: translateY(100%); transition: transform var(--motion-standard) var(--ease-enter); }
    .layer.on .bottom-sheet { transform: translateY(0); }

    .layer .dialog-overlay { opacity: 0; pointer-events: none; transition: opacity var(--motion-standard) var(--ease-enter); }
    .layer.on .dialog-overlay { opacity: 1; pointer-events: auto; }

    #layer-snspick { z-index: 520; }
    #layer-autofill { z-index: 520; }
    .autofill-actions { display: flex; flex-direction: column; gap: 8px; }
    #layer-name    { z-index: 540; }
    #layer-confirm { z-index: 560; }

    .sheet-panel {
      display: flex; flex-direction: column;
      padding: 8px 0 0;
      max-height: 88%;
    }
    .sheet-half { height: 52%; }
    .sheet-tall { height: 64%; }

    .sheet-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 4px 20px 12px; border-bottom: 1px solid var(--color-border);
    }
    .sheet-head-title { font-size: var(--fs-body-lg); font-weight: var(--fw-bold); color: var(--color-text); }
    .sheet-action {
      background: none; border: none; cursor: pointer; font-family: var(--font-base);
      font-size: var(--fs-body); font-weight: var(--fw-medium); color: var(--color-text-muted);
      padding: 8px 0; min-width: 44px; text-align: left;
    }
    .sheet-action.primary { color: var(--color-text); font-weight: var(--fw-semibold); text-align: right; }
    .sheet-body { flex: 1; overflow-y: auto; padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); }

    /* 시트 내부 폼 */
    .field-label { margin: 12px 0 8px; }
    .field-label:first-child { margin-top: 0; }
    .opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .opt {
      flex: 1 1 0; min-width: 80px; height: 40px; padding: 0 12px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--color-border-subtle); background: var(--color-surface);
      border-radius: var(--r-sm); cursor: pointer; font-family: var(--font-base);
      font-size: var(--fs-label); font-weight: var(--fw-medium); color: var(--color-text-sub);
    }
    .opt.is-active { border-color: transparent; background: var(--color-surface-sub); color: var(--color-text); font-weight: var(--fw-semibold); }
    .opt svg { width: 16px; height: 16px; }
    .opt-row-2 .opt { flex: 0 0 calc(50% - 4px); }

    .switch-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 12px 0;
    }
    .switch-label { font-size: var(--fs-body-lg); font-weight: var(--fw-medium); color: var(--color-text); }

    /* [라벨] ......... [AI 학습 (토글)] — 항목별·블록 단위 AI 학습 공통 행 */
    .label-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin: 12px 0 8px;
    }
    .label-row:first-child { margin-top: 0; }
    .label-row .field-label { margin: 0; }
    .ai-toggle { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .ai-toggle-label { font-size: var(--fs-caption); color: var(--color-text-sub); }
    /* 여러 항목이 있는 블록은 항목 안에서만 간격을 갖는다 (리스트 간격은 부모가 담당) */
    /* padding-right 는 아래 줄 끝의 삭제 버튼(32px + gap 8px)만큼 당겨
       AI 학습 토글이 인풋 오른쪽 끝에 맞도록 하는 값 */
    .sns-edit-item .label-row,
    .kv-item .label-row { margin: 0 0 8px; padding-right: 40px; }

    .sheet-divider { height: 1px; background: var(--color-border); margin: 12px 0; border: none; }

    /* 리치 텍스트 — 툴바와 입력 영역을 한 판으로 묶고 글자수는 안쪽 우하단에 */
    .rt { margin-top: 12px; border: 1px solid var(--color-border); border-radius: var(--r-sm); overflow: hidden; }
    .rt-bar { display: flex; gap: 4px; padding: 8px 12px; background: var(--color-surface-sub); border-bottom: 1px solid var(--color-border); }
    .rt-body { position: relative; background: var(--color-surface); }
    .rt-area {
      min-height: 96px; max-height: 240px; overflow-y: auto;
      padding: 12px 16px 32px;
      font-family: var(--font-base); font-size: var(--fs-body-lg);
      line-height: var(--lh-body-lg); color: var(--color-text); outline: none;
    }
    .rt-area:empty::before { content: attr(data-ph); color: var(--color-text-muted); }
    .rt-count { position: absolute; right: 16px; bottom: 8px; font-size: var(--fs-caption); color: var(--color-text-muted); pointer-events: none; }

    .goto-full {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; height: 48px; padding: 0 16px; margin: 12px 0 4px;
      background: var(--color-surface-strong); border: none; border-radius: var(--r-sm);
      color: var(--color-text); font-family: var(--font-base);
      font-size: var(--fs-body-lg); font-weight: var(--fw-semibold); cursor: pointer;
    }
    .goto-full svg { width: 16px; height: 16px; }

    /* SNS 편집 행 */
    .sns-edit-list { display: flex; flex-direction: column; gap: 20px; margin-bottom: 16px; }
    .sns-edit-row { display: flex; align-items: center; gap: 8px; }
    .sns-edit-row .id-field { flex: 1; min-width: 0; }
    .id-field {
      display: flex; align-items: center;
      border: 1px solid var(--color-input); border-radius: var(--r-sm);
      background: var(--color-surface); padding-left: 12px;
    }
    .id-field .id-prefix { font-size: var(--fs-body-lg); color: var(--color-text-muted); flex-shrink: 0; }
    .id-field .input { border: none; background: none; padding-left: 4px; flex: 1; min-width: 0; }
    /* 편집 행은 인풋 높이(40px)에 맞춘다 — 타일 모양·색은 캔버스와 동일 */
    .sns-edit-row .sns-tile { width: 40px; height: 40px; }
    .sns-edit-row .sns-tile-ico { width: 22px; height: 22px; }
    .sns-edit-list + .sns-add { width: 40px; height: 40px; }

    /* 리스트형 편집 행 (링크 모음) */
    .kv-item { margin-bottom: 12px; }
    .kv-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .kv-row .kv-v { flex: 1; min-width: 0; }

    /* 이미지 업로드 행 / 썸네일 관리 */
    .pick-wrap { display: flex; align-items: center; gap: 8px; }
    /* 이미지 등록 행이 연달아 놓일 때 서로 붙지 않게 */
    .pick-row + .pick-row,
    .pick-row + .pick-wrap,
    .pick-wrap + .pick-row,
    .pick-wrap + .pick-wrap { margin-top: 8px; }
    .pick-wrap .pick-row { flex: 1; min-width: 0; }
    .pick-row {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 12px; background: var(--color-surface);
      border: 1px solid var(--color-border-subtle); border-radius: var(--r-sm);
      cursor: pointer; font-family: var(--font-base);
    }
    .pick-label { flex: 1; text-align: left; font-size: var(--fs-body-lg); font-weight: var(--fw-medium); color: var(--color-text); }
    .pick-more { font-size: var(--fs-body); font-weight: var(--fw-medium); color: var(--color-text-muted); flex-shrink: 0; }
    .pick-row > svg { width: 16px; height: 16px; color: var(--color-text-muted); }
    .pick-thumb {
      width: 40px; height: 40px; border-radius: var(--r-xs); object-fit: cover;
      background: var(--color-surface-sub); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; color: var(--color-text-muted);
    }
    .pick-thumb svg { width: 18px; height: 18px; }

    .pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .pick-cell {
      aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden;
      border: 2px solid transparent; background: var(--color-surface-sub);
      padding: 0; cursor: pointer;
    }
    .pick-cell:disabled { opacity: 0.3; cursor: not-allowed; }
    .pick-cell.pick-sns { background: var(--color-surface-sub); display: flex; align-items: center; justify-content: center; }
    .pick-cell.pick-sns .sns-tile-ico { width: 32px; height: 32px; }

    .thumb-manage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .thumb-item { position: relative; aspect-ratio: 1; border-radius: var(--r-sm); overflow: hidden; background: var(--color-surface-sub); }
    .thumb-item img,
    .thumb-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-item .lp-gallery-cell-icon { top: auto; right: auto; bottom: 8px; left: 8px; }
    .thumb-del {
      position: absolute; top: 4px; right: 4px;
      width: 24px; height: 24px; border-radius: var(--r-full); border: none;
      background: var(--color-scrim); color: var(--color-on-primary);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .thumb-del svg { width: 14px; height: 14px; }
    .thumb-add {
      aspect-ratio: 1; border-radius: var(--r-sm); cursor: pointer;
      border: 1.5px dashed var(--color-border); background: var(--color-surface);
      color: var(--color-text-muted); display: flex; align-items: center; justify-content: center;
    }
    .thumb-add svg { width: 20px; height: 20px; }

    /* 디자인 시트 탭 */
    .tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--color-border); }
    .tab {
      flex: 1; height: 44px; background: none; border: none; cursor: pointer;
      font-family: var(--font-base); font-size: var(--fs-body); font-weight: var(--fw-medium);
      color: var(--color-text-muted); border-bottom: 2px solid transparent;
    }
    .tab.is-active { color: var(--color-text); font-weight: var(--fw-semibold); border-bottom-color: var(--color-text); }

    /* 색상 스와치 — 프리셋 + 컬러피커(마지막 칸) */
    .swatch-row { display: flex; gap: 8px; }
    /* 크기 고정 — 행의 항목 수가 달라도 원 크기가 같아야 한다 (남는 공간은 오른쪽 여백) */
    .swatch {
      position: relative; flex: 0 0 40px; width: 40px; aspect-ratio: 1;
      border-radius: var(--r-full); border: 1px solid var(--color-border-subtle);
      cursor: pointer; padding: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      color: var(--color-text-muted);
    }
    .swatch.is-active { border-color: var(--color-text-muted); box-shadow: inset 0 0 0 2px var(--color-surface); border-width: 2px; }
    .swatch svg { width: 16px; height: 16px; }
    .swatch-pick { border-style: dashed; }
    .swatch-pick input[type="color"] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; border: none; padding: 0; cursor: pointer;
    }

    /* ── 목업 옵션 카드 ── */
    .mock-row { display: grid; gap: 8px; }
    .mock-row-2 { grid-template-columns: repeat(2, 1fr); }
    .mock-row-3 { grid-template-columns: repeat(3, 1fr); }
    .mock-row-4 { grid-template-columns: repeat(4, 1fr); }

      background: var(--color-surface); border: 1px solid var(--color-border);

    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cat-cell {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      height: 88px; padding: 0 12px;
      background: var(--color-surface); border: 1px solid var(--color-border-subtle);
      border-radius: var(--r-md); cursor: pointer;

    .url-prev-v { font-size: var(--fs-caption); color: var(--color-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .url-field {

  /* ============================================================

     ============================================================ */
  let toastTimer = null;
  function toast(msg, actLabel, cb) {
    const c = $('toasts');
    c.innerHTML = '<div class="toast' + (actLabel ? ' toast-with-action' : '') + '"><span>' + esc(msg) + '</span>'
      + (actLabel ? '<button class="toast-action" id="toast-act">' + esc(actLabel) + '</button>' : '') + '</div>';
    if (actLabel) $('toast-act').onclick = () => { c.innerHTML = ''; cb(); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { c.innerHTML = ''; }, actLabel ? 4000 : 2000);

  /* ============================================================

  /* 대화하기 버튼을 '프로필 안'으로 두면 blocks에 가상 블록으로 들어가 순서를 옮길 수 있다.
     다른 위치로 바꾸면 직전 위치를 기억해 두고 빠진다. */
  const CHAT_ID = -1;
  let chatAt = 0;
  function syncChatBlock() {
    const i = blocks.findIndex(b => b.kind === 'chat');
    if (T.chat === 'inline') {
      if (i < 0) blocks.splice(Math.min(chatAt, blocks.length), 0, { id: CHAT_ID, kind: 'chat', visible: true });
    } else if (i >= 0) {
      chatAt = i;
      blocks.splice(i, 1);
    }
  }

  /* 링크 모음 카드는 페이지 배경색에서 파생시켜 어떤 테마에서도 어울리게 한다.
     밝은 배경이면 살짝 어둡게, 어두운 배경이면 살짝 밝게 — 색상(hue)은 그대로 유지된다. */
  function render() {
    document.body.style.setProperty('--page-bg', pageBgValue());
    document.body.style.setProperty('--cta-fill', ctaFillValue());
    document.body.style.setProperty('--cta-text', ctaTextValue());
    document.body.style.setProperty('--page-text', pageTextValue());
    document.body.style.setProperty('--cta-solid', ctaSolidValue());
    document.body.style.setProperty('--btn-radius', SHAPE[T.shape]);
    document.body.style.setProperty('--card-radius', CARD_SHAPE[T.shape]);
    document.body.style.setProperty('--block-shadow', SHADOW[T.shadow]);
    document.body.classList.toggle('balign-center', T.balign === 'center');
    document.body.classList.toggle('surface-plain', T.surface === 'plain');
    document.body.classList.toggle('editing', activeId !== null);
    $('head').classList.toggle('is-active', activeId === COVER_ID);

    syncChatBlock();
    renderHead();
    snapCoverHeight();
    renderCta();

    const canvas = $('canvas');
    canvas.innerHTML = '';
    if (blocks.length === 0) {
      canvas.appendChild(emptyCanvas());
    } else {
      blocks.forEach((b, i) => {
        canvas.appendChild(insertRow(i));
        canvas.appendChild(blockRow(b, i));
      });
      canvas.appendChild(insertRow(blocks.length));
      /* 사진·이름·대화하기·탭만 있는 상태는 여전히 '빈 페이지'다 */
      if (!blocks.some(b => CHROME_KINDS.indexOf(b.kind) < 0)) canvas.appendChild(emptyCanvas());
    }
    icons();
  }

  /* aspect-ratio 는 9:5 를 소수점 높이(예: 230.55px)로 만들고, 그 반픽셀 경계에서
     배경 이미지 하단이 안티에일리어싱되어 가로줄처럼 보인다. 높이를 정수로 스냅한다. */
  function snapCoverHeight() {
    const cv = document.querySelector('.cover');
    if (!cv || !cv.parentElement) return;
    /* offsetWidth 는 레이아웃 폭이라 디자인 목업의 scale() 에 영향받지 않는다.
       높이를 명시하면 aspect-ratio 가 남아 있을 때 너비를 비율에서 역산하므로 함께 끈다. */
    const w = cv.parentElement.offsetWidth;
    if (!w) return;
    cv.style.aspectRatio = 'auto';
    cv.style.height = Math.round(w * 5 / 9) + 'px';
  }
  /* 창 크기뿐 아니라 시트 열림·스크롤바 유무로도 폭이 바뀌므로 레이아웃 변화를 직접 관찰한다.
     폭만 읽고 높이만 바꾸므로 관찰 루프는 생기지 않는다. */
  if (window.ResizeObserver) new ResizeObserver(snapCoverHeight).observe($('head'));
  else window.addEventListener('resize', snapCoverHeight);

  /* 커버는 등록된 이미지가 있을 때만 렌더한다 — 없으면 블록이 화면 맨 위에서 시작한다 */
  function renderHead() {
    const h = $('head');
    if (!P.cover) {
      h.innerHTML = '<button class="cover-empty" data-cover><i data-lucide="image"></i>배경 사진</button>';
      return;
    }
    h.innerHTML =
      '<div class="cover" data-cover style="--cover-img:url(\'' + P.cover + '\')">'
      + (T.coverEdge === 'fade' ? '<span class="cover-fade"></span>' : '')
      + '</div>';
  }

  /* 세 위치가 같은 대화하기 버튼을 쓴다 (색은 --cta-fill) */
  function chatBtn() {
    return '<button class="btn btn-lg btn-block cta-btn">'
      + '<i data-lucide="message-circle" style="width:18px;height:18px"></i>' + esc(T.ctaLabel) + '</button>';
  }

  function renderCta() {
    const c = $('page-cta');
    if (T.chat === 'bottom') {
      c.innerHTML = '<div class="cta-bar">' + chatBtn() + '</div>';
    } else if (T.chat === 'corner') {
      c.innerHTML = '<button class="cta-fab"><i data-lucide="message-circle"></i>' + esc(T.ctaLabel) + '</button>';
    } else {
      c.innerHTML = '';
    }
  }

  function emptyCanvas() {
    const el = document.createElement('div');

      + '<p class="canvas-empty-s">블록을 추가해서 페이지를 채워보세요</p>'
      + '<button class="btn btn-lg btn-fill-primary"><i data-lucide="plus"></i>블록 추가</button>';
    el.querySelector('.btn').onclick = () => openCatalog(0);
    return el;
  }

  function insertRow(i) {
    const el = document.createElement('button');
    el.className = 'ins';
    el.innerHTML = '<span class="ins-line"></span><span class="ins-plus"><i data-lucide="plus"></i></span><span class="ins-line"></span>';

  /* 미리보기에서 숨길 "내용이 비어 있는" 블록 */
  function isEmptyBlock(b) {
    if (b.kind === 'profile') return !(P.hero || P.logo || P.photo || P.name || P.role);
    if (isColl(b.kind)) return b.items.length === 0;
    if (b.kind === 'gallery') return b.items.length === 0;
    if (b.kind === 'info') return !b.links.some(l => l.title || l.url);
    return false;

  function blockRow(b, i) {
    const el = document.createElement('div');
    el.className = 'block'
      + (b.id === activeId ? ' is-active' : '')
      + (b.visible ? '' : ' is-hidden')
      + (isEmptyBlock(b) ? ' is-empty-coll' : '');
