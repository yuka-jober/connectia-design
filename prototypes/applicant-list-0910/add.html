<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>참석자 등록 — 26년 청춘건배</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-base);
    background: var(--color-scrim);
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: var(--color-banner-gradient);
  }
  i[data-lucide] { display: inline-flex; flex-shrink: 0; }
  svg.lucide { flex-shrink: 0; }

  .modal {
    width: 100%;
    max-width: 1280px;
    height: 90vh;
    background: var(--color-surface);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-4);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  @media (max-width: 767px) {
    body { padding: 0; }
    .modal { max-width: none; height: 100dvh; border-radius: 0; }
  }

  .head {
    flex-shrink: 0;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }
  .head-top {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 20px 12px;
  }
  .head-title {
    font-size: var(--fs-title); font-weight: var(--fw-bold);
    letter-spacing: var(--ls-title); color: var(--color-text);
    margin-right: auto;
  }
  .head-tools { display: flex; align-items: center; gap: 4px; }
  .head-tools .icon-btn i[data-lucide],
  .head-tools .icon-btn svg.lucide { width: 18px; height: 18px; }

  /* ── 본문 — 긴 폼이라 가운데 한 단으로 세운다 ── */
  .body {
    flex: 1; overflow-y: auto;
    background: var(--color-bg);
    padding: 24px 20px 32px;
  }
  .sheet {
    width: 100%; max-width: 720px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 16px;
  }

  .group {
    background: var(--color-surface);
    border-radius: var(--r-md);
    padding: 20px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .group-head { display: flex; align-items: center; gap: 8px; }
  .group-name {
    font-size: var(--fs-title-sm); line-height: var(--lh-title-sm);
    letter-spacing: var(--ls-title-sm);
    font-weight: var(--fw-bold); color: var(--color-text);
  }
  .group-head .btn { margin-left: auto; }

  .field { display: flex; flex-direction: column; gap: 8px; }
  .field .label { display: block; }

  /* 예·아니오, 동의 — 보기가 둘뿐이라 나란히 둔다 */
  .choices { display: flex; flex-wrap: wrap; gap: 20px; }
  .choice {
    display: flex; align-items: center; gap: 8px;
    font-size: var(--fs-label); color: var(--color-text);
    cursor: pointer;
  }

  /* ── 자리 우선순위 — 누른 차례가 순위가 된다 ── */
  .ranks { display: flex; flex-wrap: wrap; gap: 8px; }
  .rank {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--r-full);
    background: var(--color-surface);
    font-family: var(--font-base);
    font-size: var(--fs-caption); color: var(--color-text-sub);
    cursor: pointer;
  }
  .rank:hover { border-color: var(--color-text-muted); }
  .rank.is-picked {
    border-color: var(--color-primary);
    background: var(--color-primary-subtle);
    color: var(--color-text);
  }
  .rank-no {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px;
    border-radius: var(--r-full);
    background: var(--color-primary); color: var(--color-on-primary);
    font-size: var(--fs-badge); font-style: normal; font-weight: var(--fw-bold);
  }

  /* ── 노출 프로필 사진 ── */
  .photo { display: flex; align-items: center; gap: 16px; }
  .photo-frame {
    width: 88px; height: 88px; flex-shrink: 0;
    border-radius: var(--r-md);
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-frame i[data-lucide], .photo-frame svg.lucide {
    width: 24px; height: 24px; color: var(--color-text-muted);
  }
  .photo-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .photo-name {
    font-size: var(--fs-caption); color: var(--color-text-sub);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .photo-acts { display: flex; gap: 8px; }

  /* ── 팀원 ── */
  .people { display: flex; flex-direction: column; gap: 12px; }
  .person {
    background: var(--color-bg);
    border-radius: var(--r-md);
    padding: 16px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .person-top { display: flex; align-items: center; gap: 8px; }
  .person-name { font-size: var(--fs-body); font-weight: var(--fw-bold); color: var(--color-text); }
  .person-top .icon-btn { margin-left: auto; }
  .person-top .icon-btn i[data-lucide], .person-top .icon-btn svg.lucide { width: 16px; height: 16px; }

  /* ── 바닥 — 늘 보이는 저장 줄 ── */
  .foot {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    padding: 12px 20px;
    background: var(--color-surface);
    border-top: 1px solid var(--color-border);
  }
  @media (max-width: 767px) {
    .foot .btn { flex: 1; }
  }

  .toast-container { position: fixed; bottom: 32px; z-index: 200; }
</style>

<body>

<div class="modal">
  <div class="head">
    <div class="head-top">
      <span class="head-title" id="title">참석자 등록</span>
      <div class="head-tools">
        <button class="icon-btn icon-btn-sm icon-btn-clear" type="button" aria-label="닫기" onclick="leave()">
          <i data-lucide="x"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="body">
    <form class="sheet" id="sheet" onsubmit="return save(event)"></form>
  </div>

  <div class="foot">
    <button type="button" class="btn btn-md btn-line-dark" onclick="leave()">취소</button>
    <button type="button" class="btn btn-md btn-fill-primary" id="submit" onclick="save(event)">등록</button>
  </div>
</div>

<input type="file" id="photo-input" accept="image/*" hidden onchange="tookPhoto(this)">

<div class="toast-container" id="toast-container"></div>

    ],
    person: null
  }
};

/* 신청폼에 적힌 질문에서 (대표자) (선택) 같은 앞말을 떼면 같은 항목이 된다 */
function key(label) { return String(label).replace(/^\([^)]*\)\s*/, ''); }
function answer(list, label) {
  var hit = (list || []).filter(function(f){ return key(f[0]) === label; })[0];
  return hit && !Array.isArray(hit[1]) ? String(hit[1] || '') : '';
}

/* ════════════════════════════════════════════
   상태
   ════════════════════════════════════════════ */

var editing = null;
var form = { type: 'grad', team: {}, people: [], slot: '', ranks: [], photo: null };

function slotName(id) {
  var s = SLOTS.filter(function(x){ return x.id === id; })[0];
  return s ? s.name : '미배정';
}

function load(id) {
  var a = APPLICANTS.filter(function(x){ return x.id === id; })[0];
  if (!a) return;
  editing = a;
  form.type = a.type;
  form.slot = a.slot || '';
  var ranks = (a.fields || []).filter(function(f){ return f[2] === 'ranks'; })[0];
  form.ranks = ranks && Array.isArray(ranks[1])
    ? ranks[1].map(function(n){ return (SLOTS.filter(function(s){ return s.name === n; })[0] || {}).id; }).filter(Boolean)
    : [];
  var photo = (a.fields || []).filter(function(f){ return f[2] === 'file'; })[0];
  form.photo = photo && photo[1] ? { name: photo[1], url: '' } : null;

  if (a.members) {
    form.team['팀 이름'] = a.name;
    /* '(대표자) 학과'는 팀 신청서에 적혀 있지만 대표자가 답한 것이다 */
    form.people = a.members.map(function(m, i){
      var own = (i === 0 ? (a.fields || []) : []).concat(m.fields || []);
      var v = { '이름': m.name };
      SCHEMA.stu.person.forEach(function(f){
        if (f[0] !== '이름') v[f[0]] = answer(own, f[0]);
      });
      return v;
    });
  } else {
    SCHEMA.grad.team.forEach(function(f){
      form.team[f[0]] = f[0] === '이름' ? a.name : answer(a.fields, f[0]);
    });
  }
}

/* ════════════════════════════════════════════
   그리기
   ════════════════════════════════════════════ */

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function labelHTML(f) {
  return '<span class="label' + (f[2] ? ' label-required' : '') + '">' + esc(f[0]) + '</span>';
}

/* where — 'team' 이면 팀 답, 숫자면 그 사람의 답 */
function fieldHTML(f, where, val) {
  var at = 'onchange="put(\'' + where + '\', this.dataset.k, this.value)"';
  var box;
  if (f[1] === 'long') {
    box = '<textarea class="textarea textarea-auto" rows="3" data-k="' + esc(f[0]) + '" '
      + at + '>' + esc(val) + '</textarea>';
  } else if (f[1] === 'choice') {
    var nm = where + '-' + esc(f[0]);
    box = '<div class="choices">' + (f[3] || YESNO).map(function(o){
      return '<label class="choice">'
        + '<input type="radio" class="radio" name="' + nm + '" data-k="' + esc(f[0]) + '" '
        + 'value="' + esc(o) + '"' + (val === o ? ' checked' : '') + ' ' + at + '>'
        + esc(o) + '</label>';
    }).join('') + '</div>';
  } else if (f[1] === 'file') {
    box = photoHTML();
  } else {
    box = '<input type="text" class="input" data-k="' + esc(f[0]) + '" '
      + 'value="' + esc(val) + '" ' + at + '>';
  }
  return '<div class="field">' + labelHTML(f) + box + '</div>';
}

function photoHTML() {
  var p = form.photo;
  return '<div class="photo">'
    + '<div class="photo-frame">'
    +   (p && p.url ? '<img src="' + p.url + '" alt="">' : '')
    +   (p && !p.url ? '<i data-lucide="image"></i>' : '')
    +   (p ? '' : '<i data-lucide="image-plus"></i>')
    + '</div>'
    + '<div class="photo-side">'
    +   (p ? '<span class="photo-name">' + esc(p.name) + '</span>' : '')
    +   '<div class="photo-acts">'
    +     '<button type="button" class="btn btn-sm btn-line-dark btn-pill" onclick="pickPhoto()">'
    +       (p ? '사진 변경' : '사진 올리기') + '</button>'
    +     (p ? '<button type="button" class="btn btn-sm btn-weak-danger btn-pill" onclick="dropPhoto()">삭제</button>' : '')
    +   '</div>'
    + '</div>'
    + '</div>';
}

function ranksHTML() {
  return '<div class="field">'
    + '<span class="label">자리 우선순위</span>'
    + '<div class="ranks">' + SLOTS.map(function(s){
        var i = form.ranks.indexOf(s.id);
        return '<button type="button" class="rank' + (i > -1 ? ' is-picked' : '') + '" '
          + 'onclick="rank(\'' + s.id + '\')">'
          + (i > -1 ? '<em class="rank-no">' + (i + 1) + '</em>' : '')
          + esc(s.name) + '</button>';
      }).join('') + '</div>'
    + '</div>';
}

function personHTML(v, i) {
  return '<div class="person">'
    + '<div class="person-top">'
    +   '<span class="person-name">' + (i === 0 ? '대표자' : '팀원 ' + i) + '</span>'
    +   (i === 0 ? '' : '<button type="button" class="icon-btn icon-btn-sm icon-btn-clear" '
          + 'aria-label="팀원 ' + i + ' 빼기" onclick="dropPerson(' + i + ')"><i data-lucide="trash-2"></i></button>')
    + '</div>'
    + SCHEMA.stu.person.map(function(f){ return fieldHTML(f, i, v[f[0]] || ''); }).join('')
    + '</div>';
}

function render() {
  var s = SCHEMA[form.type];
  var html = '';

  html += '<div class="group">'
    + '<div class="field">'
    +   '<span class="label label-required">유형</span>'
    +   '<select class="select"' + (editing ? ' disabled' : '') + ' onchange="pickType(this.value)">'
    +     Object.keys(SCHEMA).map(function(id){
            return '<option value="' + id + '"' + (form.type === id ? ' selected' : '') + '>'
              + esc(SCHEMA[id].name) + '</option>';
          }).join('')
    +   '</select>'
    + '</div>'
    + '</div>';

  html += '<div class="group">'
    + '<div class="group-head"><span class="group-name">' + esc(s.name) + ' 신청 정보</span></div>'
    + s.team.map(function(f){ return fieldHTML(f, 'team', form.team[f[0]] || ''); }).join('')
    + (form.type === 'stu' ? ranksHTML() : '')
    + '</div>';

  if (s.person) {
    html += '<div class="group">'
      + '<div class="group-head"><span class="group-name">참석자 ' + form.people.length + '명</span>'
      +   '<button type="button" class="btn btn-sm btn-weak-primary" onclick="addPerson()">팀원 추가</button>'
      + '</div>'
      + '<div class="people">' + form.people.map(personHTML).join('') + '</div>'
      + '</div>';

    html += '<div class="group">'
      + '<div class="group-head"><span class="group-name">자리 배정</span></div>'
      + '<div class="field">'
      +   '<span class="label">배정 자리</span>'
      +   '<select class="select" onchange="form.slot = this.value">'
      +     '<option value=""' + (form.slot ? '' : ' selected') + '>미배정</option>'
      +     SLOTS.map(function(x){
              return '<option value="' + x.id + '"' + (form.slot === x.id ? ' selected' : '') + '>'
                + esc(x.name) + '</option>';
            }).join('')
      +   '</select>'
      + '</div>'
      + '</div>';
  }

  document.getElementById('sheet').innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

/* ════════════════════════════════════════════
   동작
   ════════════════════════════════════════════ */

function put(where, k, v) {
  if (where === 'team') form.team[k] = v;
  else form.people[Number(where)][k] = v;
}

function pickType(id) {
  if (editing || form.type === id) return;
  form.type = id;
  form.team = {};
  form.ranks = [];
  form.photo = null;
  form.people = id === 'stu' ? [{}] : [];
  render();
}

function rank(id) {
  var i = form.ranks.indexOf(id);
  if (i > -1) form.ranks.splice(i, 1); else form.ranks.push(id);
  render();
}

function addPerson() { form.people.push({}); render(); }
function dropPerson(i) { form.people.splice(i, 1); render(); }

function pickPhoto() { document.getElementById('photo-input').click(); }
function dropPhoto() { form.photo = null; render(); }
function tookPhoto(el) {
  var f = el.files && el.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function() { form.photo = { name: f.name, url: r.result }; render(); };
  r.readAsDataURL(f);
  el.value = '';
}

function leave() { location.href = 'index.html'; }

/* 대표자 이름이 팀 이름을 대신하지 않는다 — 둘 다 필요하다 */
function save(e) {
  if (e && e.preventDefault) e.preventDefault();
  var s = SCHEMA[form.type];
  var missing = s.team.filter(function(f){ return f[2] && !String(form.team[f[0]] || '').trim(); });
  if (s.person && form.people.length) {
    SCHEMA.stu.person.forEach(function(f){
      if (f[2] && !String(form.people[0][f[0]] || '').trim()) missing.push(f);
    });
  }
  if (missing.length) { showToast(missing[0][0] + ' 항목을 채워 주세요.'); return false; }
  showToast(esc(form.team[s.team[0][0]]) + ' 참석자를 ' + (editing ? '고쳤어요.' : '등록했어요.'));
  setTimeout(leave, 1200);
  return false;
}

var toastTimer = null;
function showToast(msg) {
  var wrap = document.getElementById('toast-container');
  wrap.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ wrap.innerHTML = ''; }, 2400);
}

var id = new URLSearchParams(location.search).get('id');
if (id) load(id);
if (!editing && form.type === 'stu') form.people = [{}];
if (editing) {
  document.title = '참석자 수정 — 26년 청춘건배';
  document.getElementById('title').textContent = '참석자 수정';
  document.getElementById('submit').textContent = '저장';
}
render();
lucide.createIcons();
</script>
</body>
</html>
