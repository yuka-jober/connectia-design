<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통계 — Connectia</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-base);
  background: #e0e0e0;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.frame {
  width: 390px;
  height: 844px;
  max-height: 100dvh;
  position: relative;
  overflow: hidden;
  box-shadow: 0 32px 80px -20px rgba(0,0,0,0.28);
  background: var(--color-surface);
  display: flex;
  flex-direction: column;
}
@media (max-width: 439px) { .frame { width: 100vw; height: 100dvh; max-height: none; } }
@media (min-width: 440px) { .frame { border-radius: 44px; max-height: calc(100dvh - 40px); } }

i[data-lucide] { display: inline-flex; flex-shrink: 0; }

/* ── Topbar ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 8px;
  flex-shrink: 0;
  background: var(--color-surface);
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.topbar-title {
  font-size: var(--fs-body-lg);
  font-weight: var(--fw-semibold);
  color: var(--color-text);
  letter-spacing: var(--ls-body-lg);
}
.page-subtitle {
  padding: 0 16px 12px;
  flex-shrink: 0;
}

/* ── Tabs ── */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--color-border);
  flex-shrink: 0;
  background: var(--color-surface);
  padding: 0 4px;
}
.tab {
  flex: 1;
  padding: 12px 0;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  color: var(--color-text-muted);
  text-align: center;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color var(--motion-fast) var(--ease-standard);
}
.tab.is-active {
  color: var(--color-text);
  font-weight: var(--fw-bold);
  border-bottom-color: var(--color-text);
}

/* ── Scroll body ── */
.body { flex: 1; overflow-y: auto; background: var(--color-bg); }
.inner { padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 12px; }

/* ── Period segmented control ── */
.period-seg {
  display: flex;
  background: var(--color-surface-sub);
  border-radius: var(--r-sm);
  padding: 3px;
  gap: 2px;
}
.period-seg-btn {
  flex: 1;
  padding: 8px 0;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  color: var(--color-text-muted);
  text-align: center;
  border-radius: var(--r-xs);
  cursor: pointer;
  border: none;
  background: transparent;
  font-family: var(--font-base);
  transition: all var(--motion-fast) var(--ease-standard);
}
.period-seg-btn.is-active {
  background: var(--color-surface);
  color: var(--color-text);
  font-weight: var(--fw-semibold);
  box-shadow: var(--shadow-1);
}

/* ── AI 응대 현황 카드 ── */
.status-card {
  background: var(--color-card);
  border-radius: var(--r-md);
  border: 1px solid var(--color-border);
  padding: 16px;
  transition: border-color var(--motion-standard) var(--ease-standard),
              background var(--motion-standard) var(--ease-standard);
}
.status-card.is-good    { border-color: rgba(34,197,94,0.35);  background: rgba(34,197,94,0.04); }
.status-card.is-warning { border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.04); }
.status-card.is-danger  { border-color: rgba(201,64,34,0.3);   background: rgba(201,64,34,0.04); }

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.card-title {
  font-size: var(--fs-heading);
  font-weight: var(--fw-semibold);
  color: var(--color-text);
  letter-spacing: var(--ls-heading);
}
.card-more {
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  color: var(--color-text-muted);
  cursor: pointer;
}

.rate-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 4px;
}
.rate-number {
  font-size: 52px;
  font-weight: var(--fw-bold);
  line-height: 1;
  letter-spacing: -2px;
  transition: color var(--motion-standard) var(--ease-standard);
}
.rate-pct {
  font-size: var(--fs-title);
  font-weight: var(--fw-semibold);
  transition: color var(--motion-standard) var(--ease-standard);
}
.rate-number.is-good, .rate-pct.is-good   { color: var(--color-success); }
.rate-number.is-warning, .rate-pct.is-warning { color: var(--color-star); }
.rate-number.is-danger, .rate-pct.is-danger   { color: var(--color-destructive); }

.rate-sub {
  font-size: var(--fs-body);
  color: var(--color-text-muted);
  margin-bottom: 4px;
}

/* 추세 sparkline */
.rate-sparkline { margin: 12px 0 8px; }
.sparkline-label {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  margin-bottom: 4px;
}
svg.sparkline { width: 100%; height: 52px; display: block; }

/* 액션 줄 */
.rate-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(201,64,34,0.08);
  border-radius: var(--r-xs);
  cursor: pointer;
  margin-top: 12px;
}
.rate-action-text {
  font-size: var(--fs-label);
  color: var(--color-destructive);
  font-weight: var(--fw-medium);
}

/* ── 인사이트 한 줄 ── */
.insight-card {
  background: var(--color-primary-light);
  border-radius: var(--r-md);
  padding: 12px 14px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.insight-icon { color: var(--color-primary); flex-shrink: 0; margin-top: 1px; }
.insight-text {
  font-size: var(--fs-label);
  color: var(--color-primary);
  font-weight: var(--fw-medium);
  line-height: 1.5;
}

/* ── 일반 카드 ── */
.card {
  background: var(--color-card);
  border-radius: var(--r-md);
  border: 1px solid var(--color-border);
  padding: 16px;
}

/* ── 핵심 지표 2열 ── */
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.metric-card {
  background: var(--color-surface-sub);
  border-radius: var(--r-sm);
  padding: 14px 14px 12px;
}
.metric-label {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  margin-bottom: 4px;
  line-height: 1.4;
}
.metric-value {
  font-size: var(--fs-metric);
  font-weight: var(--fw-bold);
  line-height: var(--lh-metric);
  letter-spacing: var(--ls-metric);
  color: var(--color-text);
  margin-bottom: 4px;
}
.metric-change {
  display: flex;
  align-items: center;
  gap: 3px;
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  line-height: 1.3;
}
.metric-change.up   { color: var(--color-success); }
.metric-change.down { color: var(--color-destructive); }
.metric-change.flat { color: var(--color-text-muted); }

/* ── 자주 묻는 질문 ── */
.faq-list { display: flex; flex-direction: column; }
.faq-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--color-border);
}
.faq-item:first-child { padding-top: 0; }
.faq-item:last-child  { border-bottom: none; padding-bottom: 0; }
.faq-q {
  font-size: var(--fs-body);
  color: var(--color-text);
  flex: 1;
  line-height: 1.45;
}

/* ── 최근 대화 ── */
.chat-list { display: flex; flex-direction: column; }
.chat-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--color-border);
  cursor: pointer;
}
.chat-item:first-child { padding-top: 0; }
.chat-item:last-child  { border-bottom: none; padding-bottom: 0; }
.chat-info { flex: 1; min-width: 0; }
.chat-name-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 2px;
}
.chat-name {
  font-size: var(--fs-label);
  font-weight: var(--fw-semibold);
  color: var(--color-text);
}
.chat-time {
  font-size: var(--fs-caption);
  color: var(--color-text-muted);
  flex-shrink: 0;
}
.chat-preview {
  font-size: var(--fs-body);
  color: var(--color-text-sub);
  line-height: 1.45;
}

/* ── 빈 상태 ── */
.empty-state {
  padding: 16px 0 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.empty-state-text {
  font-size: var(--fs-body);
  color: var(--color-text-muted);
  text-align: center;
  line-height: 1.6;
}
</style>
</head>

/* ── sparkline 렌더 ── */
function renderSparkline(values, status) {
  const svg = document.getElementById('sparklineSvg');
  const W = 340, H = 52, pad = 4;
  const n = values.length;
  const min = Math.min(...values) - 8;
  const max = Math.max(...values) + 8;
  const toX = i => (i / (n - 1)) * (W - pad * 2) + pad;
  const toY = v => H - pad - ((v - min) / (max - min)) * (H - pad * 2);

  const colorMap = { good: 'var(--color-success)', warning: 'var(--color-star)', danger: 'var(--color-destructive)' };
  const col = colorMap[status];

  const pts = values.map((v, i) => `${toX(i)},${toY(v)}`).join(' ');
  const fillPts = [
    `${pad},${H}`,
    ...values.map((v, i) => `${toX(i)},${toY(v)}`),
    `${W - pad},${H}`,
  ].join(' ');

  svg.innerHTML = `
    <polygon points="${fillPts}" fill="${col}" opacity="0.08"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <circle cx="${toX(n-1)}" cy="${toY(values[n-1])}" r="3.5" fill="${col}"/>
  `;
}

/* ── FAQ ── */
function renderFaq(items) {
  const el = document.getElementById('faqList');
  if (!items.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-state-text">이 기간에는 자주 묻는 질문이 없어요</div></div>`;
    return;
  }
  el.innerHTML = items.map(it => `
    <div class="faq-item">
      <span class="badge badge-md badge-weak-dark">${it.count}건</span>
      <span class="faq-q">${it.q}</span>
    </div>
  `).join('');
}

/* ── 최근 대화 ── */
function renderChats(items) {
  const el = document.getElementById('chatList');
  if (!items.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-state-text">이 기간에는 대화가 없었어요</div></div>`;
    return;
  }
  el.innerHTML = items.map(it => `
    <div class="chat-item">
      <div class="avatar avatar-sm"></div>
      <div class="chat-info">
        <div class="chat-name-row">
          <span class="chat-name">${it.name}</span>
          <span class="chat-time">${it.time}</span>
        </div>
        <div class="chat-preview">${it.q}</div>
      </div>
    </div>
  `).join('');
}

/* ── 메트릭 변화 아이콘 ── */
function changeIcon(dir) {
  if (dir === 'up')   return `<i data-lucide="trending-up" style="width:12px;height:12px"></i>`;
  if (dir === 'down') return `<i data-lucide="trending-down" style="width:12px;height:12px"></i>`;
  return `<i data-lucide="minus" style="width:12px;height:12px"></i>`;
}

/* ── 전체 화면 업데이트 ── */
function update(period) {
  const d = DATA[period];
  const sc = d.status; // good | warning | danger
  const badgeStyle = { good: 'badge-weak-primary', warning: 'badge-weak-dark', danger: 'badge-weak-danger' }[sc];
  const badgeText  = { good: '양호', warning: '주의', danger: '경고' }[sc];
  const statusCls  = 'is-' + sc;

  // AI 응대 현황 카드
  document.getElementById('responseCard').className = `status-card ${statusCls}`;
  document.getElementById('statusBadge').className  = `badge badge-md ${badgeStyle}`;
  document.getElementById('statusBadge').textContent = badgeText;
  document.getElementById('rateNumber').className   = `rate-number ${statusCls}`;
  document.getElementById('rateNumber').textContent  = d.rate;
  document.getElementById('ratePct').className      = `rate-pct ${statusCls}`;
  document.getElementById('rateSub').textContent    = d.rateSub;

  // Sparkline
  const sw = document.getElementById('sparklineWrap');
  if (d.sparklines) {
    sw.style.display = 'block';
    renderSparkline(d.sparklines, sc);
  } else {
    sw.style.display = 'none';
  }

  // 액션 줄
  const ra = document.getElementById('rateAction');
  if (d.unanswered > 0) {
    ra.style.display = 'flex';
    document.getElementById('rateActionText').textContent = `답변 못한 질문 ${d.unanswered}건 확인하기`;
  } else {
    ra.style.display = 'none';
  }

  // 인사이트
  document.getElementById('insightText').textContent = d.insight;

  // 핵심 지표
  document.getElementById('metricChats').textContent = d.chats;
  const cc = document.getElementById('metricChatsChange');
  cc.className = `metric-change ${d.chatsChange.dir}`;
  cc.innerHTML = `${changeIcon(d.chatsChange.dir)} ${d.chatsChange.label}`;

  document.getElementById('metricViews').textContent = d.views;
  const vc = document.getElementById('metricViewsChange');
  vc.className = `metric-change ${d.viewsChange.dir}`;
  vc.innerHTML = `${changeIcon(d.viewsChange.dir)} ${d.viewsChange.label}`;

  // 자주 묻는 질문 / 최근 대화
  renderFaq(d.faq);
  renderChats(d.chats_list);

  lucide.createIcons();
}

/* ── 이벤트 ── */
document.getElementById('periodSeg').addEventListener('click', e => {
  const btn = e.target.closest('.period-seg-btn');
  if (!btn) return;
  document.querySelectorAll('.period-seg-btn').forEach(b => b.classList.remove('is-active'));
  btn.classList.add('is-active');
  update(btn.dataset.period);
});

// 초기 렌더
update('today');
</script>
